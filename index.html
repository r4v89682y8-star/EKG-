<div id="app"></div>

<script>
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* مُبلِّغ الأخطاء: يعرض أي خلل على الشاشة مباشرة بدل بقائه مخفيًا في الكونسول */
function showError(msg){
  let b=document.getElementById('errbar');
  if(!b){ b=document.createElement('div'); b.id='errbar';
    b.style.cssText='position:fixed;bottom:0;right:0;left:0;z-index:99;background:#A93838;color:#fff;padding:.7rem 1rem;font-size:.85rem;direction:rtl;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start';
    document.body.appendChild(b); }
  b.innerHTML='<span style="flex:1">'+msg+'</span><button onclick="this.parentNode.remove()" style="font-weight:700">إغلاق</button>';
}
window.onerror=(m,src,line)=>{ showError('خطأ: '+m+' (سطر '+line+')'); };
window.onunhandledrejection=e=>{ showError('خطأ: '+(e.reason?.message||e.reason)); };
const guard=fn=>(...a)=>{ try{ const r=fn(...a); if(r&&r.catch) r.catch(e=>showError('خطأ: '+(e.message||e))); return r; }catch(e){ showError('خطأ: '+(e.message||e)); } };
const app = document.getElementById('app');
let user=null, tab='dash', navOpen=false;

const TABS = [
  { id:'dash',       label:'لوحة المالك', icon:'M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z' },
  { id:'collection', label:'التحصيل',     icon:'M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6' },
  { id:'buildings',  label:'المباني',     icon:'M3 21h18M5 21V7l7-4 7 4v14M9 21v-5h6v5' },
  { id:'finance',    label:'المالية',     icon:'M3 3v18h18M7 15l4-5 3 3 5-7' },
  { id:'maint',      label:'الصيانة',     icon:'M14.7 6.3a4 4 0 01-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 015.4-5.4l-2.1 2.1-2.8-2.8z' },
  { id:'staff',      label:'العمال والرواتب', icon:'M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M13 7a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0M22 11h-6' },
  { id:'leases',     label:'العقود',      icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z' },
  { id:'units',      label:'الوحدات',     icon:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z' },
  { id:'tenants',    label:'المستأجرون',  icon:'M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M13 7a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0M22 20v-2a4 4 0 00-3-3.87' },
];

const money = n => Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);
/** تحويل آمن للتاريخ — يمنع انهيار الواجهة عند تاريخ ناقص أو غير صالح */
const ymd = d => { const x=(d instanceof Date)?d:new Date(d); return isNaN(x.getTime())?null:x.toISOString().slice(0,10); };
const isValidDate = d => !!d && !isNaN(new Date(d).getTime());
let YR = String(new Date().getFullYear());
const THIS_YEAR = String(new Date().getFullYear());
function setYear(y){ YR=y; route(); }
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ───── الفترة: شهر أو سنة ───── */
let PMODE='year';                                   // year | month
let PMONTH=String(new Date().getMonth()+1).padStart(2,'0');

const periodKey   = () => PMODE==='year' ? YR : `${YR}-${PMONTH}`;
const inPeriod    = d => !!d && d.startsWith(periodKey());
const periodLabel = () => PMODE==='year' ? `سنة ${YR}` : `${MONTHS[Number(PMONTH)-1]} ${YR}`;

function setPeriod(mode,val){
  if(mode==='mode') PMODE=val;
  else if(mode==='year') YR=val;
  else PMONTH=val;
  route();
}

const periodPicker = () => {
  const y=Number(THIS_YEAR), years=[y+1,y,y-1,y-2];
  return `<div class="flex flex-wrap items-center gap-2">
    <div class="inline-flex bg-white border border-paper-200 rounded-xl p-1">
      <button onclick="setPeriod('mode','year')"  class="px-3 py-1.5 rounded-lg text-sm ${PMODE==='year'?'bg-teal-900 text-white font-semibold':'text-ink-500'}">سنوي</button>
      <button onclick="setPeriod('mode','month')" class="px-3 py-1.5 rounded-lg text-sm ${PMODE==='month'?'bg-teal-900 text-white font-semibold':'text-ink-500'}">شهري</button>
    </div>
    ${PMODE==='month'?`<select onchange="setPeriod('month',this.value)" class="field w-auto py-1.5 text-sm">
      ${MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${v===PMONTH?'selected':''}>${m}</option>`;}).join('')}
    </select>`:''}
    <select onchange="setPeriod('year',this.value)" class="field w-auto py-1.5 text-sm num">
      ${years.map(v=>`<option value="${v}" ${String(v)===YR?'selected':''}>${v}</option>`).join('')}
    </select>
  </div>`;
};

/** حارس ضد الضغط المزدوج على أزرار الحفظ */
const busy=new Set();
async function once(key,btn,fn){
  if(busy.has(key)) return;
  busy.add(key);
  const el=btn&&document.activeElement; const label=el?.textContent;
  if(el){ el.disabled=true; el.textContent='جارٍ الحفظ…'; }
  try{ await fn(); } finally { busy.delete(key); if(el&&document.contains(el)){ el.disabled=false; el.textContent=label; } }
}

/* ───── auth ───── */
async function init(){ const {data:{session}} = await db.auth.getSession(); user=session?.user||null; paint(); }
db.auth.onAuthStateChange((_e,s)=>{ user=s?.user||null; paint(); });
const paint = () => user ? shell() : loginView();

function loginView(){
  app.innerHTML=`
  <div class="min-h-screen grid place-items-center px-5">
    <div class="w-full max-w-sm fade">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-teal-900 mx-auto grid place-items-center mb-4">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>
        </div>
        <h1 class="text-3xl font-bold">${BRAND}</h1>
        <p class="text-ink-500 mt-1">${BRAND_SUB}</p>
        <p class="text-xs text-ink-300 mt-2">الإصدار <span class="num">${VERSION}</span></p>
      </div>
      <div class="card p-7">
        <label class="eyebrow block mb-2">البريد الإلكتروني</label>
        <input id="em" type="email" class="field mb-4" dir="ltr">
        <label class="eyebrow block mb-2">كلمة السر</label>
        <input id="pw" type="password" class="field" dir="ltr">
        <p id="er" class="text-rose-600 text-sm mt-3 hidden"></p>
        <button onclick="login()" class="btn-primary w-full mt-6">دخول</button>
      </div>
    </div>
  </div>`;
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
}
async function login(){
  const {error} = await db.auth.signInWithPassword({ email:em.value.trim(), password:pw.value });
  if(error){ const b=document.getElementById('er'); b.textContent='البريد أو كلمة السر غير صحيحة.'; b.classList.remove('hidden'); }
}
const logout = () => db.auth.signOut();

/* ───── shell ───── */
function shell(){
  app.innerHTML=`
  <div class="flex min-h-screen">
    <aside class="hidden lg:flex flex-col w-64 shrink-0 bg-white/85 backdrop-blur border-l border-paper-100 p-4">
      ${brandBlock()}
      <nav class="space-y-1 mt-7">${TABS.map(navBtn).join('')}</nav>
      <button onclick="logout()" class="navlink mt-auto text-ink-500 text-sm">تسجيل الخروج</button>
    </aside>
    <div class="flex-1 min-w-0">
      <header class="lg:hidden sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-paper-100 px-4 h-14 flex items-center justify-between">
        <button onclick="toggleNav()" aria-label="القائمة"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#39434F" stroke-width="1.8" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <span class="font-bold display">${BRAND} <span class="text-xs font-normal text-ink-300 num">${VERSION}</span></span>
        <button onclick="logout()" class="text-sm text-ink-500">خروج</button>
      </header>
      <div id="drawer" class="hidden lg:hidden fixed inset-0 z-30">
        <div class="absolute inset-0 bg-ink-900/45" onclick="toggleNav()"></div>
        <div class="absolute top-0 right-0 h-full w-64 bg-white p-4">${brandBlock()}<nav class="space-y-1 mt-7">${TABS.map(navBtn).join('')}</nav></div>
      </div>
      <main id="main" class="p-4 sm:p-6 lg:p-9 max-w-5xl"></main>
    </div>
  </div>`;
  route();
}
const brandBlock = () => `
  <div class="flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-xl bg-teal-900 grid place-items-center shrink-0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>
    </div>
    <div class="leading-tight"><p class="font-bold display">${BRAND}</p><p class="text-xs text-ink-500">${BRAND_SUB} · <span class="num">${VERSION}</span></p></div>
  </div>`;
const navBtn = t => `<button onclick="go('${t.id}')" class="navlink ${tab===t.id?'on':''}">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="${t.icon}"/></svg>${t.label}</button>`;
function toggleNav(){ navOpen=!navOpen; document.getElementById('drawer').classList.toggle('hidden',!navOpen); }
function go(t){ tab=t; navOpen=false; shell(); }
function route(){ ({dash:dashView,collection:collectionView,buildings:buildingsView,finance:financeView,maint:maintView,staff:staffView,leases:leasesView,units:unitsView,tenants:tenantsView})[tab](); }
const head=(t,s)=>`<div class="mb-7"><h1 class="text-2xl font-bold">${t}</h1><p class="text-ink-500 mt-1">${s}</p></div>`;
const empty=m=>`<div class="card p-10 text-center text-ink-500">${m}</div>`;

/* ───── data ───── */
let tenants=[],units=[],leases=[],payments=[],expenses=[],readings=[],maint=[],staff=[],buildings=[];
const load = {
  tenants: async q=>{ let r=db.from('tenants').select('*').order('created_at',{ascending:false}); if(q) r=r.or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`); tenants=(await r).data||[]; },
  units:   async ()=>{ units=(await db.from('units').select('*').order('building_name')).data||[]; },
  buildings: async ()=>{
    buildings=(await db.from('buildings').select('*').order('name')).data||[];
    // أي مبنى مذكور في الوحدات ولم يُسجّل بعد يظهر افتراضيًا كمملوك
    const known=new Set(buildings.map(b=>b.name));
    [...new Set(units.map(u=>u.building_name))].filter(n=>n&&!known.has(n))
      .forEach(n=>buildings.push({name:n,ownership:'owned',management_fee_pct:0,_ghost:true}));
    buildings.sort((a,b)=>a.name.localeCompare(b.name));
  },
  maint:   async ()=>{ maint=(await db.from('maintenance').select('*').order('service_date',{ascending:false})).data||[]; },
  staff:   async ()=>{ staff=(await db.from('employees').select('*').order('full_name')).data||[]; },
  leases:  async ()=>{ leases=(await db.from('leases').select('*, tenants(full_name,phone), units(building_name,unit_number)').order('created_at',{ascending:false})).data||[]; },
  payments:async ()=>{ payments=(await db.from('payments').select('*, leases(unit_id, monthly_rent, tenants(full_name), units(building_name,unit_number))').order('due_date')).data||[]; },
  expenses:async ()=>{ expenses=(await db.from('expenses').select('*').order('expense_date',{ascending:false})).data||[]; },
  readings:async ()=>{ readings=(await db.from('meter_readings').select('*').order('reading_date',{ascending:false})).data||[]; },
};
const sumPaid = a => a.reduce((s,p)=>s+Number(p.paid_amount??p.amount),0);
const sumAmt  = a => a.reduce((s,p)=>s+Number(p.amount),0);

/* ───── لوحة المالك: فصل الذمم بين ما نملكه وما نديره للغير ───── */
async function dashView(){
  const m=document.getElementById('main');
  m.innerHTML=`<p class="text-ink-500">جارٍ التحميل…</p>`;
  await Promise.all([load.units(),load.leases(),load.payments(),load.expenses(),load.buildings()]);

  const rows=buildings.map(b=>bookFor(b.name));
  const owned  =rows.filter(r=>r.ownership==='owned');
  const managed=rows.filter(r=>r.ownership==='managed');
  const sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);

  m.innerHTML=`
  <div class="mb-6 flex flex-wrap items-end justify-between gap-3">
    <div><h1 class="text-2xl font-bold">لوحة المالك</h1><p class="text-ink-500 mt-1">${periodLabel()}</p></div>
    ${periodPicker()}
  </div>
  <div class="fade space-y-7">

    ${bookBlock('مبانٍ مملوكة', owned, 'الإيراد والصافي يخصّ الشركة بالكامل')}
    ${bookBlock('مبانٍ تحت الإدارة', managed, 'الصافي يخصّ المُلّاك، وللشركة أتعاب الإدارة')}

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${stat('إجمالي المحصّل', sum(rows,'collected'), 'كل المباني','teal-700')}
      ${stat('إجمالي المتأخرات', sum(rows,'overdue'), 'مستحقة ولم تُسدد','rose-600')}
      ${stat('إجمالي المصروفات', sum(rows,'exp'), 'تشغيل وصيانة ورواتب','amber-600')}
      ${stat('أتعاب الإدارة', sum(managed,'fee'), 'من المباني المُدارة','ink-900')}
    </div>

    <div class="card p-5">
      <div class="flex items-end justify-between mb-4">
        <div><p class="eyebrow">الإشغال</p>
          <p class="text-3xl font-bold display mt-1"><span class="num">${units.length?Math.round(units.filter(u=>u.status==='occupied').length/units.length*100):0}</span>%</p></div>
        <p class="text-sm text-ink-500"><span class="num">${units.filter(u=>u.status==='occupied').length}</span> مؤجّرة من <span class="num">${units.length}</span> · <span class="num">${leases.filter(l=>l.status==='active').length}</span> عقد ساري</p>
      </div>
      <div class="flex gap-1 flex-wrap">${units.map(u=>`<span title="${u.building_name} ${u.unit_number}" class="h-5 flex-1 min-w-[10px] rounded ${u.status==='occupied'?'bg-teal-700':u.status==='maintenance'?'bg-amber-600':'bg-paper-200'}"></span>`).join('')||'<span class="text-sm text-ink-300">لا وحدات</span>'}</div>
    </div>
  </div>`;
}

/** كشف مبنى واحد في الفترة المختارة — أساس فصل الذمم */
function bookFor(name){
  const b=buildings.find(x=>x.name===name)||{name,ownership:'owned',management_fee_pct:0};
  const ids=units.filter(u=>u.building_name===name).map(u=>u.id);
  const p=payments.filter(x=>ids.includes(x.leases?.unit_id)&&inPeriod(x.due_date));
  const e=expenses.filter(x=>x.building_name===name&&inPeriod(x.expense_date));
  const collected=sumPaid(p.filter(x=>x.status==='paid'));
  const exp=e.reduce((s,x)=>s+Number(x.amount),0);
  const fee=b.ownership==='managed'?Math.round(collected*Number(b.management_fee_pct||0)/100):0;
  return { name, ownership:b.ownership, owner_name:b.owner_name, pct:Number(b.management_fee_pct||0),
    unitsTotal:ids.length, occupied:units.filter(u=>u.building_name===name&&u.status==='occupied').length,
    contracted:sumAmt(p), collected, overdue:sumAmt(p.filter(x=>x.status==='pending'&&x.due_date<today())),
    exp, fee, net:collected-exp, dueOwner:collected-exp-fee };
}

const MK={
  heater:['سخان','سخانات','بويلر'],
  dynamo:['دينمو','دينامو','مضخة','مضخه','طرمبة','طرمبه','غطاس'],
  elevator:['مصعد','اصنصير','اسانسير','ليفت'],
  plumbing:['سباك','سباكة','سباكه','تسريب','صرف','مجاري','خزان','مواسير','ماسورة','ماسوره','حنفية','حنفيه','خلاط','سيفون'],
  electrical:['كهرب','تماس','قاطع','لمبة','لمبه','لمبات','اضاءة','مفتاح'],
  ac:['مكيف','تكييف','سبليت','فريون','كمبروسر'],
  paint:['دهان','صبغ','ترميم','بوية','بويه','جبس','سيراميك','بلاط'],
};
const ARD={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const norm = t => (t||'').replace(/[٠-٩]/g,d=>ARD[d]).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();

function parseNote(text){
  const t=norm(text);
  const out={category:'other',building:null,units:[],amount:null,unitIds:[],unknownUnits:[],description:(text||'').trim()};

  let best=null;
  buildings.map(b=>b.name).forEach(b=>{ const nb=norm(b); if(nb&&t.includes(nb)&&(!best||nb.length>norm(best).length)) best=b; });
  out.building=best;

  const m=t.match(/(?:شقه|شقق|وحده|وحدات|محل|محلات|مكتب|مكاتب|رقم)\s*((?:\d+[\s,و]*)+)/);
  const cand=m?m[1].split(/[\s,و]+/).filter(x=>/^\d+$/.test(x)):[];
  const real=units.filter(u=>!out.building||u.building_name===out.building);
  const matched=cand.filter(n=>real.some(u=>String(u.unit_number)===n));
  const leftover=cand.filter(n=>!matched.includes(n));
  out.units = matched.length?matched:cand;
  out.unitIds = real.filter(u=>out.units.includes(String(u.unit_number))).map(u=>u.id);
  out.unknownUnits = out.units.filter(n=>!real.some(u=>String(u.unit_number)===n));

  const near=t.match(/(\d+(?:[.,]\d+)?)\s*(?:ريال|ر\.?س|sar)/i)||t.match(/(?:ريال|ر\.?س)\s*(\d+(?:[.,]\d+)?)/i);
  if(near) out.amount=Number(near[1].replace(',',''));
  else{
    const used=new Set(matched);
    const pool=(t.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>Number(x.replace(',',''))).filter(n=>!used.has(String(n)));
    const pref=pool.filter(n=>leftover.includes(String(n)));
    out.amount = pref.length?Math.max(...pref) : (pool.length?Math.max(...pool):null);
  }

  for(const [c,w] of Object.entries(MK)){ if(w.some(x=>t.includes(norm(x)))){ out.category=c; break; } }
  return out;
}

async function addMaint(){
  const building_name=document.getElementById('mt_b').value,
        category=document.getElementById('mt_c').value,
        cost=Number(document.getElementById('mt_cost').value),
        service_date=document.getElementById('mt_d').value,
        vendor=document.getElementById('mt_v').value.trim()||null,
        description=document.getElementById('mt_desc').value.trim()||null,
        perUnit=document.querySelector('input[name=scope]:checked').value==='units',
        unit_ids=[...document.querySelectorAll('.mt_u:checked')].map(c=>c.value),
        err=document.getElementById('mt_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!building_name||!cost||!service_date) return fail('المبنى والتكلفة والتاريخ مطلوبة.');
  if(perUnit && !unit_ids.length) return fail('اختر الوحدات المستفيدة، أو حمّل التكلفة على المبنى كامل.');

  const status=document.getElementById('mt_st').value;
  const {data,error}=await db.from('maintenance').insert({
    building_name,category,description,cost,vendor,service_date,status,
    scope: perUnit?'units':'building', unit_ids: perUnit?unit_ids:[]
  }).select().single();
  if(error) return fail('تعذّر الحفظ: '+error.message);
  if(status!=='done'){ maintView(); return; }   // التكلفة تُقيَّد عند الإنجاز فقط

  // تُقيَّد التكلفة في المصروفات تلقائيًا حتى تظهر في المالية ولوحة المالك
  const rows = perUnit
    ? unit_ids.map(uid=>({ building_name, category:'maintenance', amount:Math.round(cost/unit_ids.length),
        expense_date:service_date, unit_id:uid, source:'maintenance', ref_id:data.id,
        notes:`${MAINT_CATS[category]}${description?' — '+description:''}` }))
    : [{ building_name, category:'maintenance', amount:cost, expense_date:service_date,
        source:'maintenance', ref_id:data.id, notes:`${MAINT_CATS[category]} (مشترك)${description?' — '+description:''}` }];
  await db.from('expenses').insert(rows);
  maintView();
}

    return `<div class="card p-4">

async function finishMaint(id){

  await db.from('maintenance').update({status:'done'}).eq('id',id);

  maintView();
}

/** قيد تكلفة الصيانة في المصروفات — على الوحدات المحددة أو على المبنى */
async function postMaintExpense(x){
  const ids=x.unit_ids||[];
  const rows = ids.length
    ? ids.map(uid=>({ building_name:x.building_name, category:'maintenance', amount:Math.round(x.cost/ids.length),
        expense_date:x.service_date, unit_id:uid, source:'maintenance', ref_id:x.id,
        notes:`${MAINT_CATS[x.category]||x.category}${x.description?' — '+x.description:''}` }))
    : [{ building_name:x.building_name, category:'maintenance', amount:x.cost, expense_date:x.service_date,
        source:'maintenance', ref_id:x.id, notes:`${MAINT_CATS[x.category]||x.category} (مشترك)${x.description?' — '+x.description:''}` }];
  await db.from('expenses').insert(rows);
}

async function deleteMaint(id){
  if(!confirm('حذف عمل الصيانة وقيوده في المصروفات؟')) return;
  await db.from('expenses').delete().eq('ref_id',id).eq('source','maintenance');
  const {error}=await db.from('maintenance').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف. حاول مرة أخرى.');
  maintView();
}

let savingLease=false;
async function addLease(){
  if(savingLease) return;
  const btn=document.activeElement;
  const tenant_id=l_tenant.value,unit_id=l_unit.value,start_date=l_start.value,end_date=l_end.value,
        annual=Number(l_rent.value),count=Number(l_count.value),err=document.getElementById('l_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!tenant_id||!unit_id||!start_date||!end_date||!annual) return fail('أكمل كل الحقول قبل الحفظ.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');

  savingLease=true;
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الحفظ…'; }
  try{
    // تحقق لحظي: لا عقدين ساريين على نفس الوحدة
    const {data:clash}=await db.from('leases').select('id').eq('unit_id',unit_id).eq('status','active');
    if(clash&&clash.length){ return fail('هذه الوحدة عليها عقد ساري بالفعل. حدّث الصفحة واختر وحدة أخرى.'); }

    const {data,error}=await db.from('leases').insert({
      tenant_id,unit_id,start_date,end_date,status:'active',
      annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12)
    }).select().single();
    if(error) return fail('تعذّر حفظ العقد: '+error.message);

    await db.from('units').update({status:'occupied'}).eq('id',unit_id);
    await db.from('payments').insert(buildSchedule(data.id,start_date,end_date,annual,count));
    go('collection');
  } finally {
    savingLease=false;
    if(btn&&document.contains(btn)){ btn.disabled=false; btn.textContent='حفظ العقد وتفعيله'; }
  }
}

/** دفعة لكل قسط: المبلغ = الإيجار السنوي ÷ عدد الدفعات، والفاصل = ١٢ ÷ عدد الدفعات بالأشهر */
function buildSchedule(lease_id,start,end,annual,count){
  const n=Math.max(1,Math.round(Number(count)||1));
  if(!isValidDate(start)||!isValidDate(end)) return [];
  const rows=[], last=new Date(end), d=new Date(start),
        step=Math.max(1,Math.round(12/n)), amount=Math.round(Number(annual||0)/n);
  let guardCount=0;
  while(d<=last && guardCount++<600){                 // سقف أمان يمنع أي دوران لا نهائي
    const v=ymd(d); if(!v) break;
    rows.push({lease_id,due_date:v,amount,status:'pending'});
    d.setMonth(d.getMonth()+step);
  }
  return rows;
}

async function saveLeaseEdit(id,unitId){
  const start_date=le_s.value, end_date=le_e.value, annual=Number(le_r.value),
        count=Number(le_c.value), status=le_st.value, regen=le_regen.checked,
        err=document.getElementById('le_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!start_date||!end_date||!annual) return fail('التواريخ والإيجار مطلوبة.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');
  if(regen && !confirm('سيُحذف جدول الدفعات الحالي بالكامل ويُولَّد من جديد. متابعة؟')) return;

  const {error}=await db.from('leases').update({ start_date, end_date, status,
    annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12) }).eq('id',id);
  if(error) return fail('تعذّر الحفظ: '+error.message);

  if(regen){
    await db.from('payments').delete().eq('lease_id',id);
    await db.from('payments').insert(buildSchedule(id,start_date,end_date,annual,count));
  }
  await db.from('units').update({ status: (status==='active'||status==='renewed') ? 'occupied' : 'vacant' }).eq('id',unitId);
  closeModal(); leasesView();
}

async function endLease(id,unitId){
  const future=payments.filter(p=>p.lease_id===id&&p.status==='pending'&&p.due_date>today()).length;
  if(!confirm(`إنهاء هذا العقد وإرجاع الوحدة إلى الشواغر؟${future?`\nسيتم إلغاء ${future} دفعة مستقبلية لم تُستحق بعد.`:''}`)) return;
  await db.from('leases').update({status:'terminated'}).eq('id',id);
  await db.from('units').update({status:'vacant'}).eq('id',unitId);
  // الدفعات المستقبلية غير المستحقة تُلغى حتى لا تظهر كمتأخرات وهمية
  await db.from('payments').delete().eq('lease_id',id).eq('status','pending').gt('due_date',today());
  leasesView();
}

async function deleteUnit(id){
  await load.leases();                                  // بيانات محدّثة دائمًا قبل الفحص
  const mine=leases.filter(l=>l.unit_id===id);
  const active=mine.filter(l=>l.status==='active');

  const msg = mine.length
    ? `هذه الوحدة لها ${mine.length} عقد منتهٍ في السجل. حذفها سيحذف تلك العقود ودفعاتها نهائيًا. متابعة؟`

  if(mine.length){
    await db.from('payments').delete().in('lease_id',mine.map(l=>l.id));
    const del=await db.from('leases').delete().in('id',mine.map(l=>l.id));
    if(del.error) return alert('تعذّر حذف عقود هذه الوحدة: '+del.error.message);

  await db.from('meter_readings').delete().eq('unit_id',id);
  await db.from('expenses').delete().eq('unit_id',id);

  const {error}=await db.from('units').delete().eq('id',id);

  closeModal(); unitsView();
}

async function addTenant(){
  const full_name=t_n.value.trim(),phone=t_p.value.trim(),national_id=t_i.value.trim(),err=document.getElementById('t_err');
  err.classList.add('hidden');
  if(!full_name||!phone){ err.textContent='الاسم ورقم الجوال مطلوبان.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('tenants').insert({full_name,phone,national_id:national_id||null});
  if(error){ err.textContent=error.code==='23505'?'رقم الجوال أو الهوية مسجّل لمستأجر آخر.':'تعذّرت الإضافة. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  tenantsView();
}
function openTenantEdit(id){
  const t=tenants.find(x=>x.id===id);
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4 overflow-y-auto';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
  <div class="card relative w-full max-w-md p-6 fade my-8">
    <h3 class="font-bold text-xl mb-5">تعديل بيانات المستأجر</h3>
    <label class="eyebrow block mb-2">الاسم الكامل</label><input id="te_name" class="field mb-4" value="${t.full_name||''}">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="eyebrow block mb-2">رقم الجوال</label><input id="te_phone" class="field" dir="ltr" value="${t.phone||''}"></div>
      <div><label class="eyebrow block mb-2">رقم الهوية</label><input id="te_id" class="field" dir="ltr" value="${t.national_id||''}"></div>
    </div>
    <p id="te_err" class="text-rose-600 text-sm mt-3 hidden"></p>
    <div class="flex gap-2 mt-5">
      <button onclick="saveTenantEdit('${t.id}')" class="btn-primary flex-1">حفظ التعديلات</button>
      <button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button>
    </div>
    <button onclick="deleteTenant('${t.id}')" class="text-sm text-rose-600 mt-4 w-full">حذف المستأجر</button>
  </div>`;
  document.body.appendChild(w);
}
async function saveTenantEdit(id){
  const full_name=document.getElementById('te_name').value.trim(),
        phone=document.getElementById('te_phone').value.trim(),
        national_id=document.getElementById('te_id').value.trim(),
        err=document.getElementById('te_err');
  err.classList.add('hidden');
  if(!full_name||!phone){ err.textContent='الاسم ورقم الجوال مطلوبان.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('tenants').update({full_name,phone,national_id:national_id||null}).eq('id',id);
  if(error){ err.textContent=error.code==='23505'?'رقم الجوال أو الهوية مسجّل لمستأجر آخر.':'تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  closeModal(); await load.tenants(tq); renderTenants();
}
async function deleteTenant(id){
  await load.leases();
  const own=leases.filter(l=>l.tenant_id===id);
  const act=own.filter(l=>l.status==='active');
  if(act.length) return alert('هذا المستأجر عليه عقد ساري. أنهِ العقد أولاً.');
  if(!confirm(own.length?`سيُحذف المستأجر و${own.length} عقد منتهٍ ودفعاتها. متابعة؟`:'حذف هذا المستأجر نهائيًا؟')) return;
  if(own.length) await db.from('leases').delete().in('id',own.map(l=>l.id));
  const {error}=await db.from('tenants').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف — المستأجر مرتبط بسجلات أخرى.');
  closeModal(); await load.tenants(tq); renderTenants();
}
async function blockTenant(id){
  await load.leases();
  if(leases.some(l=>l.tenant_id===id&&l.status==='active'))
    if(!confirm('هذا المستأجر عليه عقد ساري. إدراجه في القائمة السوداء لن يُنهي العقد. متابعة؟')) return;
  const reason=prompt('سبب الإدراج في القائمة السوداء:');
  if(!reason||reason.trim().length<3) return;
  await db.from('tenants').update({status:'blacklisted',blacklist_reason:reason,blacklisted_at:new Date().toISOString()}).eq('id',id);
  await load.tenants(tq); renderTenants();
}
async function unblockTenant(id){
  await db.from('tenants').update({status:'active',blacklist_reason:null,blacklisted_at:null}).eq('id',id);
  await load.tenants(tq); renderTenants();
}

init();
</script>
