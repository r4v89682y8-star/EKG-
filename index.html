<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اصول — إدارة الأملاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme:{ extend:{
  colors:{
    ink:{900:'#0E1621',700:'#39434F',500:'#6C7683',300:'#AAB2BC'},
    paper:{0:'#FFFFFF',50:'#F6F8F9',100:'#EDF0F2',200:'#DFE4E8'},
    teal:{900:'#083A31',700:'#0E5B4C',600:'#137A65',300:'#7FC4B2',100:'#DCEFE9'},
    amber:{600:'#A97015',100:'#FAEDD6'},
    rose:{600:'#A93838',100:'#FAE1E1'},
  },
  fontFamily:{ sans:['"IBM Plex Sans Arabic"','system-ui','sans-serif'], display:['"Readex Pro"','system-ui','sans-serif'], num:['Rubik','system-ui','sans-serif'] },
}}}
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  html { font-size:17px; }
  body { font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; color:#0E1621;
         background:
           radial-gradient(1100px 480px at 88% -8%, #E4F2ED 0%, transparent 62%),
           radial-gradient(900px 420px at 4% 4%, #F2EDE3 0%, transparent 55%),
           #F6F8F9;
         background-attachment:fixed; }
  h1,h2,h3,.display { font-family:'Readex Pro',system-ui,sans-serif; letter-spacing:-.015em; }
  .num { font-family:Rubik,system-ui,sans-serif; font-feature-settings:'tnum'; direction:ltr; display:inline-block; }
  .field { width:100%; border:1px solid #DFE4E8; background:#fff; border-radius:.7rem; padding:.65rem .8rem; font-size:1rem; font-family:inherit; transition:border-color .15s,box-shadow .15s; }
  .field:hover { border-color:#C7D0D6; }
  .field:focus { outline:none; border-color:#137A65; box-shadow:0 0 0 3px rgba(19,122,101,.13); }
  .btn-primary { background:linear-gradient(135deg,#0E5B4C,#137A65); color:#fff; border-radius:.7rem; padding:.7rem 1.25rem;
                 font-weight:600; font-size:1rem; font-family:'Readex Pro',sans-serif;
                 box-shadow:0 1px 2px rgba(8,58,49,.2),0 6px 16px rgba(8,58,49,.16); transition:transform .12s,box-shadow .2s,filter .2s; }
  .btn-primary:hover { filter:brightness(1.07); box-shadow:0 2px 4px rgba(8,58,49,.22),0 10px 24px rgba(8,58,49,.2); }
  .btn-primary:active { transform:translateY(1px); }
  .btn-primary:disabled { opacity:.6; box-shadow:none; }
  .btn-ghost { border:1px solid #DFE4E8; background:#fff; border-radius:.6rem; padding:.4rem .8rem; font-size:.85rem; transition:background .15s,border-color .15s; }
  .btn-ghost:hover { background:#F6F8F9; border-color:#C7D0D6; }
  .card { background:#fff; border:1px solid rgba(14,22,33,.06); border-radius:1.1rem;
          box-shadow:0 1px 2px rgba(14,22,33,.04),0 8px 24px -6px rgba(14,22,33,.07); transition:box-shadow .25s,transform .2s; }
  .eyebrow { font-size:.75rem; letter-spacing:.06em; color:#6C7683; font-weight:600; }
  .navlink { display:flex; align-items:center; gap:.65rem; padding:.68rem .85rem; border-radius:.7rem; font-size:1rem; color:#39434F; width:100%; text-align:right; font-family:'Readex Pro',sans-serif; transition:background .15s,color .15s; }
  .navlink:hover { background:#EDF0F2; }
  .navlink.on { background:linear-gradient(135deg,#083A31,#0E5B4C); color:#fff; box-shadow:0 4px 14px -4px rgba(8,58,49,.5); }
  .pill { padding:.15rem .55rem; border-radius:.45rem; font-size:.78rem; font-weight:600; }
  th { font-size:.8rem; color:#6C7683; font-weight:600; text-align:right; padding:.65rem .5rem; border-bottom:1px solid #EDF0F2; }
  td { padding:.75rem .5rem; font-size:.92rem; border-top:1px solid #EDF0F2; }
  tbody tr { transition:background .15s; }
  tbody tr:hover { background:#FAFBFC; }
  summary { list-style:none; } summary::-webkit-details-marker { display:none; }
  summary::before { content:'+'; display:inline-grid; place-items:center; width:1.4rem; height:1.4rem; margin-left:.5rem;
                    border-radius:.45rem; background:#DCEFE9; color:#0E5B4C; font-weight:700; font-size:1rem; transition:transform .2s; }
  details[open] summary::before { content:'−'; transform:rotate(180deg); }
  *:focus-visible { outline:2px solid #137A65; outline-offset:2px; }
  @media (prefers-reduced-motion:no-preference){
    .card:hover { box-shadow:0 2px 4px rgba(14,22,33,.05),0 14px 32px -8px rgba(14,22,33,.1); }
    .fade{animation:f .3s cubic-bezier(.22,1,.36,1) both} @keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  }
</style>
</head>
<body>

<script>
  const SUPABASE_URL = "https://hyyvqcppamlmlhcmnsut.supabase.co";
  const SUPABASE_KEY = "sb_publishable_26WQJ1wSFyt3eNDdkj2yyw_RwYDK6yf";
  const BRAND = "أصول";              // ← اسم النظام، غيّره من هنا
  const BRAND_SUB = "إدارة الأملاك";
  const VERSION = "v8";                // للتأكد من أن النسخة المنشورة محدّثة
</script>

<div id="app"></div>

<script>
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
let user=null, tab='dash', navOpen=false;

const TABS = [
  { id:'dash',       label:'لوحة المالك', icon:'M3 13h4v8H3zM10 3h4v18h-4zM17 9h4v12h-4z' },
  { id:'collection', label:'التحصيل',     icon:'M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6' },
  { id:'finance',    label:'المالية',     icon:'M3 3v18h18M7 15l4-5 3 3 5-7' },
  { id:'maint',      label:'الصيانة',     icon:'M14.7 6.3a4 4 0 01-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 015.4-5.4l-2.1 2.1-2.8-2.8z' },
  { id:'staff',      label:'العمال والرواتب', icon:'M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M13 7a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0M22 11h-6' },
  { id:'leases',     label:'العقود',      icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z' },
  { id:'units',      label:'الوحدات',     icon:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z' },
  { id:'tenants',    label:'المستأجرون',  icon:'M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M13 7a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0M22 20v-2a4 4 0 00-3-3.87' },
];

const money = n => Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);
let YR = String(new Date().getFullYear());
const THIS_YEAR = String(new Date().getFullYear());
function setYear(y){ YR=y; route(); }
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

const yearPicker = () => {
  const y=Number(THIS_YEAR), list=[y+1,y,y-1,y-2,y-3];
  return `<div class="inline-flex items-center gap-1 bg-white border border-paper-200 rounded-xl p-1">
    ${list.map(v=>`<button onclick="setYear('${v}')" class="px-3 py-1.5 rounded-lg text-sm ${String(v)===YR?'bg-teal-900 text-white font-semibold':'text-ink-500 hover:bg-paper-50'}"><span class="num">${v}</span></button>`).join('')}
  </div>`;
};

/** مجاميع سنة بعينها — للمقارنة بين السنوات */
function yearTotals(y){
  const p=payments.filter(x=>x.due_date.startsWith(y));
  const e=expenses.filter(x=>x.expense_date.startsWith(y));
  const contracted=sumAmt(p), collected=sumPaid(p.filter(x=>x.status==='paid'));
  const exp=e.reduce((s,x)=>s+Number(x.amount),0);
  return { contracted, collected, exp, net:collected-exp, rate:contracted?Math.round(collected/contracted*100):0 };
}
const delta = (now,prev) => {
  if(!prev) return '';
  const d=Math.round((now-prev)/Math.abs(prev)*100);
  if(!isFinite(d)||d===0) return '';
  return `<span class="text-xs font-bold ${d>0?'text-teal-600':'text-rose-600'}">${d>0?'▲':'▼'}<span class="num">${Math.abs(d)}</span>%</span>`;
};

/** حارس ضد الضغط المزدوج على أزرار الحفظ */
const busy=new Set();
async function once(key,btn,fn){
  if(busy.has(key)) return;
  busy.add(key);
  const el=btn&&document.activeElement; const label=el?.textContent;
  if(el){ el.disabled=true; el.textContent='جارٍ الحفظ…'; }
  try{ await fn(); } finally { busy.delete(key); if(el&&document.contains(el)){ el.disabled=false; el.textContent=label; } }
}

/* ───── auth ───── */
async function init(){ const {data:{session}} = await db.auth.getSession(); user=session?.user||null; paint(); }
db.auth.onAuthStateChange((_e,s)=>{ user=s?.user||null; paint(); });
const paint = () => user ? shell() : loginView();

function loginView(){
  app.innerHTML=`
  <div class="min-h-screen grid place-items-center px-5">
    <div class="w-full max-w-sm fade">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-teal-900 mx-auto grid place-items-center mb-4">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>
        </div>
        <h1 class="text-3xl font-bold">${BRAND}</h1>
        <p class="text-ink-500 mt-1">${BRAND_SUB}</p>
      </div>
      <div class="card p-7">
        <label class="eyebrow block mb-2">البريد الإلكتروني</label>
        <input id="em" type="email" class="field mb-4" dir="ltr">
        <label class="eyebrow block mb-2">كلمة السر</label>
        <input id="pw" type="password" class="field" dir="ltr">
        <p id="er" class="text-rose-600 text-sm mt-3 hidden"></p>
        <button onclick="login()" class="btn-primary w-full mt-6">دخول</button>
      </div>
    </div>
  </div>`;
  pw.addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });
}
async function login(){
  const {error} = await db.auth.signInWithPassword({ email:em.value.trim(), password:pw.value });
  if(error){ const b=document.getElementById('er'); b.textContent='البريد أو كلمة السر غير صحيحة.'; b.classList.remove('hidden'); }
}
const logout = () => db.auth.signOut();

/* ───── shell ───── */
function shell(){
  app.innerHTML=`
  <div class="flex min-h-screen">
    <aside class="hidden lg:flex flex-col w-64 shrink-0 bg-white/85 backdrop-blur border-l border-paper-100 p-4">
      ${brandBlock()}
      <nav class="space-y-1 mt-7">${TABS.map(navBtn).join('')}</nav>
      <button onclick="logout()" class="navlink mt-auto text-ink-500 text-sm">تسجيل الخروج</button>
    </aside>
    <div class="flex-1 min-w-0">
      <header class="lg:hidden sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-paper-100 px-4 h-14 flex items-center justify-between">
        <button onclick="toggleNav()" aria-label="القائمة"><svg width="24" height="24" viewBox="0 0 24 24" stroke="#39434F" stroke-width="1.8" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <span class="font-bold display">${BRAND}</span>
        <button onclick="logout()" class="text-sm text-ink-500">خروج</button>
      </header>
      <div id="drawer" class="hidden lg:hidden fixed inset-0 z-30">
        <div class="absolute inset-0 bg-ink-900/45" onclick="toggleNav()"></div>
        <div class="absolute top-0 right-0 h-full w-64 bg-white p-4">${brandBlock()}<nav class="space-y-1 mt-7">${TABS.map(navBtn).join('')}</nav></div>
      </div>
      <main id="main" class="p-4 sm:p-6 lg:p-9 max-w-5xl"></main>
    </div>
  </div>`;
  route();
}
const brandBlock = () => `
  <div class="flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-xl bg-teal-900 grid place-items-center shrink-0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>
    </div>
    <div class="leading-tight"><p class="font-bold display">${BRAND}</p><p class="text-xs text-ink-500">${BRAND_SUB} · <span class="num">${VERSION}</span></p></div>
  </div>`;
const navBtn = t => `<button onclick="go('${t.id}')" class="navlink ${tab===t.id?'on':''}">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="${t.icon}"/></svg>${t.label}</button>`;
function toggleNav(){ navOpen=!navOpen; document.getElementById('drawer').classList.toggle('hidden',!navOpen); }
function go(t){ tab=t; navOpen=false; shell(); }
function route(){ ({dash:dashView,collection:collectionView,finance:financeView,maint:maintView,staff:staffView,leases:leasesView,units:unitsView,tenants:tenantsView})[tab](); }
const head=(t,s)=>`<div class="mb-7"><h1 class="text-2xl font-bold">${t}</h1><p class="text-ink-500 mt-1">${s}</p></div>`;
const empty=m=>`<div class="card p-10 text-center text-ink-500">${m}</div>`;

/* ───── data ───── */
let tenants=[],units=[],leases=[],payments=[],expenses=[],readings=[],maint=[],staff=[];
const load = {
  tenants: async q=>{ let r=db.from('tenants').select('*').order('created_at',{ascending:false}); if(q) r=r.or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`); tenants=(await r).data||[]; },
  units:   async ()=>{ units=(await db.from('units').select('*').order('building_name')).data||[]; },
  maint:   async ()=>{ maint=(await db.from('maintenance').select('*').order('service_date',{ascending:false})).data||[]; },
  staff:   async ()=>{ staff=(await db.from('employees').select('*').order('full_name')).data||[]; },
  leases:  async ()=>{ leases=(await db.from('leases').select('*, tenants(full_name,phone), units(building_name,unit_number)').order('created_at',{ascending:false})).data||[]; },
  payments:async ()=>{ payments=(await db.from('payments').select('*, leases(unit_id, monthly_rent, tenants(full_name), units(building_name,unit_number))').order('due_date')).data||[]; },
  expenses:async ()=>{ expenses=(await db.from('expenses').select('*').order('expense_date',{ascending:false})).data||[]; },
  readings:async ()=>{ readings=(await db.from('meter_readings').select('*').order('reading_date',{ascending:false})).data||[]; },
};
const sumPaid = a => a.reduce((s,p)=>s+Number(p.paid_amount??p.amount),0);
const sumAmt  = a => a.reduce((s,p)=>s+Number(p.amount),0);

/* ───── لوحة المالك ───── */
async function dashView(){
  const m=document.getElementById('main');
  m.innerHTML=head('لوحة المالك','صورة كاملة عن أداء المحفظة العقارية')+`<p class="text-ink-500">جارٍ التحميل…</p>`;
  await Promise.all([load.units(),load.leases(),load.payments(),load.expenses()]);

  const t=today();
  const yearPays = payments.filter(p=>p.due_date.startsWith(YR));
  const collected = sumPaid(yearPays.filter(p=>p.status==='paid'));
  const overdue   = sumAmt(yearPays.filter(p=>p.status==='pending' && p.due_date<t));
  const contracted= sumAmt(yearPays);
  const yearExp   = expenses.filter(e=>e.expense_date.startsWith(YR));
  const expTotal  = yearExp.reduce((s,e)=>s+Number(e.amount),0);
  const net       = collected-expTotal;
  const occ       = units.filter(u=>u.status==='occupied').length;
  const rate      = units.length?Math.round(occ/units.length*100):0;
  const rateColl  = contracted?Math.round(collected/contracted*100):0;

  // الخطة السنوية: متوقع مقابل محصّل لكل شهر
  const plan = MONTHS.map((label,i)=>{
    const key = `${YR}-${String(i+1).padStart(2,'0')}`;
    const rows = payments.filter(p=>p.due_date.startsWith(key));
    return { label, expected:sumAmt(rows), collected:sumPaid(rows.filter(p=>p.status==='paid')) };
  });
  const peak = Math.max(1,...plan.map(p=>p.expected));

  // أداء كل مبنى
  const buildings = [...new Set(units.map(u=>u.building_name))].map(b=>{
    const bu = units.filter(u=>u.building_name===b);
    const ids = bu.map(u=>u.id);
    const bp = payments.filter(p=>ids.includes(p.leases?.unit_id) && p.due_date.startsWith(YR));
    return {
      name:b, total:bu.length, occupied:bu.filter(u=>u.status==='occupied').length,
      contracted:sumAmt(bp), collected:sumPaid(bp.filter(p=>p.status==='paid')),
      overdue:sumAmt(bp.filter(p=>p.status==='pending'&&p.due_date<t)),
      expenses:yearExp.filter(e=>e.building_name===b).reduce((s,e)=>s+Number(e.amount),0),
    };
  });

  const cur=yearTotals(YR), prev=yearTotals(String(Number(YR)-1));

  m.innerHTML=`
  <div class="mb-7 flex flex-wrap items-end justify-between gap-3">
    <div><h1 class="text-2xl font-bold">لوحة المالك</h1><p class="text-ink-500 mt-1">أداء المحفظة لسنة <span class="num">${YR}</span></p></div>
    ${yearPicker()}
  </div>
  <div class="fade space-y-6">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      ${stat('الإيراد المتعاقد',contracted,'كامل السنة','ink-900',delta(cur.contracted,prev.contracted))}
      ${stat('المحصّل',collected,rateColl+'% من المتعاقد','teal-700',delta(cur.collected,prev.collected))}
      ${stat('المتأخرات',overdue,'مستحقة ولم تُسدد','rose-600','')}
      ${stat('صافي التشغيل',net,'محصّل − مصروفات',net>=0?'teal-700':'rose-600',delta(cur.net,prev.net))}
    </div>

    <div class="grid lg:grid-cols-3 gap-3">
      <div class="card p-5">
        <p class="eyebrow">الإشغال</p>
        <p class="text-3xl font-bold display mt-2"><span class="num">${rate}</span>%</p>
        <p class="text-sm text-ink-500 mt-1"><span class="num">${occ}</span> مؤجّرة من <span class="num">${units.length}</span></p>
        <div class="flex gap-1 mt-4">${units.map(u=>`<span class="h-2.5 flex-1 rounded-full ${u.status==='occupied'?'bg-teal-700':'bg-paper-200'}"></span>`).join('')||'<span class="text-xs text-ink-300">لا وحدات</span>'}</div>
      </div>
      <div class="card p-5">
        <p class="eyebrow">المصروفات التشغيلية</p>
        <p class="text-3xl font-bold display mt-2 text-amber-600"><span class="num">${money(expTotal)}</span></p>
        <p class="text-sm text-ink-500 mt-1">${collected?`<span class="num">${Math.round(expTotal/collected*100)}</span>% من المحصّل`:'—'}</p>
      </div>
      <div class="card p-5">
        <p class="eyebrow">العقود السارية</p>
        <p class="text-3xl font-bold display mt-2"><span class="num">${leases.filter(l=>l.status==='active').length}</span></p>
        <p class="text-sm text-ink-500 mt-1">من <span class="num">${leases.length}</span> عقد مسجّل</p>
      </div>
    </div>

    <div class="card p-5">
      <div class="flex items-baseline justify-between mb-5">
        <h2 class="font-bold text-lg">الخطة السنوية ${YR}</h2>
        <p class="text-xs text-ink-500">■ متوقع &nbsp; <span class="text-teal-700">■</span> محصّل</p>
      </div>
      <div class="flex items-end gap-1.5 h-40" dir="rtl">
        ${plan.map(p=>`
          <div class="flex-1 flex flex-col items-center gap-1.5 h-full justify-end" title="${p.label}: متوقع ${money(p.expected)} · محصّل ${money(p.collected)}">
            <div class="w-full relative bg-paper-100 rounded-t" style="height:${Math.max(3,p.expected/peak*100)}%">
              <div class="absolute bottom-0 w-full bg-teal-700 rounded-t" style="height:${p.expected?p.collected/p.expected*100:0}%"></div>
            </div>
            <span class="text-[.62rem] text-ink-500 whitespace-nowrap">${p.label.slice(0,3)}</span>
          </div>`).join('')}
      </div>
    </div>

    ${(()=>{ const ys=[...new Set([...payments.map(p=>p.due_date.slice(0,4)),...expenses.map(e=>e.expense_date.slice(0,4))])].sort().reverse();
      return ys.length>1?`
      <div class="card p-5 overflow-x-auto">
        <h2 class="font-bold text-lg mb-4">الأداء عبر السنوات</h2>
        <table class="w-full min-w-[520px]">
          <thead><tr><th>السنة</th><th>متعاقد</th><th>محصّل</th><th>نسبة التحصيل</th><th>مصروفات</th><th>الصافي</th></tr></thead>
          <tbody>${ys.map(y=>{ const t=yearTotals(y); return `
            <tr class="${y===YR?'bg-teal-100/40':''}">
              <td class="font-bold"><span class="num">${y}</span></td>
              <td><span class="num">${money(t.contracted)}</span></td>
              <td class="text-teal-700"><span class="num">${money(t.collected)}</span></td>

async function deleteExpense(id,source){
  const note = source==='maintenance' ? 'هذا القيد ناتج عن عمل صيانة. حذفه يزيل المبلغ من الحسابات ويبقي سجل الصيانة.'
             : source==='salary'      ? 'هذا القيد ناتج عن صرف رواتب. حذفه يزيل المبلغ من الحسابات ويبقي بيانات العامل.'
             : source==='meter'       ? 'هذا القيد ناتج عن فاتورة عداد. حذفه يزيل المبلغ من الحسابات ويبقي القراءة.'
             : 'حذف هذا المصروف؟';

async function addExpense(){

const chip=(id,label,n)=>`<button onclick="setPayFilter('${id}')" class="shrink-0 px-4 py-2 rounded-lg text-sm border ${payFilter===id?'bg-teal-900 text-white border-teal-900 font-semibold':'bg-white border-paper-200 text-ink-700'}">${label} <span class="num opacity-70">${n}</span></button>`;
function setPayFilter(f){ payFilter=f; collectionView(); }
function renderPayments(){
  const t=today();
  let rows=payments;
  if(payFilter==='due') rows=payments.filter(p=>p.status==='pending');
  if(payFilter==='overdue') rows=payments.filter(p=>p.status==='pending'&&p.due_date<t);
  if(payFilter==='paid') rows=payments.filter(p=>p.status==='paid');
  const box=document.getElementById('plist');
  if(!rows.length){ box.innerHTML=empty('لا دفعات في هذا التصنيف. أنشئ عقدًا ليُولَّد جدول دفعاته تلقائيًا.'); return; }
  box.innerHTML=rows.map(p=>{
    const late=p.status==='pending'&&p.due_date<t, days=Math.round((new Date(t)-new Date(p.due_date))/864e5), l=p.leases||{};
    return `<div class="card p-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold truncate">${l.tenants?.full_name||'—'}</p>

        <p class="text-xs mt-1 ${late?'text-rose-600 font-semibold':'text-ink-500'}">الاستحقاق <span class="num">${p.due_date}</span>${late?` · متأخرة <span class="num">${days}</span> يوم`:''}</p>
      </div>
      <div class="text-left shrink-0">
        <p class="font-bold"><span class="num">${money(p.amount)}</span> <span class="text-xs text-ink-500">ر.س</span></p>
        ${p.status==='paid'?`<p class="text-xs text-teal-700 mt-1">سُددت <span class="num">${(p.paid_at||'').slice(0,10)}</span></p>`
          :`<button onclick="openReceipt('${p.id}')" class="btn-ghost mt-1.5 text-teal-700 border-teal-100">تسجيل دفعة</button>`}
      </div>
    </div>`;}).join('');
}
function openReceipt(id){
  const p=payments.find(x=>x.id===id);
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
  <div class="card relative w-full max-w-sm p-6 fade">

    <label class="eyebrow block mb-2">رقم السند / المرجع</label><input id="r_ref" class="field" placeholder="اختياري">
    <p id="r_err" class="text-rose-600 text-sm mt-3 hidden"></p>
    <div class="flex gap-2 mt-5"><button onclick="saveReceipt('${p.id}')" class="btn-primary flex-1">حفظ السند</button><button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button></div>
  </div>`;

}
const closeModal=()=>document.getElementById('modal')?.remove();
async function saveReceipt(id){
  const amt=Number(r_amt.value), date=r_date.value, err=document.getElementById('r_err');
  if(!amt||amt<=0||!date){ err.textContent='أدخل مبلغًا صحيحًا وتاريخ الاستلام.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('payments').update({status:'paid',paid_amount:amt,paid_at:new Date(date).toISOString(),payment_method:r_method.value,receipt_number:r_ref.value.trim()||null}).eq('id',id);
  if(error){ err.textContent='تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  closeModal(); collectionView();
}

function fillMaintUnits(){
  const b=document.getElementById('mt_b').value;

  box.innerHTML = !b ? `<p class="text-sm text-ink-300 col-span-3">اختر المبنى أولاً</p>`
    : list.length ? list.map(u=>`
      <label class="flex items-center gap-2 border border-paper-200 rounded-lg px-3 py-2 text-sm">
        <input type="checkbox" class="mt_u" value="${u.id}" onchange="splitPreview()"> وحدة ${u.unit_number}
      </label>`).join('')
    : `<p class="text-sm text-ink-300 col-span-3">لا وحدات في هذا المبنى</p>`;
  splitPreview();
}
function toggleScope(){
  const perUnit=document.querySelector('input[name=scope]:checked').value==='units';
  document.getElementById('mt_units').classList.toggle('hidden',!perUnit);
  splitPreview();
}
function splitPreview(){
  const box=document.getElementById('mt_split'); if(!box) return;
  const cost=Number(document.getElementById('mt_cost').value);
  const perUnit=document.querySelector('input[name=scope]:checked').value==='units';
  const n=document.querySelectorAll('.mt_u:checked').length;
  box.textContent = !cost ? ''
    : !perUnit ? `تُحمّل كاملة على المبنى (مصروف مشترك): ${money(cost)} ر.س`
    : n ? `تُقسّم على ${n} وحدة — ${money(Math.round(cost/n))} ر.س لكل وحدة`
    : 'اختر الوحدات المستفيدة لتوزيع التكلفة';
}

async function addMaint(){
  const building_name=document.getElementById('mt_b').value,
        category=document.getElementById('mt_c').value,
        cost=Number(document.getElementById('mt_cost').value),
        service_date=document.getElementById('mt_d').value,
        vendor=document.getElementById('mt_v').value.trim()||null,
        description=document.getElementById('mt_desc').value.trim()||null,
        perUnit=document.querySelector('input[name=scope]:checked').value==='units',
        unit_ids=[...document.querySelectorAll('.mt_u:checked')].map(c=>c.value),
        err=document.getElementById('mt_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!building_name||!cost||!service_date) return fail('المبنى والتكلفة والتاريخ مطلوبة.');
  if(perUnit && !unit_ids.length) return fail('اختر الوحدات المستفيدة، أو حمّل التكلفة على المبنى كامل.');

  const {data,error}=await db.from('maintenance').insert({
    building_name,category,description,cost,vendor,service_date,
    scope: perUnit?'units':'building', unit_ids: perUnit?unit_ids:[]
  }).select().single();
  if(error) return fail('تعذّر الحفظ. حاول مرة أخرى.');

  // تُقيَّد التكلفة في المصروفات تلقائيًا حتى تظهر في المالية ولوحة المالك
  const rows = perUnit
    ? unit_ids.map(uid=>({ building_name, category:'maintenance', amount:Math.round(cost/unit_ids.length),
        expense_date:service_date, unit_id:uid, source:'maintenance', ref_id:data.id,
        notes:`${MAINT_CATS[category]}${description?' — '+description:''}` }))
    : [{ building_name, category:'maintenance', amount:cost, expense_date:service_date,
        source:'maintenance', ref_id:data.id, notes:`${MAINT_CATS[category]} (مشترك)${description?' — '+description:''}` }];
  await db.from('expenses').insert(rows);
  maintView();
}

  box.innerHTML=maint.map(x=>{
    const nums=(x.unit_ids||[]).map(id=>units.find(u=>u.id===id)?.unit_number).filter(Boolean);
    const share=nums.length?Math.round(x.cost/nums.length):x.cost;
    return `<div class="card p-4">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">

          ${x.description?`<p class="text-sm text-ink-500">${x.description}</p>`:''}

let savingLease=false;
async function addLease(){
  if(savingLease) return;
  const btn=document.activeElement;
  const tenant_id=l_tenant.value,unit_id=l_unit.value,start_date=l_start.value,end_date=l_end.value,
        annual=Number(l_rent.value),count=Number(l_count.value),err=document.getElementById('l_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!tenant_id||!unit_id||!start_date||!end_date||!annual) return fail('أكمل كل الحقول قبل الحفظ.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');

  savingLease=true;
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الحفظ…'; }
  try{
    // تحقق لحظي: لا عقدين ساريين على نفس الوحدة
    const {data:clash}=await db.from('leases').select('id').eq('unit_id',unit_id).eq('status','active');
    if(clash&&clash.length){ return fail('هذه الوحدة عليها عقد ساري بالفعل. حدّث الصفحة واختر وحدة أخرى.'); }

    const {data,error}=await db.from('leases').insert({
      tenant_id,unit_id,start_date,end_date,status:'active',
      annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12)
    }).select().single();
    if(error) return fail('تعذّر حفظ العقد: '+error.message);

    await db.from('units').update({status:'occupied'}).eq('id',unit_id);
    await db.from('payments').insert(buildSchedule(data.id,start_date,end_date,annual,count));
    go('collection');
  } finally {
    savingLease=false;
    if(btn&&document.contains(btn)){ btn.disabled=false; btn.textContent='حفظ العقد وتفعيله'; }
  }
}

/** دفعة لكل قسط: المبلغ = الإيجار السنوي ÷ عدد الدفعات، والفاصل = ١٢ ÷ عدد الدفعات بالأشهر */
function buildSchedule(lease_id,start,end,annual,count){
  const rows=[], last=new Date(end), d=new Date(start),
        step=12/count, amount=Math.round(annual/count);
  while(d<=last){ rows.push({lease_id,due_date:d.toISOString().slice(0,10),amount,status:'pending'}); d.setMonth(d.getMonth()+step); }
  return rows;
}
async function endLease(id,unitId){
  const future=payments.filter(p=>p.lease_id===id&&p.status==='pending'&&p.due_date>today()).length;
  if(!confirm(`إنهاء هذا العقد وإرجاع الوحدة إلى الشواغر؟${future?`\nسيتم إلغاء ${future} دفعة مستقبلية لم تُستحق بعد.`:''}`)) return;
  await db.from('leases').update({status:'terminated'}).eq('id',id);
  await db.from('units').update({status:'vacant'}).eq('id',unitId);
  // الدفعات المستقبلية غير المستحقة تُلغى حتى لا تظهر كمتأخرات وهمية
  await db.from('payments').delete().eq('lease_id',id).eq('status','pending').gt('due_date',today());
  leasesView();
}

  if(!confirm('حذف هذا العقد وكل دفعاته نهائيًا من السجل؟')) return;
  const {error}=await db.from('leases').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف. حاول مرة أخرى.');
  leasesView();

      <div class="flex gap-1 flex-wrap">${units.map(u=>`<span title="${u.building_name} ${u.unit_number}" class="h-6 flex-1 min-w-[14px] rounded ${u.status==='occupied'?'bg-teal-700':'bg-paper-200'}"></span>`).join('')}</div>
    </div>`:''}
    <details class="card p-5 mb-6">
      <summary class="font-semibold cursor-pointer">وحدة جديدة</summary>
      <div class="grid sm:grid-cols-2 gap-3 mt-4">
        <div><label class="eyebrow block mb-2">المبنى</label><input id="u_b" class="field"></div>
        <div><label class="eyebrow block mb-2">رقم الوحدة</label><input id="u_n" class="field"></div>
        <div><label class="eyebrow block mb-2">المساحة (م²)</label><input id="u_a" type="number" class="field"></div>
        <div><label class="eyebrow block mb-2">الإيجار السنوي (ر.س)</label><input id="u_r" type="number" class="field"></div>
        <div><label class="eyebrow block mb-2">رقم عداد الكهرباء</label><input id="u_e" class="field" dir="ltr"></div>
        <div><label class="eyebrow block mb-2">رقم عداد المياه</label><input id="u_w" class="field" dir="ltr"></div>
      </div>
      <p id="u_err" class="text-rose-600 text-sm mt-3 hidden"></p>
      <button onclick="addUnit()" class="btn-primary mt-4">إضافة الوحدة</button>
    </details>
    <div id="ulist" class="space-y-2.5"></div>
  </div>`;
  renderUnits();
}
function renderUnits(){
  const box=document.getElementById('ulist');
  if(!units.length){ box.innerHTML=empty('لا وحدات بعد. أضف أول وحدة لتبدأ.'); return; }
  const L={vacant:'شاغرة',occupied:'مؤجّرة',maintenance:'صيانة'};
  const C={vacant:'bg-paper-100 text-ink-500',occupied:'bg-teal-100 text-teal-700',maintenance:'bg-amber-100 text-amber-600'};
  box.innerHTML=units.map(u=>{
    const last=t=>readings.find(r=>r.unit_id===u.id&&r.meter_type===t);
    const e=last('electricity'), w=last('water');
    return `<div class="card p-4">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="font-semibold">${u.building_name} — وحدة ${u.unit_number}</p>
          <p class="text-sm text-ink-500">${u.area_sqm?`<span class="num">${u.area_sqm}</span> م² · `:''}<span class="num">${money(u.base_rent)}</span> ر.س/سنة</p>
        </div>
        <span class="pill shrink-0 ${C[u.status]||''}">${L[u.status]||u.status}</span>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-paper-100">
        ${meterCell('الكهرباء',u.electricity_meter,e)}
        ${meterCell('المياه',u.water_meter,w)}
      </div>
      ${(()=>{ const spent=expenses.filter(x=>x.unit_id===u.id&&x.expense_date.startsWith(YR)).reduce((s,x)=>s+Number(x.amount),0);
        return spent?`<p class="text-sm text-amber-600 mt-3 font-semibold">مصاريف صيانة ${YR}: <span class="num">${money(spent)}</span> ر.س</p>`:''; })()}
      <div class="flex gap-2 mt-3">
        <button onclick="openReading('${u.id}')" class="btn-ghost text-teal-700 border-teal-100">تسجيل قراءة عداد</button>
        <button onclick="openUnitEdit('${u.id}')" class="btn-ghost">تعديل بيانات الوحدة</button>
      </div>
    </div>`;}).join('');
}
const meterCell=(label,num,last)=>`
  <div>
    <p class="eyebrow">عداد ${label}</p>
    <p class="text-sm mt-1">${num?`<span class="num">${num}</span>`:'<span class="text-ink-300">لم يُسجّل</span>'}</p>
    <p class="text-xs text-ink-500 mt-0.5">${last?`آخر قراءة <span class="num">${last.reading}</span> · <span class="num">${last.reading_date}</span>`:'لا قراءات'}</p>
  </div>`;
async function addUnit(){
  const building_name=u_b.value.trim(),unit_number=u_n.value.trim(),area_sqm=u_a.value||null,
        base_rent=u_r.value,err=document.getElementById('u_err');
  err.classList.add('hidden');
  if(!building_name||!unit_number||!base_rent){ err.textContent='المبنى ورقم الوحدة والإيجار مطلوبة.'; err.classList.remove('hidden'); return; }
  if(units.some(u=>u.building_name===building_name&&String(u.unit_number)===unit_number)){
    err.textContent='هذه الوحدة مسجّلة مسبقًا في نفس المبنى.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('units').insert({building_name,unit_number,area_sqm,base_rent,
    electricity_meter:u_e.value.trim()||null, water_meter:u_w.value.trim()||null});
  if(error){ err.textContent='تعذّرت الإضافة. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  unitsView();
}
function openUnitEdit(id){
  const u=units.find(x=>x.id===id);
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4 overflow-y-auto';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
  <div class="card relative w-full max-w-md p-6 fade my-8">
    <h3 class="font-bold text-xl">تعديل بيانات الوحدة</h3>
    <p class="text-ink-500 text-sm mt-1 mb-5">${u.building_name} — وحدة ${u.unit_number}</p>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="eyebrow block mb-2">المبنى</label><input id="ed_b" class="field" value="${u.building_name||''}"></div>
      <div><label class="eyebrow block mb-2">رقم الوحدة</label><input id="ed_n" class="field" value="${u.unit_number||''}"></div>
      <div><label class="eyebrow block mb-2">المساحة (م²)</label><input id="ed_a" type="number" class="field" value="${u.area_sqm??''}"></div>
      <div><label class="eyebrow block mb-2">الإيجار السنوي (ر.س)</label><input id="ed_r" type="number" class="field" value="${u.base_rent??''}"></div>
      <div><label class="eyebrow block mb-2">عداد الكهرباء</label><input id="ed_e" class="field" dir="ltr" value="${u.electricity_meter||''}"></div>
      <div><label class="eyebrow block mb-2">عداد المياه</label><input id="ed_w" class="field" dir="ltr" value="${u.water_meter||''}"></div>
      <div class="col-span-2"><label class="eyebrow block mb-2">الحالة</label>
        <select id="ed_s" class="field">
          <option value="vacant" ${u.status==='vacant'?'selected':''}>شاغرة</option>
          <option value="occupied" ${u.status==='occupied'?'selected':''}>مؤجّرة</option>
          <option value="maintenance" ${u.status==='maintenance'?'selected':''}>تحت الصيانة</option>
        </select>
        <p class="text-xs text-ink-500 mt-1.5">الحالة تتغيّر تلقائيًا مع العقود — عدّلها يدويًا فقط عند الحاجة.</p>
      </div>
    </div>
    <p id="ed_err" class="text-rose-600 text-sm mt-3 hidden"></p>
    <div class="flex gap-2 mt-5">
      <button onclick="saveUnitEdit('${u.id}')" class="btn-primary flex-1">حفظ التعديلات</button>
      <button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button>
    </div>
    <button onclick="deleteUnit('${u.id}')" class="text-sm text-rose-600 mt-4 w-full">حذف الوحدة</button>
  </div>`;
  document.body.appendChild(w);
}

async function saveUnitEdit(id){
  const building_name=ed_b.value.trim(), unit_number=ed_n.value.trim(),
        base_rent=Number(ed_r.value), err=document.getElementById('ed_err');
  err.classList.add('hidden');
  if(!building_name||!unit_number||!base_rent){ err.textContent='المبنى ورقم الوحدة والإيجار مطلوبة.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('units').update({ building_name, unit_number, base_rent,
    area_sqm: ed_a.value?Number(ed_a.value):null,
    electricity_meter: ed_e.value.trim()||null, water_meter: ed_w.value.trim()||null,
    status: ed_s.value }).eq('id',id);
  if(error){ err.textContent='تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  closeModal(); unitsView();
}

async function deleteUnit(id){
  await load.leases();                                  // بيانات محدّثة دائمًا قبل الفحص
  const mine=leases.filter(l=>l.unit_id===id);
  const active=mine.filter(l=>l.status==='active');
  if(active.length) return alert('هذه الوحدة عليها عقد ساري. أنهِ العقد من قسم العقود أولاً.');
  const msg = mine.length
    ? `هذه الوحدة لها ${mine.length} عقد منتهٍ في السجل. حذفها سيحذف تلك العقود ودفعاتها نهائيًا. متابعة؟`
    : 'حذف هذه الوحدة نهائيًا؟';
  if(!confirm(msg)) return;

  if(mine.length){
    await db.from('payments').delete().in('lease_id',mine.map(l=>l.id));
    const del=await db.from('leases').delete().in('id',mine.map(l=>l.id));
    if(del.error) return alert('تعذّر حذف عقود هذه الوحدة: '+del.error.message);
  }
  await db.from('meter_readings').delete().eq('unit_id',id);
  await db.from('expenses').delete().eq('unit_id',id);

  const {error}=await db.from('units').delete().eq('id',id);
  if(error) return alert('تعذّر حذف الوحدة.\nالسبب: '+error.message);
  closeModal(); unitsView();
}

function openReading(unitId){
  const u=units.find(x=>x.id===unitId);
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
  <div class="card relative w-full max-w-sm p-6 fade">
    <h3 class="font-bold text-xl">تسجيل قراءة عداد</h3>
    <p class="text-ink-500 text-sm mt-1 mb-5">${u.building_name} — وحدة ${u.unit_number}</p>
    <label class="eyebrow block mb-2">نوع العداد</label>
    <select id="m_t" class="field mb-4"><option value="electricity">كهرباء</option><option value="water">مياه</option></select>
    <label class="eyebrow block mb-2">القراءة</label><input id="m_v" type="number" class="field mb-4" dir="ltr">
    <label class="eyebrow block mb-2">تاريخ القراءة</label><input id="m_d" type="date" class="field mb-4" value="${today()}">
    <label class="eyebrow block mb-2">قيمة الفاتورة (ر.س)</label><input id="m_a" type="number" class="field" placeholder="اختياري">
    <p id="m_err" class="text-rose-600 text-sm mt-3 hidden"></p>
    <div class="flex gap-2 mt-5"><button onclick="saveReading('${unitId}')" class="btn-primary flex-1">حفظ القراءة</button><button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button></div>
  </div>`;
  document.body.appendChild(w);
}
async function saveReading(unit_id){
  const reading=Number(m_v.value), reading_date=m_d.value, err=document.getElementById('m_err');
  if(!reading||!reading_date){ err.textContent='أدخل القراءة والتاريخ.'; err.classList.remove('hidden'); return; }
  const amount=m_a.value?Number(m_a.value):null, type=m_t.value;
  const {data,error}=await db.from('meter_readings').insert({unit_id,meter_type:type,reading,reading_date,amount}).select().single();
  if(error){ err.textContent='تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  // قيمة الفاتورة تُقيَّد كمصروف على الوحدة حتى تدخل في حساب التشغيل
  if(amount){
    const u=units.find(x=>x.id===unit_id);
    await db.from('expenses').insert({ building_name:u?.building_name||null, category:'utilities', amount,
      expense_date:reading_date, unit_id, source:'meter', ref_id:data.id,
      notes:`فاتورة ${type==='electricity'?'كهرباء':'مياه'} — وحدة ${u?.unit_number||''}` });
  }
  closeModal(); unitsView();
}

/* ───── المستأجرون ───── */
let tq='';
async function tenantsView(){
  const m=document.getElementById('main');
  m.innerHTML=head('المستأجرون','سجل المستأجرين وحالاتهم')+`
  <div class="fade">
    <details class="card p-5 mb-6">
      <summary class="font-semibold cursor-pointer">مستأجر جديد</summary>
      <div class="grid sm:grid-cols-2 gap-3 mt-4">
        <div class="sm:col-span-2"><label class="eyebrow block mb-2">الاسم الكامل</label><input id="t_n" class="field"></div>
        <div><label class="eyebrow block mb-2">رقم الجوال</label><input id="t_p" class="field" dir="ltr" placeholder="05xxxxxxxx"></div>
        <div><label class="eyebrow block mb-2">رقم الهوية</label><input id="t_i" class="field" dir="ltr"></div>
      </div>
      <p id="t_err" class="text-rose-600 text-sm mt-3 hidden"></p>
      <button onclick="addTenant()" class="btn-primary mt-4">إضافة المستأجر</button>
    </details>
    <input class="field mb-4" placeholder="ابحث بالاسم أو الجوال" oninput="searchTenants(this.value)">
    <div id="tlist" class="space-y-2.5"></div>
  </div>`;
  await load.tenants(tq); renderTenants();
}
let tTimer;
function searchTenants(v){ tq=v; clearTimeout(tTimer); tTimer=setTimeout(async()=>{ await load.tenants(tq); renderTenants(); },350); }
function renderTenants(){
  const box=document.getElementById('tlist');
  if(!tenants.length){ box.innerHTML=empty(tq?'لا نتائج مطابقة.':'لا مستأجرون بعد.'); return; }
  const L={active:'نشط',inactive:'غير نشط',blacklisted:'قائمة سوداء'};
  const C={active:'bg-teal-100 text-teal-700',inactive:'bg-paper-100 text-ink-500',blacklisted:'bg-rose-100 text-rose-600'};
  box.innerHTML=tenants.map(t=>`<div class="card p-4 flex items-center justify-between gap-3">
    <div class="min-w-0">
      <p class="font-semibold truncate">${t.full_name}</p>
      <p class="text-sm text-ink-500"><span class="num">${t.phone}</span>${t.national_id?` · <span class="num">${t.national_id}</span>`:''}</p>
    </div>
    <div class="flex flex-col items-end gap-1.5 shrink-0">
      <span class="pill ${C[t.status]||''}">${L[t.status]||t.status}</span>
      <div class="flex gap-1.5">
        <button onclick="openTenantEdit('${t.id}')" class="btn-ghost">تعديل</button>
        ${t.status!=='blacklisted'?`<button onclick="blockTenant('${t.id}')" class="btn-ghost text-rose-600 border-rose-100">قائمة سوداء</button>`
          :`<button onclick="unblockTenant('${t.id}')" class="btn-ghost text-teal-700 border-teal-100">إعادة تفعيل</button>`}
      </div>
    </div></div>`).join('');
}
async function addTenant(){
  const full_name=t_n.value.trim(),phone=t_p.value.trim(),national_id=t_i.value.trim(),err=document.getElementById('t_err');
  err.classList.add('hidden');
  if(!full_name||!phone){ err.textContent='الاسم ورقم الجوال مطلوبان.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('tenants').insert({full_name,phone,national_id:national_id||null});
  if(error){ err.textContent=error.code==='23505'?'رقم الجوال أو الهوية مسجّل لمستأجر آخر.':'تعذّرت الإضافة. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  tenantsView();
}
function openTenantEdit(id){
  const t=tenants.find(x=>x.id===id);
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4 overflow-y-auto';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
  <div class="card relative w-full max-w-md p-6 fade my-8">
    <h3 class="font-bold text-xl mb-5">تعديل بيانات المستأجر</h3>
    <label class="eyebrow block mb-2">الاسم الكامل</label><input id="te_name" class="field mb-4" value="${t.full_name||''}">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="eyebrow block mb-2">رقم الجوال</label><input id="te_phone" class="field" dir="ltr" value="${t.phone||''}"></div>
      <div><label class="eyebrow block mb-2">رقم الهوية</label><input id="te_id" class="field" dir="ltr" value="${t.national_id||''}"></div>
    </div>
    <p id="te_err" class="text-rose-600 text-sm mt-3 hidden"></p>
    <div class="flex gap-2 mt-5">
      <button onclick="saveTenantEdit('${t.id}')" class="btn-primary flex-1">حفظ التعديلات</button>
      <button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button>
    </div>
    <button onclick="deleteTenant('${t.id}')" class="text-sm text-rose-600 mt-4 w-full">حذف المستأجر</button>
  </div>`;
  document.body.appendChild(w);
}
async function saveTenantEdit(id){
  const full_name=document.getElementById('te_name').value.trim(),
        phone=document.getElementById('te_phone').value.trim(),
        national_id=document.getElementById('te_id').value.trim(),
        err=document.getElementById('te_err');
  err.classList.add('hidden');
  if(!full_name||!phone){ err.textContent='الاسم ورقم الجوال مطلوبان.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('tenants').update({full_name,phone,national_id:national_id||null}).eq('id',id);
  if(error){ err.textContent=error.code==='23505'?'رقم الجوال أو الهوية مسجّل لمستأجر آخر.':'تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  closeModal(); await load.tenants(tq); renderTenants();
}
async function deleteTenant(id){
  await load.leases();
  const own=leases.filter(l=>l.tenant_id===id);
  const act=own.filter(l=>l.status==='active');
  if(act.length) return alert('هذا المستأجر عليه عقد ساري. أنهِ العقد أولاً.');
  if(!confirm(own.length?`سيُحذف المستأجر و${own.length} عقد منتهٍ ودفعاتها. متابعة؟`:'حذف هذا المستأجر نهائيًا؟')) return;
  if(own.length) await db.from('leases').delete().in('id',own.map(l=>l.id));
  const {error}=await db.from('tenants').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف — المستأجر مرتبط بسجلات أخرى.');
  closeModal(); await load.tenants(tq); renderTenants();
}
async function blockTenant(id){
  await load.leases();
  if(leases.some(l=>l.tenant_id===id&&l.status==='active'))
    if(!confirm('هذا المستأجر عليه عقد ساري. إدراجه في القائمة السوداء لن يُنهي العقد. متابعة؟')) return;
  const reason=prompt('سبب الإدراج في القائمة السوداء:');
  if(!reason||reason.trim().length<3) return;
  await db.from('tenants').update({status:'blacklisted',blacklist_reason:reason,blacklisted_at:new Date().toISOString()}).eq('id',id);
  await load.tenants(tq); renderTenants();
}
async function unblockTenant(id){
  await db.from('tenants').update({status:'active',blacklist_reason:null,blacklisted_at:null}).eq('id',id);
  await load.tenants(tq); renderTenants();
}

init();
</script>
