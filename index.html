/* مُبلِّغ الأخطاء: يعرض أي خلل على الشاشة مباشرة بدل بقائه مخفيًا في الكونسول */
function showError(msg){
  let b=document.getElementById('errbar');
  if(!b){ b=document.createElement('div'); b.id='errbar';
    b.style.cssText='position:fixed;bottom:0;right:0;left:0;z-index:99;background:#A93838;color:#fff;padding:.7rem 1rem;font-size:.85rem;direction:rtl;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start';
    document.body.appendChild(b); }
  b.innerHTML='<span style="flex:1">'+msg+'</span><button onclick="this.parentNode.remove()" style="font-weight:700">إغلاق</button>';
}
window.onerror=(m,src,line)=>{ showError('خطأ: '+m+' (سطر '+line+')'); };
window.onunhandledrejection=e=>{ showError('خطأ: '+(e.reason?.message||e.reason)); };
const guard=fn=>(...a)=>{ try{ const r=fn(...a); if(r&&r.catch) r.catch(e=>showError('خطأ: '+(e.message||e))); return r; }catch(e){ showError('خطأ: '+(e.message||e)); } };

let user=null, tab='dash', navOpen=false, ME={role:'operator',full_name:''};

/* ───── الأدوار ───── */
const ROLE_LABEL={admin:'مدير النظام',operator:'مشغّل',accountant:'محاسب',owner:'صاحب الشركة',exec:'مدير تنفيذي',landlord:'مالك خارجي',none:'بلا صلاحية'};
const ROLE_TABS={

/* سجل التدقيق */

/* ضغطة مطوّلة على الشعار تكشف رقم الإصدار */
let holdT=null;

const TABS = [

  { id:'maint',      label:'الصيانة',     icon:'M14.7 6.3a4 4 0 01-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 015.4-5.4l-2.1 2.1-2.8-2.8z' },
  { id:'staff',      label:'العمال والرواتب', icon:'M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M13 7a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0M22 11h-6' },
  { id:'leases',     label:'العقود',      icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z' },
  { id:'units',      label:'الوحدات',     icon:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z' },
  { id:'tenants',    label:'المستأجرون',  icon:'M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M13 7a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0M22 20v-2a4 4 0 00-3-3.87' },
  { id:'settings',   label:'الإعدادات',   icon:'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008.6 19a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1A1.7 1.7 0 004.6 8.6a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z' },
];

const money = n => Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);
/** تحويل آمن للتاريخ — يمنع انهيار الواجهة عند تاريخ ناقص أو غير صالح */
const ymd = d => { const x=(d instanceof Date)?d:new Date(d); return isNaN(x.getTime())?null:x.toISOString().slice(0,10); };
const isValidDate = d => !!d && !isNaN(new Date(d).getTime());
let YR = String(new Date().getFullYear());
const THIS_YEAR = String(new Date().getFullYear());
function setYear(y){ YR=y; route(); }
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ───── الفترة: شهر أو سنة ───── */
let PMODE='year';                                   // year | month
let PMONTH=String(new Date().getMonth()+1).padStart(2,'0');

const periodKey   = () => PMODE==='year' ? YR : `${YR}-${PMONTH}`;
const inPeriod    = d => !!d && d.startsWith(periodKey());
const periodLabel = () => PMODE==='year' ? `سنة ${YR}` : `${MONTHS[Number(PMONTH)-1]} ${YR}`;

function setPeriod(mode,val){
  if(mode==='mode') PMODE=val;
  else if(mode==='year') YR=val;
  else PMONTH=val;
  route();
}

const periodPicker = () => {
  const y=Number(THIS_YEAR), years=[y+1,y,y-1,y-2];
  return `<div class="flex flex-wrap items-center gap-2">
    <div class="inline-flex bg-white border border-paper-200 rounded-xl p-1">
      <button onclick="setPeriod('mode','year')"  class="px-3 py-1.5 rounded-lg text-sm ${PMODE==='year'?'bg-teal-900 text-white font-semibold':'text-ink-500'}">سنوي</button>
      <button onclick="setPeriod('mode','month')" class="px-3 py-1.5 rounded-lg text-sm ${PMODE==='month'?'bg-teal-900 text-white font-semibold':'text-ink-500'}">شهري</button>
    </div>
    ${PMODE==='month'?`<select onchange="setPeriod('month',this.value)" class="field w-auto py-1.5 text-sm">
      ${MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${v===PMONTH?'selected':''}>${m}</option>`;}).join('')}
    </select>`:''}
    <select onchange="setPeriod('year',this.value)" class="field w-auto py-1.5 text-sm num">
      ${years.map(v=>`<option value="${v}" ${String(v)===YR?'selected':''}>${v}</option>`).join('')}
    </select>
  </div>`;
};

/** حارس ضد الضغط المزدوج على أزرار الحفظ */
const busy=new Set();
async function once(key,btn,fn){
  if(busy.has(key)) return;
  busy.add(key);
  const el=btn&&document.activeElement; const label=el?.textContent;
  if(el){ el.disabled=true; el.textContent='جارٍ الحفظ…'; }
  try{ await fn(); } finally { busy.delete(key); if(el&&document.contains(el)){ el.disabled=false; el.textContent=label; } }
}

/* ───── auth ───── */
async function init(){
  const {data:{session}} = await db.auth.getSession(); user=session?.user||null;
  if(user) await loadMe();
  paint();
}
async function loadMe(){
  const {data,error}=await db.from('app_users').select('*').ilike('email',user.email).maybeSingle();
  ME = data || {role:'none',full_name:user.email,buildings:[]};
  const t=ROLE_TABS[ME.role]||[];
  if(!t.includes(tab)) tab=t[0]||'none';
}
db.auth.onAuthStateChange(async(_e,s)=>{ user=s?.user||null; if(user) await loadMe(); paint(); });
function paint(){
  if(!user) return loginView();
  if(!(ROLE_TABS[ME.role]||[]).length) return noAccessView();
  shell();
}

          <path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      </div>
      <h1 class="text-xl font-bold">لا توجد صلاحية لهذا الحساب</h1>

      <button onclick="logout()" class="btn-ghost w-full mt-6">تسجيل الخروج</button>

}

function loginView(){
  app.innerHTML=`
  <div class="min-h-screen grid place-items-center px-5">
    <div class="w-full max-w-sm fade">
      <div class="text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-teal-900 mx-auto grid place-items-center mb-4">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>

  const {error} = await db.auth.signInWithPassword({ email:em.value.trim(), password:pw.value });

}
const logout = () => db.auth.signOut();

/* ───── shell ───── */
function shell(){
  app.innerHTML=`
  <div class="flex min-h-screen">
    <aside class="hidden lg:flex flex-col w-64 shrink-0 bg-white/85 backdrop-blur border-l border-paper-100 p-4">
      ${brandBlock()}
      <nav class="space-y-1 mt-7">${TABS.filter(t=>allowed(t.id)).map(navBtn).join('')}</nav>

        <div class="absolute top-0 right-0 h-full w-64 bg-white p-4">${brandBlock()}<nav class="space-y-1 mt-7">${TABS.filter(t=>allowed(t.id)).map(navBtn).join('')}</nav></div>
      </div>
      <main id="main" class="p-4 sm:p-6 lg:p-9 max-w-5xl"></main>

const brandBlock = () => `
  <div class="flex items-center gap-2.5">
    <div class="w-10 h-10 rounded-xl bg-teal-900 grid place-items-center shrink-0 select-none"
         onpointerdown="holdStart()" onpointerup="holdEnd()" onpointerleave="holdEnd()">

const navBtn = t => `<button onclick="go('${t.id}')" class="navlink ${tab===t.id?'on':''}">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="${t.icon}"/></svg>${t.label}</button>`;
function toggleNav(){ navOpen=!navOpen; document.getElementById('drawer').classList.toggle('hidden',!navOpen); }
function go(t){ tab=t; navOpen=false; shell(); }
function route(){ if(!allowed(tab)) tab=(ROLE_TABS[ME.role]||['dash'])[0]; ({dash:dashView,collection:collectionView,buildings:buildingsView,finance:financeView,maint:maintView,staff:staffView,leases:leasesView,units:unitsView,tenants:tenantsView,settings:settingsView})[tab](); }

const empty=m=>`<div class="card p-10 text-center text-ink-500">${m}</div>`;

/* ───── data ───── */
let tenants=[],units=[],leases=[],payments=[],expenses=[],readings=[],maint=[],staff=[],buildings=[],payouts=[];
const load = {
  tenants: async q=>{ let r=db.from('tenants').select('*').order('created_at',{ascending:false}); if(q) r=r.or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`); tenants=(await r).data||[]; },
  units:   async ()=>{
    const rank={maintenance:0,vacant:1,occupied:2};
    units=((await db.from('units').select('*').order('building_name')).data||[])
      .sort((a,b)=>(rank[a.status]??3)-(rank[b.status]??3)
        || String(a.building_name).localeCompare(String(b.building_name))
        || String(a.unit_number).localeCompare(String(b.unit_number),undefined,{numeric:true}));
  },
  payouts: async ()=>{ await loadPayouts(); },
  buildings: async ()=>{
    buildings=(await db.from('buildings').select('*').order('name')).data||[];
    // أي مبنى مذكور في الوحدات ولم يُسجّل بعد يظهر افتراضيًا كمملوك
    const known=new Set(buildings.map(b=>b.name));
    [...new Set(units.map(u=>u.building_name))].filter(n=>n&&!known.has(n))
      .forEach(n=>buildings.push({name:n,ownership:'owned',management_fee_pct:0,_ghost:true}));
    buildings.sort((a,b)=>a.name.localeCompare(b.name));

/** كشف مبنى واحد في الفترة المختارة — أساس فصل الذمم */
function bookFor(name){
  const b=buildings.find(x=>x.name===name)||{name,ownership:'owned',management_fee_pct:0};
  const ids=units.filter(u=>u.building_name===name).map(u=>u.id);
  const p=payments.filter(x=>ids.includes(x.leases?.unit_id)&&inPeriod(x.due_date));
  const e=expenses.filter(x=>x.building_name===name&&inPeriod(x.expense_date));
  const collected=sumPaid(p.filter(x=>x.status==='paid'));
  const exp=e.reduce((s,x)=>s+Number(x.amount),0);
  const fee=b.ownership==='managed'?Math.round(collected*Number(b.management_fee_pct||0)/100):0;
  return { name, ownership:b.ownership, owner_name:b.owner_name, pct:Number(b.management_fee_pct||0),
    unitsTotal:ids.length, occupied:units.filter(u=>u.building_name===name&&u.status==='occupied').length,
    contracted:sumAmt(p), collected, overdue:sumAmt(p.filter(x=>x.status==='pending'&&x.due_date<today())),
    exp, fee, net:collected-exp, dueOwner:collected-exp-fee };
}

/* ───── تنبيهات انتهاء العقود والتجديد ───── */
function expiringLeases(days){
  const t=new Date(today());
  return leases.filter(l=>(l.status==='active'||l.status==='renewed')&&isValidDate(l.end_date))
    .map(l=>({...l,daysLeft:Math.round((new Date(l.end_date)-t)/864e5)}))
    .filter(l=>l.daysLeft<=days)
    .sort((a,b)=>a.daysLeft-b.daysLeft);
}

function expiryCard(){
  const soon=expiringLeases(90);
  if(!soon.length) return '';
  const n30=soon.filter(l=>l.daysLeft<=30).length, n60=soon.filter(l=>l.daysLeft>30&&l.daysLeft<=60).length;
  return `<div class="card p-5">

async function doRenew(id){
  const l=leases.find(x=>x.id===id), err=document.getElementById('rn_err');
  const start_date=rn_s.value, end_date=rn_e.value, annual=Number(rn_r.value), count=Number(rn_c.value);
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!start_date||!end_date||!annual) return fail('أكمل الحقول.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد البداية.');

  const unit=units.find(u=>u.id===l.unit_id);
  const vat_pct=unit?.unit_type==='commercial'?15:0;
  const {data,error}=await db.from('leases').insert({
    tenant_id:l.tenant_id, unit_id:l.unit_id, start_date, end_date, status:'active',
    annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12),
    ejar_number:l.ejar_number||null, deposit_amount:l.deposit_amount||0,
    late_fee_pct:l.late_fee_pct||0, vat_pct
  }).select().single();
  if(error) return fail('تعذّر التجديد: '+error.message);
  await db.from('payments').insert(buildSchedule(data.id,start_date,end_date,annual,count,vat_pct));
  await db.from('leases').update({status:'renewed'}).eq('id',id);
  await logAction('renew','lease',id,`جُدّد إلى ${end_date}`);
  closeModal(); leasesView();
}

async function addBuilding(){

        err=document.getElementById('bd_err');
  err.classList.add('hidden');
  if(!name){ err.textContent='اسم المبنى مطلوب.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('buildings').insert({ name, ownership,
    owner_name: ownership==='managed'?(document.getElementById('bd_own').value.trim()||null):null,
    management_fee_pct: ownership==='managed'?Number(document.getElementById('bd_f').value||0):0,
    contract_start:document.getElementById('bd_cs').value||null,
    contract_end:document.getElementById('bd_ce').value||null });

let payFilter='due';
async function collectionView(){
  const m=document.getElementById('main');
  m.innerHTML=`<div class="mb-6 flex flex-wrap items-end justify-between gap-3">
    <div><h1 class="text-2xl font-bold">التحصيل</h1><p class="text-ink-500 mt-1">${periodLabel()} · دفعات الإيجار المستحقة والمسددة</p></div>
    ${periodPicker()}
  </div>`;
  await load.payments();
  const t=today();
  const scope=payments.filter(p=>inPeriod(p.due_date));      // كل سنة (أو شهر) على حدة
  const od=scope.filter(p=>p.status==='pending'&&p.due_date<t);
  const up=scope.filter(p=>p.status==='pending'&&p.due_date>=t);
  const pd=scope.filter(p=>p.status==='paid');
  m.innerHTML+=`
  <div class="fade">
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-6">
      ${stat('المتأخرات',sumAmt(od),od.length+' دفعة','rose-600')}
      ${stat('مستحق قادم',sumAmt(up),up.length+' دفعة','amber-600')}
      ${stat('إجمالي التحصيل',sumPaid(pd),pd.length+' سند قبض · '+periodLabel(),'teal-700')}
    </div>
    <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
      ${chip('due','المستحقة',od.length+up.length)}${chip('overdue','المتأخرة',od.length)}
      ${chip('paid','المسددة',pd.length)}${chip('all','الكل',scope.length)}
    </div>
    <div id="plist" class="space-y-2.5"></div>
  </div>`;
  renderPayments();
}
const chip=(id,label,n)=>`<button onclick="setPayFilter('${id}')" class="shrink-0 px-4 py-2 rounded-lg text-sm border ${payFilter===id?'bg-teal-900 text-white border-teal-900 font-semibold':'bg-white border-paper-200 text-ink-700'}">${label} <span class="num opacity-70">${n}</span></button>`;
function setPayFilter(f){ payFilter=f; collectionView(); }
function renderPayments(){
  const t=today();
  const scope=payments.filter(p=>inPeriod(p.due_date));
  let rows=scope;
  if(payFilter==='due') rows=scope.filter(p=>p.status==='pending');
  if(payFilter==='overdue') rows=scope.filter(p=>p.status==='pending'&&p.due_date<t);
  if(payFilter==='paid') rows=scope.filter(p=>p.status==='paid');
  const box=document.getElementById('plist');
  if(!rows.length){ box.innerHTML=empty('لا دفعات في هذا التصنيف. أنشئ عقدًا ليُولَّد جدول دفعاته تلقائيًا.'); return; }
  box.innerHTML=rows.map(p=>{
    const late=p.status==='pending'&&p.due_date<t, days=Math.round((new Date(t)-new Date(p.due_date))/864e5), l=p.leases||{};
    return `<div class="card p-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold truncate">${l.tenants?.full_name||'—'}</p>
        <p class="text-sm text-ink-500 truncate">${l.units?.building_name||''} · وحدة ${l.units?.unit_number||''}</p>
        <p class="text-xs mt-1 ${late?'text-rose-600 font-semibold':'text-ink-500'}">الاستحقاق <span class="num">${p.due_date}</span>${late?` · متأخرة <span class="num">${days}</span> يوم`:''}</p>
      </div>
      <div class="text-left shrink-0">
        <p class="font-bold"><span class="num">${money(Number(p.amount)+Number(p.vat_amount||0))}</span> <span class="text-xs text-ink-500">ر.س</span></p>
        ${Number(p.vat_amount)?`<p class="text-[.7rem] text-ink-500">شامل ضريبة <span class="num">${money(p.vat_amount)}</span></p>`:''}
        ${p.status==='paid'?`<p class="text-xs text-teal-700 mt-1">سُددت <span class="num">${(p.paid_at||'').slice(0,10)}</span></p>`
          :`<button onclick="openReceipt('${p.id}')" class="btn-ghost mt-1.5 text-teal-700 border-teal-100">تسجيل دفعة</button>`}
      </div>
    </div>`;}).join('');
}
function openReceipt(id){
  const p=payments.find(x=>x.id===id);
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
  <div class="card relative w-full max-w-sm p-6 fade">
    <h3 class="font-bold text-xl">تسجيل دفعة</h3>

    <label class="eyebrow block mb-2">رقم السند / المرجع</label><input id="r_ref" class="field" placeholder="اختياري">
    <p id="r_err" class="text-rose-600 text-sm mt-3 hidden"></p>

  </div>`;

const closeModal=()=>document.getElementById('modal')?.remove();
async function saveReceipt(id){
  const amt=Number(r_amt.value), date=r_date.value, err=document.getElementById('r_err');
  if(!amt||amt<=0||!date){ err.textContent='أدخل مبلغًا صحيحًا وتاريخ الاستلام.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('payments').update({status:'paid',paid_amount:amt,paid_at:new Date(date+'T12:00:00').toISOString(),payment_method:r_method.value,receipt_number:r_ref.value.trim()||null}).eq('id',id);
  if(error){ err.textContent='تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  closeModal(); collectionView();
}

  paint:['دهان','صبغ','ترميم','بوية','بويه','جبس','سيراميك','بلاط'],
};
const ARD={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const norm = t => (t||'').replace(/[٠-٩]/g,d=>ARD[d]).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();

function parseNote(text){
  const t=norm(text);
  const out={category:'other',building:null,units:[],amount:null,unitIds:[],unknownUnits:[],description:(text||'').trim()};

  let best=null;
  buildings.map(b=>b.name).forEach(b=>{ const nb=norm(b); if(nb&&t.includes(nb)&&(!best||nb.length>norm(best).length)) best=b; });
  out.building=best;

  const m=t.match(/(?:شقه|شقق|وحده|وحدات|محل|محلات|مكتب|مكاتب|رقم)\s*((?:\d+[\s,و]*)+)/);
  const cand=m?m[1].split(/[\s,و]+/).filter(x=>/^\d+$/.test(x)):[];
  const real=units.filter(u=>!out.building||u.building_name===out.building);
  const matched=cand.filter(n=>real.some(u=>String(u.unit_number)===n));
  const leftover=cand.filter(n=>!matched.includes(n));
  out.units = matched.length?matched:cand;
  out.unitIds = real.filter(u=>out.units.includes(String(u.unit_number))).map(u=>u.id);
  out.unknownUnits = out.units.filter(n=>!real.some(u=>String(u.unit_number)===n));

  const near=t.match(/(\d+(?:[.,]\d+)?)\s*(?:ريال|ر\.?س|sar)/i)||t.match(/(?:ريال|ر\.?س)\s*(\d+(?:[.,]\d+)?)/i);
  if(near) out.amount=Number(near[1].replace(',',''));
  else{
    const used=new Set(matched);
    const pool=(t.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>Number(x.replace(',',''))).filter(n=>!used.has(String(n)));
    const pref=pool.filter(n=>leftover.includes(String(n)));
    out.amount = pref.length?Math.max(...pref) : (pool.length?Math.max(...pool):null);
  }

  for(const [c,w] of Object.entries(MK)){ if(w.some(x=>t.includes(norm(x)))){ out.category=c; break; } }
  return out;
}

    : `<p class="text-sm text-ink-300 col-span-3">لا وحدات في هذا المبنى</p>`;

function toggleScope(){
  const perUnit=document.querySelector('input[name=scope]:checked').value==='units';
  document.getElementById('mt_units').classList.toggle('hidden',!perUnit);
  splitPreview();
}
function splitPreview(){
  const box=document.getElementById('mt_split'); if(!box) return;
  const cost=Number(document.getElementById('mt_cost').value);
  const perUnit=document.querySelector('input[name=scope]:checked').value==='units';
  const n=document.querySelectorAll('.mt_u:checked').length;
  box.textContent = !cost ? ''
    : !perUnit ? `تُحمّل كاملة على المبنى (مصروف مشترك): ${money(cost)} ر.س`
    : n ? `تُقسّم على ${n} وحدة — ${money(Math.round(cost/n))} ر.س لكل وحدة`
    : 'اختر الوحدات المستفيدة لتوزيع التكلفة';

async function addMaint(){
  const building_name=document.getElementById('mt_b').value,
        category=document.getElementById('mt_c').value,
        cost=Number(document.getElementById('mt_cost').value),
        service_date=document.getElementById('mt_d').value,
        vendor=document.getElementById('mt_v').value.trim()||null,
        description=document.getElementById('mt_desc').value.trim()||null,
        perUnit=document.querySelector('input[name=scope]:checked').value==='units',
        unit_ids=[...document.querySelectorAll('.mt_u:checked')].map(c=>c.value),
        err=document.getElementById('mt_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!building_name||!cost||!service_date) return fail('المبنى والتكلفة والتاريخ مطلوبة.');
  if(perUnit && !unit_ids.length) return fail('اختر الوحدات المستفيدة، أو حمّل التكلفة على المبنى كامل.');

  const status=document.getElementById('mt_st').value;
  const {data,error}=await db.from('maintenance').insert({
    building_name,category,description,cost,estimated_cost:cost,adjustments:[],vendor,service_date,status,
    scope: perUnit?'units':'building', unit_ids: perUnit?unit_ids:[]
  }).select().single();
  if(error) return fail('تعذّر الحفظ: '+error.message);
  if(status!=='done'){ maintView(); return; }   // التكلفة تُقيَّد عند الإنجاز فقط

  // تُقيَّد التكلفة في المصروفات تلقائيًا حتى تظهر في المالية ولوحة المالك
  const rows = perUnit
    ? unit_ids.map(uid=>({ building_name, category:'maintenance', amount:Math.round(cost/unit_ids.length),
        expense_date:service_date, unit_id:uid, source:'maintenance', ref_id:data.id,
        notes:`${MAINT_CATS[category]}${description?' — '+description:''}` }))
    : [{ building_name, category:'maintenance', amount:cost, expense_date:service_date,
        source:'maintenance', ref_id:data.id, notes:`${MAINT_CATS[category]} (مشترك)${description?' — '+description:''}` }];
  await db.from('expenses').insert(rows);
  maintView();
}

async function saveAdj(id){
  const amount=Number(document.getElementById('aj_a').value), err=document.getElementById('aj_err');

  const x=maint.find(m=>m.id===id);
  const adjustments=[...(x.adjustments||[]),{amount,note:document.getElementById('aj_n').value.trim()||null,date:document.getElementById('aj_d').value}];
  const cost=Number(x.estimated_cost??x.cost??0)+adjustments.reduce((s,a)=>s+Number(a.amount||0),0);
  const {error}=await db.from('maintenance').update({adjustments,cost}).eq('id',id);
  if(error){ err.textContent='تعذّر الحفظ: '+error.message; err.classList.remove('hidden'); return; }
  await syncMaintExpense({...x,adjustments,cost});

async function postMaintExpense(x){
  const ids=x.unit_ids||[];
  const rows = ids.length
    ? ids.map(uid=>({ building_name:x.building_name, category:'maintenance', amount:Math.round(x.cost/ids.length),
        expense_date:x.service_date, unit_id:uid, source:'maintenance', ref_id:x.id,
        notes:`${MAINT_CATS[x.category]||x.category}${x.description?' — '+x.description:''}` }))
    : [{ building_name:x.building_name, category:'maintenance', amount:x.cost, expense_date:x.service_date,
        source:'maintenance', ref_id:x.id, notes:`${MAINT_CATS[x.category]||x.category} (مشترك)${x.description?' — '+x.description:''}` }];
  await db.from('expenses').insert(rows);
}

async function deleteMaint(id){

  maintView();
}

let savingLease=false;
async function addLease(){
  if(savingLease) return;
  const btn=document.activeElement;
  const tenant_id=l_tenant.value,unit_id=l_unit.value,start_date=l_start.value,end_date=l_end.value,
        annual=Number(l_rent.value),count=Number(l_count.value),err=document.getElementById('l_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!tenant_id||!unit_id||!start_date||!end_date||!annual) return fail('أكمل كل الحقول قبل الحفظ.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');

  savingLease=true;
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الحفظ…'; }
  try{
    // تحقق لحظي: لا عقدين ساريين على نفس الوحدة
    const {data:clash}=await db.from('leases').select('id').eq('unit_id',unit_id).eq('status','active');
    if(clash&&clash.length){ return fail('هذه الوحدة عليها عقد ساري بالفعل. حدّث الصفحة واختر وحدة أخرى.'); }

    const unit=units.find(u=>u.id===unit_id);
    const vat_pct = unit?.unit_type==='commercial' ? 15 : 0;    // السكني معفى، التجاري خاضع
    const {data,error}=await db.from('leases').insert({
      tenant_id,unit_id,start_date,end_date,status:'active',
      annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12),
      ejar_number:document.getElementById('l_ejar').value.trim()||null,
      deposit_amount:Number(document.getElementById('l_dep').value||0),
      late_fee_pct:Number(document.getElementById('l_late').value||0),
      vat_pct
    }).select().single();
    if(error) return fail('تعذّر حفظ العقد: '+error.message);

    await db.from('units').update({status:'occupied'}).eq('id',unit_id);
    const rows=buildSchedule(data.id,start_date,end_date,annual,count,vat_pct);
    await db.from('payments').insert(rows);
    await logAction('create','lease',data.id,`${unit?.building_name} وحدة ${unit?.unit_number}`);

    // عقد بتاريخ قديم: اعرض تسوية الدفعات المستحقة قبل اليوم دفعة واحدة
    const past=rows.filter(r=>r.due_date<today()).length;
    if(past){ go('collection'); setTimeout(()=>offerBackfill(data.id,past),300); return; }
    go('collection');
  } finally {
    savingLease=false;
    if(btn&&document.contains(btn)){ btn.disabled=false; btn.textContent='حفظ العقد وتفعيله'; }
  }
}


/** عقود بتواريخ قديمة: تسجيل الدفعات السابقة مسددة بتاريخ استحقاقها الأصلي */
function offerBackfill(leaseId,count){
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>

      يمكن تسجيلها مسددة الآن <b>بتاريخ استحقاقها الأصلي</b> بدل إدخالها واحدة واحدة.</p>
    <label class="flex items-center gap-2 text-sm mb-4">

    </label>

    <div class="flex gap-2">

      <button onclick="closeModal()" class="btn-ghost px-4">تخطّي</button>
    </div>
  </div>`;

async function runBackfill(leaseId){
  if(!document.getElementById('bf_all').checked){ closeModal(); return; }
  const {data}=await db.from('payments').select('id,due_date,amount').eq('lease_id',leaseId).eq('status','pending').lt('due_date',today());
  for(const p of (data||[])){
    await db.from('payments').update({status:'paid',paid_amount:p.amount,
      paid_at:new Date(p.due_date+'T12:00:00').toISOString(),   // تاريخ السداد = تاريخ الاستحقاق الأصلي
      payment_method:'transfer',receipt_number:null,notes:'تسوية عقد سابق'}).eq('id',p.id);
  }
  await logAction('backfill','lease',leaseId,`${(data||[]).length} دفعة`);
  closeModal(); collectionView();
}

/** دفعة لكل قسط: المبلغ = الإيجار السنوي ÷ عدد الدفعات، والفاصل = ١٢ ÷ عدد الدفعات بالأشهر */
function buildSchedule(lease_id,start,end,annual,count,vat_pct=0){
  const n=Math.max(1,Math.round(Number(count)||1));
  if(!isValidDate(start)||!isValidDate(end)) return [];
  const rows=[], last=new Date(end), d=new Date(start),
        step=Math.max(1,Math.round(12/n)), amount=Math.round(Number(annual||0)/n);
  let guardCount=0;
  while(d<=last && guardCount++<600){                 // سقف أمان يمنع أي دوران لا نهائي
    const v=ymd(d); if(!v) break;
    rows.push({lease_id,due_date:v,amount,status:'pending',vat_amount:Math.round(amount*Number(vat_pct||0)/100)});
    d.setMonth(d.getMonth()+step);
  }
  return rows;
}

async function saveLeaseEdit(id,unitId){
  const start_date=le_s.value, end_date=le_e.value, annual=Number(le_r.value),
        count=Number(le_c.value), status=le_st.value, regen=le_regen.checked,
        err=document.getElementById('le_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!start_date||!end_date||!annual) return fail('التواريخ والإيجار مطلوبة.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');
  if(regen && !confirm('سيُحذف جدول الدفعات الحالي بالكامل ويُولَّد من جديد. متابعة؟')) return;

  const {error}=await db.from('leases').update({ start_date, end_date, status,
    annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12) }).eq('id',id);
  if(error) return fail('تعذّر الحفظ: '+error.message);

  if(regen){
    await db.from('payments').delete().eq('lease_id',id);
    await db.from('payments').insert(buildSchedule(id,start_date,end_date,annual,count));
  }
  await db.from('units').update({ status: (status==='active'||status==='renewed') ? 'occupied' : 'vacant' }).eq('id',unitId);
  closeModal(); leasesView();
}

async function endLease(id,unitId){
  const future=payments.filter(p=>p.lease_id===id&&p.status==='pending'&&p.due_date>today()).length;
  if(!confirm(`إنهاء هذا العقد وإرجاع الوحدة إلى الشواغر؟${future?`\nسيتم إلغاء ${future} دفعة مستقبلية لم تُستحق بعد.`:''}`)) return;
  await db.from('leases').update({status:'terminated'}).eq('id',id);
  await db.from('units').update({status:'vacant'}).eq('id',unitId);
  // الدفعات المستقبلية غير المستحقة تُلغى حتى لا تظهر كمتأخرات وهمية
  await db.from('payments').delete().eq('lease_id',id).eq('status','pending').gt('due_date',today());
  leasesView();
}

}

async function deleteUnit(id){
  await load.leases();                                  // بيانات محدّثة دائمًا قبل الفحص
  const mine=leases.filter(l=>l.unit_id===id);
  const active=mine.filter(l=>l.status==='active');
  if(active.length) return alert('هذه الوحدة عليها عقد ساري. أنهِ العقد من قسم العقود أولاً.');
  const msg = mine.length
    ? `هذه الوحدة لها ${mine.length} عقد منتهٍ في السجل. حذفها سيحذف تلك العقود ودفعاتها نهائيًا. متابعة؟`
    : 'حذف هذه الوحدة نهائيًا؟';
  if(!confirm(msg)) return;

  if(mine.length){
    await db.from('payments').delete().in('lease_id',mine.map(l=>l.id));
    const del=await db.from('leases').delete().in('id',mine.map(l=>l.id));
    if(del.error) return alert('تعذّر حذف عقود هذه الوحدة: '+del.error.message);
  }
  await db.from('meter_readings').delete().eq('unit_id',id);
  await db.from('expenses').delete().eq('unit_id',id);

  const {error}=await db.from('units').delete().eq('id',id);
  if(error) return alert('تعذّر حذف الوحدة.\nالسبب: '+error.message);
  closeModal(); unitsView();
}

function importHint(){

    : 'الترتيب: الاسم | الجوال | رقم الهوية';
}

async function runImport(){
  const t=document.getElementById('im_t').value, raw=document.getElementById('im_data').value.trim(),
        out=document.getElementById('im_out');
  if(!raw) return;
  const lines=raw.split(/\r?\n/).filter(x=>x.trim());
  const split=l=>l.split(/\t|,|؛|;/).map(x=>x.trim());
  let ok=0, bad=[];
  for(const [i,line] of lines.entries()){
    const c=split(line);
    try{
      if(t==='units'){
        if(!c[0]||!c[1]) { bad.push(i+1); continue; }
        const {error}=await db.from('units').insert({building_name:c[0],unit_number:c[1],
          area_sqm:c[2]?Number(c[2]):null, base_rent:Number(c[3]||0),
          unit_type:(c[4]||'').includes('تجار')?'commercial':'residential'});
        if(error){ bad.push(i+1); continue; }
      } else {
        if(!c[0]||!c[1]) { bad.push(i+1); continue; }
        const {error}=await db.from('tenants').insert({full_name:c[0],phone:c[1],national_id:c[2]||null});
        if(error){ bad.push(i+1); continue; }
      }
      ok++;
    }catch(e){ bad.push(i+1); }
  }
  out.innerHTML = `<span class="text-teal-700 font-semibold">نجح <span class="num">${ok}</span> سجل.</span>`
    + (bad.length?` <span class="text-rose-600">تعذّرت الصفوف: ${bad.join('، ')} — تحقق من التكرار أو نقص البيانات.</span>`:'');
  if(ok) await logAction('import',t,'',ok+' سجل');
  document.getElementById('im_data').value='';
}

async function exportTable(name){
  const {data,error}=await db.from(name).select('*');
  if(error||!data?.length) return showError('لا بيانات للتصدير في هذا الجدول.');
  const cols=[...new Set(data.flatMap(r=>Object.keys(r)))];
  const esc=v=>{ const x=v==null?'':(typeof v==='object'?JSON.stringify(v):String(v)); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; };
  const csv='\uFEFF'+[cols.join(','),...data.map(r=>cols.map(c=>esc(r[c])).join(','))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`${name}-${today()}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

async function deleteTenant(id){
  await load.leases();
  const own=leases.filter(l=>l.tenant_id===id);
  const act=own.filter(l=>l.status==='active');
  if(act.length) return alert('هذا المستأجر عليه عقد ساري. أنهِ العقد أولاً.');
  if(!confirm(own.length?`سيُحذف المستأجر و${own.length} عقد منتهٍ ودفعاتها. متابعة؟`:'حذف هذا المستأجر نهائيًا؟')) return;
  if(own.length) await db.from('leases').delete().in('id',own.map(l=>l.id));
  const {error}=await db.from('tenants').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف — المستأجر مرتبط بسجلات أخرى.');
  closeModal(); await load.tenants(tq); renderTenants();
}
async function blockTenant(id){
  await load.leases();
  if(leases.some(l=>l.tenant_id===id&&l.status==='active'))
    if(!confirm('هذا المستأجر عليه عقد ساري. إدراجه في القائمة السوداء لن يُنهي العقد. متابعة؟')) return;
  const reason=prompt('سبب الإدراج في القائمة السوداء:');
  if(!reason||reason.trim().length<3) return;
  await db.from('tenants').update({status:'blacklisted',blacklist_reason:reason,blacklisted_at:new Date().toISOString()}).eq('id',id);
  await load.tenants(tq); renderTenants();
}
async function unblockTenant(id){
  await db.from('tenants').update({status:'active',blacklist_reason:null,blacklisted_at:null}).eq('id',id);
  await load.tenants(tq); renderTenants();
}

init();
</script>
