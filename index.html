/* ═══ الثيمات — مستلهمة من عمارة جدة القديمة ═══ */
:root{
  /* بلد — حجر منقبي، أخضر الرواشين، نحاس */
  --bg:#F5F2EC; --bg-tint-1:#E9EEE9; --bg-tint-2:#F2EAD9; --surface:#FFFDF9;
  --paper-50:#F7F4EE; --paper-100:#EDE8DF; --paper-200:#DED7CA;
  --ink-900:#171A17; --ink-700:#3E443E; --ink-500:#6F7469; --ink-300:#A9AC9F;
  --brand-900:#12312A; --brand-700:#1B5347; --brand-600:#26705F; --brand-300:#8FBDAE; --brand-100:#DCE9E2;
  --gold-600:#96692B; --gold-100:#F3E7D0;
  --red-600:#A03B32; --red-100:#F5E0DC;
  --font-display:'Readex Pro'; --font-body:'IBM Plex Sans Arabic'; --font-num:'Rubik';
  --fs:17px; --radius:14px;
}
[data-theme="ink"]{
  --bg:#F4F6F8; --bg-tint-1:#E6ECF3; --bg-tint-2:#EDEAF3; --surface:#FFFFFF;
  --paper-50:#F6F8FA; --paper-100:#EBEFF3; --paper-200:#DBE1E8;
  --ink-900:#101725; --ink-700:#39424F; --ink-500:#6A7382; --ink-300:#A6AEBA;
  --brand-900:#131F3D; --brand-700:#1F3A6E; --brand-600:#2C55A0; --brand-300:#9DB6DD; --brand-100:#E1E9F6;
  --gold-600:#8A6A18; --gold-100:#F3EBD3; --red-600:#A5343C; --red-100:#F7DEE0;
}
[data-theme="palm"]{
  --bg:#F6F8F9; --bg-tint-1:#E4F2ED; --bg-tint-2:#F2EDE3; --surface:#FFFFFF;
  --paper-50:#F6F8F9; --paper-100:#EDF0F2; --paper-200:#DFE4E8;
  --ink-900:#0E1621; --ink-700:#39434F; --ink-500:#6C7683; --ink-300:#AAB2BC;
  --brand-900:#083A31; --brand-700:#0E5B4C; --brand-600:#137A65; --brand-300:#7FC4B2; --brand-100:#DCEFE9;
  --gold-600:#A97015; --gold-100:#FAEDD6; --red-600:#A93838; --red-100:#FAE1E1;
}
[data-theme="night"]{
  --bg:#0D1214; --bg-tint-1:#12211D; --bg-tint-2:#1A1712; --surface:#151C1F;
  --paper-50:#1A2225; --paper-100:#232C30; --paper-200:#2E393E;
  --ink-900:#EDF0EF; --ink-700:#C2CAC8; --ink-500:#8B9694; --ink-300:#5D6866;
  --brand-900:#0B3F35; --brand-700:#2E9077; --brand-600:#3FAE90; --brand-300:#5FBFA5; --brand-100:#173A33;

}

html{ font-size:var(--fs); }
body{
  font-family:var(--font-body),system-ui,sans-serif; color:var(--ink-900);
  background:
    radial-gradient(1200px 520px at 88% -10%, var(--bg-tint-1) 0%, transparent 60%),

  background-attachment:fixed;
  transition:background-color .3s, color .3s;
}
h1,h2,h3,.display{ font-family:var(--font-display),system-ui,sans-serif; letter-spacing:-.02em; font-weight:600; }
h1{ line-height:1.25; }
.num{ font-family:var(--font-num),system-ui,sans-serif; font-feature-settings:'tnum' 1,'lnum' 1; font-variant-numeric:tabular-nums; direction:ltr; display:inline-block; letter-spacing:-.01em; }

.field{ width:100%; border:1px solid var(--paper-200); background:var(--surface); color:var(--ink-900);
  border-radius:calc(var(--radius) - 4px); padding:.65rem .8rem; font-size:1rem; font-family:inherit;
  transition:border-color .15s, box-shadow .15s; }
.field:hover{ border-color:var(--brand-300); }
.field:focus{ outline:none; border-color:var(--brand-600); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand-600) 18%, transparent); }

.btn-primary{ background:linear-gradient(140deg,var(--brand-700),var(--brand-600)); color:#fff;
  border-radius:calc(var(--radius) - 4px); padding:.7rem 1.25rem; font-weight:600; font-size:1rem;
  font-family:var(--font-display),sans-serif; letter-spacing:-.01em;
  box-shadow:0 1px 2px color-mix(in srgb,var(--brand-900) 30%,transparent), 0 8px 20px -6px color-mix(in srgb,var(--brand-900) 45%,transparent);
  transition:transform .12s, box-shadow .2s, filter .2s; }
.btn-primary:hover{ filter:brightness(1.08); box-shadow:0 2px 4px color-mix(in srgb,var(--brand-900) 30%,transparent), 0 12px 28px -8px color-mix(in srgb,var(--brand-900) 50%,transparent); }
.btn-primary:active{ transform:translateY(1px); }
.btn-primary:disabled{ opacity:.55; box-shadow:none; }

.btn-ghost{ border:1px solid var(--paper-200); background:var(--surface); color:var(--ink-700);
  border-radius:calc(var(--radius) - 6px); padding:.4rem .8rem; font-size:.85rem;
  transition:background .15s, border-color .15s, color .15s; }
.btn-ghost:hover{ background:var(--paper-50); border-color:var(--brand-300); color:var(--ink-900); }

.card{ background:var(--surface); border:1px solid color-mix(in srgb,var(--ink-900) 7%,transparent);
  border-radius:var(--radius); box-shadow:0 1px 2px color-mix(in srgb,var(--ink-900) 5%,transparent),
  0 10px 28px -12px color-mix(in srgb,var(--ink-900) 18%,transparent);
  transition:box-shadow .25s, border-color .25s; }

.eyebrow{ font-size:.72rem; letter-spacing:.09em; color:var(--ink-500); font-weight:600; }

.navlink{ display:flex; align-items:center; gap:.7rem; padding:.66rem .85rem; border-radius:calc(var(--radius) - 4px);
  font-size:.98rem; color:var(--ink-700); width:100%; text-align:right;
  font-family:var(--font-display),sans-serif; transition:background .15s, color .15s; position:relative; }
.navlink:hover{ background:var(--paper-100); color:var(--ink-900); }
.navlink.on{ background:linear-gradient(140deg,var(--brand-900),var(--brand-700)); color:#fff; font-weight:600;
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--brand-900) 65%,transparent); }

.pill{ padding:.16rem .58rem; border-radius:.45rem; font-size:.76rem; font-weight:600; white-space:nowrap; }

/* الجداول: خط دفتر — مسطرة رفيعة وأرقام مصفوفة */
table{ border-collapse:collapse; }
th{ font-size:.78rem; color:var(--ink-500); font-weight:600; text-align:right; padding:.7rem .55rem;
  border-bottom:1.5px solid var(--paper-200); letter-spacing:.02em; }
td{ padding:.78rem .55rem; font-size:.92rem; border-top:1px solid var(--paper-100); color:var(--ink-900); }
tbody tr{ transition:background .15s; }
tbody tr:hover{ background:var(--paper-50); }

summary{ list-style:none; cursor:pointer; font-family:var(--font-display),sans-serif; }
summary::-webkit-details-marker{ display:none; }
summary::before{ content:'+'; display:inline-grid; place-items:center; width:1.45rem; height:1.45rem;
  margin-left:.55rem; border-radius:.45rem; background:var(--brand-100); color:var(--brand-700);
  font-weight:700; font-size:1.05rem; transition:transform .25s, background .2s; }
details[open] summary::before{ content:'−'; transform:rotate(180deg); }

/* شريط الإشغال — خلايا شبكية مستوحاة من الرواشين */
.lattice{ display:flex; gap:3px; flex-wrap:wrap; }
.lattice span{ position:relative; border-radius:3px; transition:transform .18s, filter .18s; }
.lattice span:hover{ transform:translateY(-2px); filter:brightness(1.12); z-index:1; }

*:focus-visible{ outline:2px solid var(--brand-600); outline-offset:2px; border-radius:4px; }
::selection{ background:var(--brand-100); color:var(--brand-900); }

@media (prefers-reduced-motion:no-preference){
  .card:hover{ box-shadow:0 2px 6px color-mix(in srgb,var(--ink-900) 6%,transparent), 0 18px 40px -14px color-mix(in srgb,var(--ink-900) 26%,transparent); }
  .fade{ animation:f .32s cubic-bezier(.22,1,.36,1) both } @keyframes f{ from{opacity:0;transform:translateY(7px)} to{opacity:1} }
}
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }

<script>

/* ═══ حصانة عامة: عنصر مفقود لا يُسقط الواجهة ═══
   بعض نقاط الرسم تُستدعى بعد إعادة بناء الصفحة، فيختفي العنصر الذي تكتب فيه.
   بدل أن يتوقف التنفيذ، نعيد عنصرًا صوريًا منفصلًا يمتص الكتابة بلا أثر. */
(function(){
  const real = document.getElementById.bind(document);
  const seen = new Set();
  document.getElementById = function(id){
    const el = real(id);
    if(el) return el;
    if(!seen.has(id)){ seen.add(id); console.warn('[أصول] عنصر غير موجود:', id); }
    const ghost = document.createElement('div');
    ghost.dataset.ghost = id;
    return ghost;
  };
})();

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ═══ المظهر: ثيم وخط وحجم — يُحفظ لكل مستخدم ═══ */
const THEMES = {
  balad:{ label:'بلد',  note:'حجر جدة القديمة وأخضر الرواشين', sw:['#F5F2EC','#1B5347','#96692B'] },
  ink:  { label:'حِبر', note:'أزرق رسمي بطابع مالي',            sw:['#F4F6F8','#1F3A6E','#8A6A18'] },
  palm: { label:'نخيل', note:'أخضر فيروزي هادئ',               sw:['#F6F8F9','#0E5B4C','#A97015'] },
  night:{ label:'ليل',  note:'داكن مريح للعمل الطويل',          sw:['#0D1214','#2E9077','#D4A24C'] },
};
const FONTS = {
  readex:{ label:'ريدكس',  display:'Readex Pro',           body:'IBM Plex Sans Arabic', note:'هندسي حديث' },
  plex:  { label:'بلكس',   display:'IBM Plex Sans Arabic', body:'IBM Plex Sans Arabic', note:'محايد واضح' },
  almarai:{label:'المراعي',display:'Almarai',              body:'Almarai',              note:'عريض وصريح' },
  tajawal:{label:'تجوال',  display:'Tajawal',              body:'Tajawal',              note:'خفيف وأنيق' },
  cairo: { label:'القاهرة',display:'Cairo',                body:'Cairo',                note:'كلاسيكي متزن' },
};
const SIZES = { compact:{label:'مضغوط',px:'15.5px'}, normal:{label:'معتاد',px:'17px'}, large:{label:'مريح',px:'18.5px'} };

const store=(k,v)=>{ try{ v===undefined?null:localStorage.setItem(k,v); return localStorage.getItem(k); }catch(e){ return null; } };
let UI = {
  theme: store('ui_theme')||'balad',
  font:  store('ui_font') ||'readex',
  size:  store('ui_size') ||'normal',
};

function applyUI(){
  const r=document.documentElement;
  r.setAttribute('data-theme',UI.theme);
  r.style.setProperty('--font-display',`'${FONTS[UI.font].display}'`);
  r.style.setProperty('--font-body',`'${FONTS[UI.font].body}'`);
  r.style.setProperty('--fs',SIZES[UI.size].px);
  document.querySelector('meta[name="theme-color"]')?.remove();
  const m=document.createElement('meta'); m.name='theme-color';
  m.content=getComputedStyle(r).getPropertyValue('--bg').trim(); document.head.appendChild(m);
}

function setUI(k,v){ UI[k]=v; store('ui_'+k,v); applyUI(); if(document.getElementById('appearance')) renderAppearance(); }

function openAppearance(){
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4 overflow-y-auto';
  w.innerHTML=`<div class="absolute inset-0" style="background:color-mix(in srgb,var(--ink-900) 45%,transparent)" onclick="closeModal()"></div>
    <div class="card relative w-full max-w-md p-6 fade my-8" id="appearance"></div>`;
  document.body.appendChild(w); renderAppearance();
}

function renderAppearance(){
  const box=document.getElementById('appearance'); if(box.dataset.ghost) return;
  box.innerHTML=`
    <h3 class="font-bold text-xl">المظهر</h3>
    <p class="text-ink-500 text-sm mt-1 mb-6">اختيارك يُحفظ على هذا الجهاز ولا يؤثّر على بقية الفريق.</p>

    <p class="eyebrow mb-2.5">اللوحة اللونية</p>
    <div class="grid grid-cols-2 gap-2.5 mb-6">
      ${Object.entries(THEMES).map(([k,t])=>`
        <button onclick="setUI('theme','${k}')" class="text-right p-3 rounded-xl border transition"
          style="border-color:${UI.theme===k?'var(--brand-600)':'var(--paper-200)'};background:${UI.theme===k?'var(--brand-100)':'var(--surface)'}">
          <span class="flex gap-1 mb-2">${t.sw.map(c=>`<span style="width:16px;height:16px;border-radius:5px;background:${c};border:1px solid rgba(0,0,0,.08)"></span>`).join('')}</span>
          <span class="block font-semibold text-sm">${t.label}</span>
          <span class="block text-xs text-ink-500 mt-0.5">${t.note}</span>
        </button>`).join('')}
    </div>

    <p class="eyebrow mb-2.5">الخط</p>
    <div class="space-y-2 mb-6">
      ${Object.entries(FONTS).map(([k,f])=>`
        <button onclick="setUI('font','${k}')" class="w-full flex items-center justify-between gap-3 p-3 rounded-xl border transition"
          style="border-color:${UI.font===k?'var(--brand-600)':'var(--paper-200)'};background:${UI.font===k?'var(--brand-100)':'var(--surface)'}">
          <span class="text-right">
            <span class="block font-semibold text-sm" style="font-family:'${f.display}'">${f.label}</span>
            <span class="block text-xs text-ink-500">${f.note}</span>
          </span>
          <span class="text-lg shrink-0" style="font-family:'${f.display}'">أصول ١٢٣</span>
        </button>`).join('')}
    </div>

    <p class="eyebrow mb-2.5">حجم النص</p>
    <div class="flex gap-2 mb-6">
      ${Object.entries(SIZES).map(([k,z])=>`
        <button onclick="setUI('size','${k}')" class="flex-1 py-2.5 rounded-xl border text-sm transition"
          style="border-color:${UI.size===k?'var(--brand-600)':'var(--paper-200)'};background:${UI.size===k?'var(--brand-100)':'var(--surface)'};font-size:${k==='compact'?'.82rem':k==='large'?'1.05rem':'.93rem'}">
          ${z.label}</button>`).join('')}
    </div>

    <button onclick="closeModal()" class="btn-primary w-full">تم</button>`;
}


/* تهريب أي نص قادم من البيانات قبل عرضه — يمنع حقن سكربت عبر الأسماء والأوصاف */
function esc(v){
  if(v==null) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const RX = [
  [/^متأخرة (\d+) يوم$/, (m)=>`${m[1]} days overdue`],
  [/^سُددت (.+)$/,        (m)=>`Paid ${m[1]}`],
  [/^الاستحقاق (.+)$/,    (m)=>`Due ${m[1]}`],
  [/^(\d+) سند قبض(.*)$/,(m)=>`${m[1]} receipts${m[2]}`],
  [/^(\d+) دفعة$/,       (m)=>`${m[1]} installments`],
  [/^(\d+) عمل في الفترة$/,(m)=>`${m[1]} jobs this period`],
  [/^(\d+) عامل على رأس العمل$/,(m)=>`${m[1]} active employees`],
  [/^سنة (\d+)$/,        (m)=>`Year ${m[1]}`],
  [/^وحدة (.+)$/,         (m)=>`Unit ${m[1]}`],
  [/^ينتهي (.+)$/,        (m)=>`Ends ${m[1]}`],
];
const MONTH_EN={'يناير':'January','فبراير':'February','مارس':'March','أبريل':'April','مايو':'May','يونيو':'June',
  'يوليو':'July','أغسطس':'August','سبتمبر':'September','أكتوبر':'October','نوفمبر':'November','ديسمبر':'December'};

function tr(txt){
  const t=txt.trim(); if(!t) return null;
  if(DICT[t]) return DICT[t];
  if(MONTH_EN[t]) return MONTH_EN[t];
  for(const [rx,fn] of RX){ const m=t.match(rx); if(m) return fn(m); }
  if(t==='ر.س') return 'SAR';
  return null;
}

let observing=null;
function translateTree(root){
  if(LANG!=='en'||!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    if(n.parentElement && n.parentElement.closest('[data-noi18n]')) return;
    const v=tr(n.nodeValue); if(v!==null) n.nodeValue=n.nodeValue.replace(n.nodeValue.trim(),v);
  });
  root.querySelectorAll?.('[placeholder]').forEach(el=>{ const v=tr(el.placeholder); if(v!==null) el.placeholder=v; });
  root.querySelectorAll?.('[title]').forEach(el=>{ const v=tr(el.title); if(v!==null) el.title=v; });
}

function applyLang(){
  const html=document.documentElement;
  html.lang=LANG; html.dir = LANG==='ar' ? 'rtl' : 'ltr';
  document.body.style.fontFamily = LANG==='ar'
    ? "'IBM Plex Sans Arabic',system-ui,sans-serif"
    : "'Readex Pro',system-ui,sans-serif";
  if(LANG!=='en') return;
  translateTree(document.body);
  if(!observing){
    observing=new MutationObserver(muts=>{
      observing.disconnect();
      muts.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1) translateTree(n); else if(n.nodeType===3){const v=tr(n.nodeValue); if(v!==null) n.nodeValue=v;} }));
      observing.observe(document.body,{childList:true,subtree:true});
    });
    observing.observe(document.body,{childList:true,subtree:true});
  }
}

function showError(msg){
  let b=document.getElementById('errbar');
  if(!b){ b=document.createElement('div'); b.id='errbar';
    b.style.cssText='position:fixed;bottom:0;right:0;left:0;z-index:99;background:#A93838;color:#fff;padding:.7rem 1rem;font-size:.85rem;direction:rtl;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start';
    document.body.appendChild(b); }
  b.innerHTML='<span style="flex:1">'+msg+'</span><button onclick="this.parentNode.remove()" style="font-weight:700">إغلاق</button>';
}
window.onerror=(m,src,line,col,err)=>{
  const where=(err&&err.stack||'').split('\n')[1]||'';
  showError('خطأ: '+m+' (سطر '+line+')'+(where?'<br><span style="opacity:.8;font-size:.75rem">'+esc(where.trim())+'</span>':''));
};

let PMODE='year';                                   // year | month
let PMONTH=String(new Date().getMonth()+1).padStart(2,'0');

const periodKey   = () => PMODE==='year' ? YR : `${YR}-${PMONTH}`;
const inPeriod    = d => !!d && d.startsWith(periodKey());
const periodLabel = () => PMODE==='year' ? `سنة ${YR}` : `${MONTHS[Number(PMONTH)-1]} ${YR}`;

function setPeriod(mode,val){
  if(mode==='mode') PMODE=val;
  else if(mode==='year') YR=val;
  else PMONTH=val;
  route();
}

const periodPicker = () => {
  const y=Number(THIS_YEAR), years=[y+1,y,y-1,y-2];
  return `<div class="flex flex-wrap items-center gap-2">
    <div class="inline-flex bg-white border border-paper-200 rounded-xl p-1">
      <button onclick="setPeriod('mode','year')"  class="px-3 py-1.5 rounded-lg text-sm ${PMODE==='year'?'bg-teal-900 text-white font-semibold':'text-ink-500'}">سنوي</button>
      <button onclick="setPeriod('mode','month')" class="px-3 py-1.5 rounded-lg text-sm ${PMODE==='month'?'bg-teal-900 text-white font-semibold':'text-ink-500'}">شهري</button>
    </div>
    ${PMODE==='month'?`<select onchange="setPeriod('month',this.value)" class="field w-auto py-1.5 text-sm">
      ${MONTHS.map((m,i)=>{const v=String(i+1).padStart(2,'0');return `<option value="${v}" ${v===PMONTH?'selected':''}>${m}</option>`;}).join('')}
    </select>`:''}
    <select onchange="setPeriod('year',this.value)" class="field w-auto py-1.5 text-sm num">
      ${years.map(v=>`<option value="${v}" ${String(v)===YR?'selected':''}>${v}</option>`).join('')}
    </select>
  </div>`;
};

/** حارس ضد الضغط المزدوج على أزرار الحفظ */
const busy=new Set();
async function once(key,btn,fn){
  if(busy.has(key)) return;
  busy.add(key);
  const el=btn&&document.activeElement; const label=el?.textContent;
  if(el){ el.disabled=true; el.textContent='جارٍ الحفظ…'; }
  try{ await fn(); } finally { busy.delete(key); if(el&&document.contains(el)){ el.disabled=false; el.textContent=label; } }
}

  applyUI();

}
async function loadMe(){
  let role='none', blds=[];
  try{
    const r=await db.rpc('my_role');            // دالة موثوقة لا تخضع لسياسات القراءة
    if(!r.error && r.data) role=r.data;
    const b=await db.rpc('my_buildings');
    if(!b.error && b.data) blds=b.data;
  }catch(e){}
  ME={role,full_name:user.email,buildings:blds};
  const t=ROLE_TABS[role]||[];
  if(!t.includes(tab)) tab=t[0]||'none';
}
db.auth.onAuthStateChange(async(_e,s)=>{ user=s?.user||null; if(user) await loadMe(); paint(); });

  if(!user){ loginView(); applyLang(); return; }
  if(!(ROLE_TABS[ME.role]||[]).length){ noAccessView(); applyLang(); return; }
  shell(); applyLang();
}

/** كشف مبنى واحد في الفترة المختارة — أساس فصل الذمم */
function bookFor(name){
  const b=buildings.find(x=>x.name===name)||{name,ownership:'owned',management_fee_pct:0};
  const ids=units.filter(u=>u.building_name===name).map(u=>u.id);
  const p=payments.filter(x=>ids.includes(x.leases?.unit_id)&&inPeriod(x.due_date));
  const e=expenses.filter(x=>x.building_name===name&&inPeriod(x.expense_date));
  const collected=sumPaid(p.filter(x=>x.status==='paid'));
  const exp=e.reduce((s,x)=>s+Number(x.amount),0);
  const fee=b.ownership==='managed'?Math.round(collected*Number(b.management_fee_pct||0)/100):0;
  return { name, ownership:b.ownership, owner_name:b.owner_name, pct:Number(b.management_fee_pct||0),
    unitsTotal:ids.length, occupied:units.filter(u=>u.building_name===name&&u.status==='occupied').length,
    contracted:sumAmt(p), collected, overdue:sumAmt(p.filter(x=>x.status==='pending'&&x.due_date<today())),
    exp, fee, net:collected-exp, dueOwner:collected-exp-fee };
}

/** تفصيل وحدات مبنى: المسكون والشاغر وما تحت الصيانة */

  const list=units.filter(u=>u.building_name===name)
    .sort((a,b)=>String(a.unit_number).localeCompare(String(b.unit_number),undefined,{numeric:true}));
  const occ=list.filter(u=>u.status==='occupied');
  const vac=list.filter(u=>u.status==='vacant');
  const mnt=list.filter(u=>u.status==='maintenance');
  const rate=list.length?Math.round(occ.length/list.length*100):0;
  const lostRent=vac.reduce((s,u)=>s+Number(u.base_rent||0),0);

  const leaseOf=id=>leases.find(l=>l.unit_id===id&&(l.status==='active'||l.status==='renewed'));
  const row=(u,tone)=>{
    const l=leaseOf(u.id);
    const days=l&&isValidDate(l.end_date)?Math.round((new Date(l.end_date)-new Date(today()))/864e5):null;

          ${u.unit_type==='commercial'?'<span class="pill bg-amber-100 text-amber-600 mr-1">تجاري</span>':''}</p>
        <p class="text-xs text-ink-500 truncate">
          ${l?`${esc(l.tenants?.full_name||'—')}${days!==null?` · ينتهي بعد <span class="num">${days}</span> يوم`:''}`
             :`${u.area_sqm?`<span class="num">${u.area_sqm}</span> م² · `:''}<span class="num">${money(u.base_rent)}</span> ر.س سنويًا`}
        </p>
      </div>
      <span class="pill shrink-0 ${tone}"><span class="num">${money(l?l.annual_rent||u.base_rent:u.base_rent)}</span></span>
    </div>`;
  };

/* ───── تنبيهات انتهاء العقود والتجديد ───── */
function expiringLeases(days){
  const t=new Date(today());
  return leases.filter(l=>(l.status==='active'||l.status==='renewed')&&isValidDate(l.end_date))
    .map(l=>({...l,daysLeft:Math.round((new Date(l.end_date)-t)/864e5)}))
    .filter(l=>l.daysLeft<=days)
    .sort((a,b)=>a.daysLeft-b.daysLeft);
}

function expiryCard(){
  const soon=expiringLeases(90);
  if(!soon.length) return '';
  const n30=soon.filter(l=>l.daysLeft<=30).length, n60=soon.filter(l=>l.daysLeft>30&&l.daysLeft<=60).length;
  return `<div class="card p-5">
    <div class="flex flex-wrap items-baseline justify-between gap-2 mb-4">
      <h2 class="font-bold text-lg">عقود تقترب من الانتهاء</h2>
      <p class="text-xs text-ink-500">خلال ٣٠ يومًا <span class="num">${n30}</span> · ٦٠ يومًا <span class="num">${n60}</span> · ٩٠ يومًا <span class="num">${soon.length}</span></p>
    </div>
    <div class="space-y-2">
      ${soon.slice(0,12).map(l=>{
        const tone=l.daysLeft<0?'bg-rose-100 text-rose-600':l.daysLeft<=30?'bg-rose-100 text-rose-600':l.daysLeft<=60?'bg-amber-100 text-amber-600':'bg-paper-100 text-ink-500';
        return `<div class="flex items-center justify-between gap-3 border border-paper-100 rounded-lg p-3">
          <div class="min-w-0">
            <p class="font-semibold truncate">${esc(l.tenants?.full_name||'—')}</p>
            <p class="text-xs text-ink-500 truncate">${esc(l.units?.building_name||'')} · وحدة ${esc(l.units?.unit_number||'')} · ينتهي <span class="num">${l.end_date}</span></p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="pill ${tone}">${l.daysLeft<0?'منتهٍ':'<span class="num">'+l.daysLeft+'</span> يوم'}</span>
            <button onclick="openRenew('${l.id}')" class="btn-ghost text-teal-700 border-teal-100" ${canEdit()?'':'style="display:none"'}>تجديد</button>
          </div>
        </div>`;}).join('')}
    </div>
  </div>`;
}

function openRenew(id){
  const l=leases.find(x=>x.id===id);
  const ns=ymd(new Date(new Date(l.end_date).getTime()+864e5));
  const ne=(()=>{const d=new Date(ns); d.setFullYear(d.getFullYear()+1); d.setDate(d.getDate()-1); return ymd(d);})();
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4 overflow-y-auto';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>

    <div class="grid grid-cols-2 gap-3">
      <div><label class="eyebrow block mb-2">بداية الفترة الجديدة</label><input id="rn_s" type="date" class="field" value="${ns||''}"></div>
      <div><label class="eyebrow block mb-2">نهايتها</label><input id="rn_e" type="date" class="field" value="${ne||''}"></div>
      <div><label class="eyebrow block mb-2">الإيجار السنوي (ر.س)</label><input id="rn_r" type="number" class="field" value="${l.annual_rent??''}"></div>
      <div><label class="eyebrow block mb-2">عدد الدفعات</label>
        <select id="rn_c" class="field">${[1,2,3,4,6,12].map(n=>`<option value="${n}" ${Number(l.installments)===n?'selected':''}>${n===1?'دفعة واحدة':n+' دفعات'}</option>`).join('')}</select></div>
    </div>
    <p class="text-xs text-ink-500 mt-3">يُقفل العقد الحالي كـ«مجدد»، ويُنشأ عقد جديد بجدول دفعاته، وتبقى الوحدة مؤجّرة.</p>
    <p id="rn_err" class="text-rose-600 text-sm mt-3 hidden"></p>
    <div class="flex gap-2 mt-5">
      <button onclick="doRenew('${l.id}')" class="btn-primary flex-1">تنفيذ التجديد</button>
      <button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button>
    </div>
  </div>`;
  document.body.appendChild(w);
}

async function doRenew(id){
  const l=leases.find(x=>x.id===id), err=document.getElementById('rn_err');
  const start_date=rn_s.value, end_date=rn_e.value, annual=Number(rn_r.value), count=Number(rn_c.value);
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!start_date||!end_date||!annual) return fail('أكمل الحقول.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد البداية.');

  const unit=units.find(u=>u.id===l.unit_id);
  const vat_pct=unit?.unit_type==='commercial'?15:0;
  const {data,error}=await db.from('leases').insert({
    tenant_id:l.tenant_id, unit_id:l.unit_id, start_date, end_date, status:'active',
    annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12),
    ejar_number:l.ejar_number||null, deposit_amount:l.deposit_amount||0,
    late_fee_pct:l.late_fee_pct||0, vat_pct
  }).select().single();
  if(error) return fail('تعذّر التجديد: '+error.message);
  await db.from('payments').insert(buildSchedule(data.id,start_date,end_date,annual,count,vat_pct));
  await db.from('leases').update({status:'renewed'}).eq('id',id);
  await logAction('renew','lease',id,`جُدّد إلى ${end_date}`);
  closeModal(); leasesView();
}

async function savePayout(name){
  const amount=Number(document.getElementById('po_a').value), payout_date=document.getElementById('po_d').value,
        err=document.getElementById('po_err');
  err.classList.add('hidden');
  if(!amount||!payout_date){ err.textContent='أدخل المبلغ والتاريخ.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('owner_payouts').insert({building_name:name,amount,payout_date,
    period:periodKey(),reference:document.getElementById('po_r').value.trim()||null});
  if(error){ err.textContent='تعذّر الحفظ: '+error.message; err.classList.remove('hidden'); return; }
  await logAction('payout','building',name,money(amount)+' ر.س');
  closeModal(); buildingsView();

async function delPayout(id){
  if(!confirm('حذف هذا التحويل من السجل؟')) return;
  await db.from('owner_payouts').delete().eq('id',id);

/* ───── القيد السريع: اكتب الملاحظة كما تنطقها ويملأ النظام الحقول ───── */
const MK={
  heater:['سخان','سخانات','بويلر'],
  dynamo:['دينمو','دينامو','مضخة','مضخه','طرمبة','طرمبه','غطاس'],
  elevator:['مصعد','اصنصير','اسانسير','ليفت'],
  plumbing:['سباك','سباكة','سباكه','تسريب','صرف','مجاري','خزان','مواسير','ماسورة','ماسوره','حنفية','حنفيه','خلاط','سيفون'],
  electrical:['كهرب','تماس','قاطع','لمبة','لمبه','لمبات','اضاءة','مفتاح'],
  ac:['مكيف','تكييف','سبليت','فريون','كمبروسر'],
  paint:['دهان','صبغ','ترميم','بوية','بويه','جبس','سيراميك','بلاط'],
};
const ARD={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const norm = t => (t||'').replace(/[٠-٩]/g,d=>ARD[d]).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();

function parseNote(text){
  const t=norm(text);
  const out={category:'other',building:null,units:[],amount:null,unitIds:[],unknownUnits:[],description:(text||'').trim()};

  let best=null;
  buildings.map(b=>b.name).forEach(b=>{ const nb=norm(b); if(nb&&t.includes(nb)&&(!best||nb.length>norm(best).length)) best=b; });
  out.building=best;

  const m=t.match(/(?:شقه|شقق|وحده|وحدات|محل|محلات|مكتب|مكاتب|رقم)\s*((?:\d+[\s,و]*)+)/);
  const cand=m?m[1].split(/[\s,و]+/).filter(x=>/^\d+$/.test(x)):[];
  const real=units.filter(u=>!out.building||u.building_name===out.building);
  const matched=cand.filter(n=>real.some(u=>String(u.unit_number)===n));
  const leftover=cand.filter(n=>!matched.includes(n));
  out.units = matched.length?matched:cand;
  out.unitIds = real.filter(u=>out.units.includes(String(u.unit_number))).map(u=>u.id);
  out.unknownUnits = out.units.filter(n=>!real.some(u=>String(u.unit_number)===n));

  const near=t.match(/(\d+(?:[.,]\d+)?)\s*(?:ريال|ر\.?س|sar)/i)||t.match(/(?:ريال|ر\.?س)\s*(\d+(?:[.,]\d+)?)/i);
  if(near) out.amount=Number(near[1].replace(',',''));
  else{
    const used=new Set(matched);
    const pool=(t.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>Number(x.replace(',',''))).filter(n=>!used.has(String(n)));
    const pref=pool.filter(n=>leftover.includes(String(n)));
    out.amount = pref.length?Math.max(...pref) : (pool.length?Math.max(...pool):null);
  }

  for(const [c,w] of Object.entries(MK)){ if(w.some(x=>t.includes(norm(x)))){ out.category=c; break; } }
  return out;
}

      <div id="q_units" class="grid grid-cols-3 sm:grid-cols-5 gap-2"></div>

        <button onclick="clearQuick()" class="btn-ghost">إلغاء</button>

}

function quickUnits(){
  const sel=document.getElementById('q_b'), box=document.getElementById('q_units');
  if(sel.dataset.ghost||box.dataset.ghost) return;
  const b=sel.value;
  const list=units.filter(u=>u.building_name===b);
  box.innerHTML = list.length
    ? list.map(u=>`<label class="flex items-center gap-1.5 border border-paper-200 rounded-lg px-2 py-1.5 text-sm bg-white">
        <input type="checkbox" class="q_u" value="${u.id}" ${QP.unitIds.includes(u.id)?'checked':''}> ${esc(u.unit_number)}</label>`).join('')
    : `<p class="text-sm text-ink-300 col-span-5">لا وحدات مسجّلة في هذا المبنى</p>`;

function clearQuick(){ QP=null;
  const p=document.getElementById('q_preview'); if(p) p.innerHTML='';
  const t=document.getElementById('q_text');    if(t) t.value=''; }

async function saveQuick(){
  const building_name=document.getElementById('q_b').value,
        category=document.getElementById('q_c').value,
        cost=Number(document.getElementById('q_a').value),
        service_date=document.getElementById('q_d').value,
        unit_ids=[...document.querySelectorAll('.q_u:checked')].map(c=>c.value);
  if(!building_name||!cost||!service_date) return showError('أكمل المبنى والتكلفة والتاريخ قبل الحفظ.');
  const {data,error}=await db.from('maintenance').insert({
    building_name, category, description:QP.description, cost, estimated_cost:cost, adjustments:[],
    service_date, status:'done', scope: unit_ids.length?'units':'building', unit_ids
  }).select().single();
  if(error) return showError('تعذّر الحفظ: '+error.message);
  await postMaintExpense({...data, unit_ids});
  maintView();
}

function fillMaintUnits(){
  const b=document.getElementById('mt_b').value;
  const box=document.getElementById('mt_units');
  const list=units.filter(u=>u.building_name===b);
  box.innerHTML = !b ? `<p class="text-sm text-ink-300 col-span-3">اختر المبنى أولاً</p>`
    : list.length ? list.map(u=>`
      <label class="flex items-center gap-2 border border-paper-200 rounded-lg px-3 py-2 text-sm">
        <input type="checkbox" class="mt_u" value="${u.id}" onchange="splitPreview()"> وحدة ${esc(u.unit_number)}
      </label>`).join('')
    : `<p class="text-sm text-ink-300 col-span-3">لا وحدات في هذا المبنى</p>`;
  splitPreview();
}
function toggleScope(){
  const perUnit=document.querySelector('input[name=scope]:checked').value==='units';
  document.getElementById('mt_units').classList.toggle('hidden',!perUnit);
  splitPreview();
}
function splitPreview(){
  const box=document.getElementById('mt_split'); if(!box) return;
  const cost=Number(document.getElementById('mt_cost').value);
  const perUnit=document.querySelector('input[name=scope]:checked').value==='units';
  const n=document.querySelectorAll('.mt_u:checked').length;
  box.textContent = !cost ? ''
    : !perUnit ? `تُحمّل كاملة على المبنى (مصروف مشترك): ${money(cost)} ر.س`
    : n ? `تُقسّم على ${n} وحدة — ${money(Math.round(cost/n))} ر.س لكل وحدة`
    : 'اختر الوحدات المستفيدة لتوزيع التكلفة';
}

async function addMaint(){
  const building_name=document.getElementById('mt_b').value,
        category=document.getElementById('mt_c').value,
        cost=Number(document.getElementById('mt_cost').value),
        service_date=document.getElementById('mt_d').value,
        vendor=document.getElementById('mt_v').value.trim()||null,
        description=document.getElementById('mt_desc').value.trim()||null,
        perUnit=document.querySelector('input[name=scope]:checked').value==='units',
        unit_ids=[...document.querySelectorAll('.mt_u:checked')].map(c=>c.value),
        err=document.getElementById('mt_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!building_name||!cost||!service_date) return fail('المبنى والتكلفة والتاريخ مطلوبة.');
  if(perUnit && !unit_ids.length) return fail('اختر الوحدات المستفيدة، أو حمّل التكلفة على المبنى كامل.');

  const status=document.getElementById('mt_st').value;
  const {data,error}=await db.from('maintenance').insert({
    building_name,category,description,cost,estimated_cost:cost,adjustments:[],vendor,service_date,status,
    scope: perUnit?'units':'building', unit_ids: perUnit?unit_ids:[]
  }).select().single();
  if(error) return fail('تعذّر الحفظ: '+error.message);
  if(status!=='done'){ maintView(); return; }   // التكلفة تُقيَّد عند الإنجاز فقط

  // تُقيَّد التكلفة في المصروفات تلقائيًا حتى تظهر في المالية ولوحة المالك
  const rows = perUnit
    ? unit_ids.map(uid=>({ building_name, category:'maintenance', amount:Math.round(cost/unit_ids.length),
        expense_date:service_date, unit_id:uid, source:'maintenance', ref_id:data.id,
        notes:`${MAINT_CATS[category]}${description?' — '+description:''}` }))
    : [{ building_name, category:'maintenance', amount:cost, expense_date:service_date,
        source:'maintenance', ref_id:data.id, notes:`${MAINT_CATS[category]} (مشترك)${description?' — '+description:''}` }];
  await db.from('expenses').insert(rows);
  maintView();
}

  box.innerHTML=maint.map(x=>{
    const nums=(x.unit_ids||[]).map(id=>units.find(u=>u.id===id)?.unit_number).filter(Boolean);
    const share=nums.length?Math.round(x.cost/nums.length):x.cost;
    return `<div class="card p-4">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="font-semibold">${MAINT_CATS[x.category]||x.category} · ${esc(x.building_name)}
            <span class="pill mr-1 ${MAINT_ST_C[x.status||'done']}">${MAINT_ST[x.status||'done']}</span></p>
          ${x.description?`<p class="text-sm text-ink-500">${esc(x.description)}</p>`:''}
          <p class="text-xs text-ink-500 mt-1"><span class="num">${x.service_date}</span>${x.vendor?` · ${esc(x.vendor)}`:''}</p>
        </div>
        <div class="shrink-0 text-left">
          <p class="font-bold text-amber-600"><span class="num">${money(x.cost)}</span> <span class="text-xs text-ink-500">ر.س</span></p>
          ${(x.estimated_cost!=null && Number(x.estimated_cost)!==Number(x.cost))
            ? `<p class="text-xs text-ink-500 mt-0.5">تقديري <span class="num">${money(x.estimated_cost)}</span>
                 <span class="${Number(x.cost)>Number(x.estimated_cost)?'text-rose-600':'text-teal-700'}">
                   ${Number(x.cost)>Number(x.estimated_cost)?'+':'−'}<span class="num">${money(Math.abs(Number(x.cost)-Number(x.estimated_cost)))}</span></span></p>`
            : `<p class="text-xs text-ink-300 mt-0.5">${x.status==='done'?'قيد نهائي':'تقديري'}</p>`}
        </div>
      </div>
      <div class="mt-3 pt-3 border-t border-paper-100 text-sm">
        ${nums.length
          ? `<p class="text-ink-700">الوحدات المستفيدة: ${nums.map(n=>`<span class="pill bg-teal-100 text-teal-700 mx-0.5">وحدة <span class="num">${n}</span></span>`).join('')}</p>
             <p class="text-xs text-ink-500 mt-1.5">نصيب كل وحدة <span class="num">${money(share)}</span> ر.س</p>`
          : `<p class="text-ink-500">مصروف مشترك على المبنى كامل</p>`}
        ${(x.adjustments&&x.adjustments.length)?`
          <div class="mt-3 pt-3 border-t border-paper-100">
            <p class="eyebrow mb-1.5">حركات التكلفة</p>
            ${x.adjustments.map((a,i)=>`<div class="flex justify-between gap-3 text-xs py-1 border-b border-paper-100 last:border-0">
              <span class="text-ink-500">${a.note||'تعديل'} · <span class="num">${a.date||''}</span></span>
              <span class="shrink-0 ${Number(a.amount)>0?'text-rose-600':'text-teal-700'} font-semibold">
                ${Number(a.amount)>0?'+':'−'}<span class="num">${money(Math.abs(a.amount))}</span>
                <button onclick="removeAdj('${x.id}',${i})" class="text-ink-300 mr-1">✕</button></span>
            </div>`).join('')}
          </div>`:''}
        <div class="flex flex-wrap gap-1.5 mt-3">
          <button onclick="openAdj('${x.id}')" class="btn-ghost text-amber-600 border-amber-100">إضافة مبلغ</button>
          <button onclick="openMaintEdit('${x.id}')" class="btn-ghost">تعديل</button>
          ${x.status!=='done'?`<button onclick="finishMaint('${x.id}')" class="btn-ghost text-teal-700 border-teal-100">قيد نهائي</button>`
                             :`<button onclick="reopenMaint('${x.id}')" class="btn-ghost">إرجاع لقيد التنفيذ</button>`}
          <button onclick="deleteMaint('${x.id}')" class="btn-ghost text-rose-600 border-rose-100">حذف</button>
        </div>
      </div>
    </div>`;}).join('');
}


/** إجمالي التكلفة = التقديري + كل الحركات */

}

async function saveAdj(id){
  const amount=Number(document.getElementById('aj_a').value), err=document.getElementById('aj_err');
  err.classList.add('hidden');
  if(!amount){ err.textContent='أدخل مبلغًا (موجبًا للزيادة أو سالبًا للنقص).'; err.classList.remove('hidden'); return; }
  const x=maint.find(m=>m.id===id);
  const adjustments=[...(x.adjustments||[]),{amount,note:document.getElementById('aj_n').value.trim()||null,date:document.getElementById('aj_d').value}];
  const cost=Number(x.estimated_cost??x.cost??0)+adjustments.reduce((s,a)=>s+Number(a.amount||0),0);
  const {error}=await db.from('maintenance').update({adjustments,cost}).eq('id',id);
  if(error){ err.textContent='تعذّر الحفظ: '+error.message; err.classList.remove('hidden'); return; }
  await syncMaintExpense({...x,adjustments,cost});
  closeModal(); maintView();
}

async function removeAdj(id,idx){
  const x=maint.find(m=>m.id===id);
  if(!confirm('حذف هذه الحركة من تكلفة العمل؟')) return;
  const adjustments=(x.adjustments||[]).filter((_,i)=>i!==idx);
  const cost=Number(x.estimated_cost??x.cost??0)+adjustments.reduce((s,a)=>s+Number(a.amount||0),0);
  const {error}=await db.from('maintenance').update({adjustments,cost}).eq('id',id);
  if(error) return showError('تعذّر الحذف: '+error.message);
  await syncMaintExpense({...x,adjustments,cost});
  maintView();
}

async function saveMaintEdit(id){

  err.classList.add('hidden');
  if(!estimated_cost){ err.textContent='التكلفة التقديرية مطلوبة.'; err.classList.remove('hidden'); return; }
  const status=document.getElementById('me_st').value;
  const cost=estimated_cost+(x.adjustments||[]).reduce((s,a)=>s+Number(a.amount||0),0);
  const patch={ category:document.getElementById('me_c').value, status, estimated_cost, cost,
    service_date:document.getElementById('me_d').value, vendor:document.getElementById('me_v').value.trim()||null,
    description:document.getElementById('me_desc').value.trim()||null };
  const {error}=await db.from('maintenance').update(patch).eq('id',id);
  if(error){ err.textContent='تعذّر الحفظ: '+error.message; err.classList.remove('hidden'); return; }
  await syncMaintExpense({...x,...patch});
  closeModal(); maintView();
}

async function reopenMaint(id){
  const x=maint.find(m=>m.id===id);
  if(!confirm('إرجاع العمل لقيد التنفيذ؟ سيُسحب قيد التكلفة من المصروفات حتى يُقفل نهائيًا.')) return;
  await db.from('maintenance').update({status:'doing'}).eq('id',id);
  await syncMaintExpense({...x,status:'doing'});

async function finishMaint(id){

/** قيد تكلفة الصيانة في المصروفات — على الوحدات المحددة أو على المبنى */
async function postMaintExpense(x){
  const ids=x.unit_ids||[];
  const rows = ids.length
    ? ids.map(uid=>({ building_name:x.building_name, category:'maintenance', amount:Math.round(x.cost/ids.length),
        expense_date:x.service_date, unit_id:uid, source:'maintenance', ref_id:x.id,
        notes:`${MAINT_CATS[x.category]||x.category}${x.description?' — '+x.description:''}` }))
    : [{ building_name:x.building_name, category:'maintenance', amount:x.cost, expense_date:x.service_date,
        source:'maintenance', ref_id:x.id, notes:`${MAINT_CATS[x.category]||x.category} (مشترك)${x.description?' — '+x.description:''}` }];
  await db.from('expenses').insert(rows);
}

async function deleteMaint(id){
  if(!confirm('حذف عمل الصيانة وقيوده في المصروفات؟')) return;
  await db.from('expenses').delete().eq('ref_id',id).eq('source','maintenance');
  await logAction('delete','maintenance',id,'حذف عمل صيانة');
  const {error}=await db.from('maintenance').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف. حاول مرة أخرى.');
  maintView();
}

let savingLease=false;
async function addLease(){
  if(savingLease) return;
  const btn=document.activeElement;
  const tenant_id=l_tenant.value,unit_id=l_unit.value,start_date=l_start.value,end_date=l_end.value,
        annual=Number(l_rent.value),count=Number(l_count.value),err=document.getElementById('l_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!tenant_id||!unit_id||!start_date||!end_date||!annual) return fail('أكمل كل الحقول قبل الحفظ.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');

  savingLease=true;
  if(btn){ btn.disabled=true; btn.textContent='جارٍ الحفظ…'; }
  try{
    // تحقق لحظي: لا عقدين ساريين على نفس الوحدة
    const {data:clash}=await db.from('leases').select('id').eq('unit_id',unit_id).eq('status','active');
    if(clash&&clash.length){ return fail('هذه الوحدة عليها عقد ساري بالفعل. حدّث الصفحة واختر وحدة أخرى.'); }

    const unit=units.find(u=>u.id===unit_id);
    const vat_pct = unit?.unit_type==='commercial' ? 15 : 0;    // السكني معفى، التجاري خاضع
    const {data,error}=await db.from('leases').insert({
      tenant_id,unit_id,start_date,end_date,status:'active',
      annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12),
      ejar_number:document.getElementById('l_ejar').value.trim()||null,
      deposit_amount:Number(document.getElementById('l_dep').value||0),
      late_fee_pct:Number(document.getElementById('l_late').value||0),
      vat_pct
    }).select().single();
    if(error) return fail('تعذّر حفظ العقد: '+error.message);

    await db.from('units').update({status:'occupied'}).eq('id',unit_id);
    const rows=buildSchedule(data.id,start_date,end_date,annual,count,vat_pct);
    await db.from('payments').insert(rows);
    await logAction('create','lease',data.id,`${esc(unit?.building_name)} وحدة ${esc(unit?.unit_number)}`);

    // عقد بتاريخ قديم: اعرض تسوية الدفعات المستحقة قبل اليوم دفعة واحدة
    const past=rows.filter(r=>r.due_date<today()).length;
    if(past){ go('collection'); setTimeout(()=>offerBackfill(data.id,past),300); return; }
    go('collection');
  } finally {
    savingLease=false;
    if(btn&&document.contains(btn)){ btn.disabled=false; btn.textContent='حفظ العقد وتفعيله'; }
  }
}

async function runBackfill(leaseId){

  for(const p of (data||[])){

      paid_at:new Date(p.due_date+'T12:00:00').toISOString(),   // تاريخ السداد = تاريخ الاستحقاق الأصلي
      payment_method:'transfer',receipt_number:null,notes:'تسوية عقد سابق'}).eq('id',p.id);

/** دفعة لكل قسط: المبلغ = الإيجار السنوي ÷ عدد الدفعات، والفاصل = ١٢ ÷ عدد الدفعات بالأشهر */
function buildSchedule(lease_id,start,end,annual,count,vat_pct=0){
  if(!isValidDate(start)||!isValidDate(end)) return [];
  const n=Math.max(1,Math.round(Number(count)||1));
  const S=new Date(start), E=new Date(end);

  // مدة العقد بالأشهر (لا تُفترض سنة دائمًا)
  let months=(E.getFullYear()-S.getFullYear())*12 + (E.getMonth()-S.getMonth());
  if(E.getDate() >= S.getDate()-1) months+=1;
  months=Math.max(1,months);

  // الإجمالي عن كامل المدة، مقسّمًا على عدد الدفعات المطلوب
  const total=Math.round(Number(annual||0)*months/12);
  const each=Math.round(total/n);
  const stepM=months/n;                       // الفاصل الزمني بين الأقساط

  const rows=[];
  for(let i=0;i<n;i++){
    const d=new Date(S);
    d.setMonth(d.getMonth()+Math.round(stepM*i));
    const v=ymd(d); if(!v) break;
    rows.push({lease_id,due_date:v,amount:each,status:'pending',
               vat_amount:Math.round(each*Number(vat_pct||0)/100)});
  }
  // فرق التقريب يُحمَّل على آخر قسط ليطابق المجموع الإجمالي بالضبط
  if(rows.length){
    const diff=total-rows.reduce((a,r)=>a+r.amount,0);
    if(diff){ const L=rows[rows.length-1]; L.amount+=diff; L.vat_amount=Math.round(L.amount*Number(vat_pct||0)/100); }
  }
  return rows;
}

/** إعادة بناء جدول دفعات عقد من بياناته المحفوظة — أداة إصلاح مباشرة */
async function rebuildSchedule(id){
  const l=leases.find(x=>x.id===id);
  const mine=payments.filter(p=>p.lease_id===id);
  const paid=mine.filter(p=>p.status==='paid'||Number(p.paid_amount)>0);
  const rows=buildSchedule(id,l.start_date,l.end_date,Number(l.annual_rent||0),Number(l.installments||1),Number(l.vat_pct||0));
  if(!confirm(`إعادة بناء جدول الدفعات:\nمن ${mine.length} دفعة إلى ${rows.length} دفعة × ${money(rows[0]?.amount||0)} ر.س`
     + (paid.length?`\n\nتنبيه: سيُحذف سداد ${paid.length} دفعة.`:'') + `\n\nمتابعة؟`)) return;
  await db.from('payments').delete().eq('lease_id',id);
  const {error}=await db.from('payments').insert(rows);
  if(error) return showError('تعذّرت إعادة البناء: '+error.message);
  await logAction('reschedule','lease',id,`${rows.length} دفعة`);
  go('collection');
}

/** يوضّح أثر التعديل على جدول الدفعات قبل الحفظ */
function leaseImpact(id){
  const box=document.getElementById('le_impact'); if(box.dataset.ghost) return;
  const l=leases.find(x=>x.id===id);
  const start=le_s.value, end=le_e.value, annual=Number(le_r.value), count=Number(le_c.value);
  const changed = start!==l.start_date || end!==l.end_date
        || annual!==Number(l.annual_rent||0) || count!==Number(l.installments||1);
  const current = payments.filter(p=>p.lease_id===id).length;
  if(!changed){
    box.innerHTML=`<span class="text-ink-500">جدول الدفعات الحالي: <b class="num">${current}</b> دفعة — لن يتغيّر.</span>`;
    return;
  }
  const rows=(start&&end&&annual)?buildSchedule(id,start,end,annual,count||1,Number(l.vat_pct||0)):[];
  box.innerHTML = rows.length
    ? `<span class="text-teal-700 font-semibold">سيُعاد توليد الجدول:</span>
       <span class="block mt-1">من <b class="num">${current}</b> إلى <b class="num">${rows.length}</b> دفعة ×
       <b class="num">${money(rows[0].amount)}</b> ر.س — أول استحقاق <span class="num">${rows[0].due_date}</span></span>`
    : `<span class="text-rose-600">أكمل التواريخ والإيجار لعرض الجدول الجديد.</span>`;
}

async function saveLeaseEdit(id,unitId){
  const l=leases.find(x=>x.id===id);
  const start_date=le_s.value, end_date=le_e.value, annual=Number(le_r.value),
        count=Number(le_c.value), status=le_st.value, err=document.getElementById('le_err');
  err.classList.add('hidden');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden');};
  if(!start_date||!end_date||!annual) return fail('التواريخ والإيجار مطلوبة.');
  if(new Date(end_date)<=new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');

  const schedChanged = start_date!==l.start_date || end_date!==l.end_date
        || annual!==Number(l.annual_rent||0) || count!==Number(l.installments||1);
  const paid = payments.filter(p=>p.lease_id===id&&(p.status==='paid'||Number(p.paid_amount)>0));

  if(schedChanged && !confirm(paid.length
      ? `سيُعاد توليد جدول الدفعات ليطابق العقد.\n\nتنبيه: سيُحذف سداد ${paid.length} دفعة.\nمتابعة؟`
      : `سيُعاد توليد جدول الدفعات (${count===1?'دفعة واحدة':count+' دفعات'}). متابعة؟`)) return;

  const unit=units.find(u=>u.id===unitId);
  const vat_pct = unit?.unit_type==='commercial' ? 15 : 0;
  const {error}=await db.from('leases').update({ start_date, end_date, status,
    annual_rent:annual, installments:count, monthly_rent:Math.round(annual/12), vat_pct }).eq('id',id);
  if(error) return fail('تعذّر الحفظ: '+error.message);

  if(schedChanged){
    await db.from('payments').delete().eq('lease_id',id);
    const rows=buildSchedule(id,start_date,end_date,annual,count,vat_pct);
    const {error:e2}=await db.from('payments').insert(rows);
    if(e2) return fail('حُفظ العقد، لكن تعذّر توليد الدفعات: '+e2.message);
    await logAction('reschedule','lease',id,`${rows.length} دفعة`);
  }
  await db.from('units').update({ status:(status==='active'||status==='renewed')?'occupied':'vacant' }).eq('id',unitId);
  closeModal();
  schedChanged ? go('collection') : leasesView();
}

async function endLease(id,unitId){
  const future=payments.filter(p=>p.lease_id===id&&p.status==='pending'&&p.due_date>today()).length;
  if(!confirm(`إنهاء هذا العقد وإرجاع الوحدة إلى الشواغر؟${future?`\nسيتم إلغاء ${future} دفعة مستقبلية لم تُستحق بعد.`:''}`)) return;
  await db.from('leases').update({status:'terminated'}).eq('id',id);
  await db.from('units').update({status:'vacant'}).eq('id',unitId);
  // الدفعات المستقبلية غير المستحقة تُلغى حتى لا تظهر كمتأخرات وهمية
  await db.from('payments').delete().eq('lease_id',id).eq('status','pending').gt('due_date',today());
  leasesView();
}

async function deleteLease(id){
  if(!confirm('حذف هذا العقد وكل دفعاته نهائيًا من السجل؟')) return;
  await logAction('delete','lease',id,'حذف عقد');
  const {error}=await db.from('leases').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف. حاول مرة أخرى.');
  leasesView();
}

async function deleteUnit(id){
  await load.leases();                                  // بيانات محدّثة دائمًا قبل الفحص
  const mine=leases.filter(l=>l.unit_id===id);
  const active=mine.filter(l=>l.status==='active');
  if(active.length) return alert('هذه الوحدة عليها عقد ساري. أنهِ العقد من قسم العقود أولاً.');
  const msg = mine.length
    ? `هذه الوحدة لها ${mine.length} عقد منتهٍ في السجل. حذفها سيحذف تلك العقود ودفعاتها نهائيًا. متابعة؟`
    : 'حذف هذه الوحدة نهائيًا؟';
  if(!confirm(msg)) return;

  if(mine.length){
    await db.from('payments').delete().in('lease_id',mine.map(l=>l.id));
    const del=await db.from('leases').delete().in('id',mine.map(l=>l.id));
    if(del.error) return alert('تعذّر حذف عقود هذه الوحدة: '+del.error.message);
  }
  await db.from('meter_readings').delete().eq('unit_id',id);
  await db.from('expenses').delete().eq('unit_id',id);

  await logAction('delete','unit',id,'حذف وحدة');
  const {error}=await db.from('units').delete().eq('id',id);
  if(error) return alert('تعذّر حذف الوحدة.\nالسبب: '+error.message);
  closeModal(); unitsView();
}

function importHint(){
  const sel=document.getElementById('im_t'), hint=document.getElementById('im_hint');

  hint.textContent = t==='units'
    ? 'الترتيب: المبنى | رقم الوحدة | المساحة | الإيجار السنوي | سكني أو تجاري'
    : 'الترتيب: الاسم | الجوال | رقم الهوية';
}

async function runImport(){
  const t=document.getElementById('im_t').value, raw=document.getElementById('im_data').value.trim(),
        out=document.getElementById('im_out');
  if(!raw) return;
  const lines=raw.split(/\r?\n/).filter(x=>x.trim());
  const split=l=>l.split(/\t|,|؛|;/).map(x=>x.trim());
  let ok=0, bad=[];
  for(const [i,line] of lines.entries()){
    const c=split(line);
    try{
      if(t==='units'){
        if(!c[0]||!c[1]) { bad.push(i+1); continue; }
        const {error}=await db.from('units').insert({building_name:c[0],unit_number:c[1],
          area_sqm:c[2]?Number(c[2]):null, base_rent:Number(c[3]||0),
          unit_type:(c[4]||'').includes('تجار')?'commercial':'residential'});
        if(error){ bad.push(i+1); continue; }
      } else {
        if(!c[0]||!c[1]) { bad.push(i+1); continue; }
        const {error}=await db.from('tenants').insert({full_name:c[0],phone:c[1],national_id:c[2]||null});
        if(error){ bad.push(i+1); continue; }
      }
      ok++;
    }catch(e){ bad.push(i+1); }
  }
  out.innerHTML = `<span class="text-teal-700 font-semibold">نجح <span class="num">${ok}</span> سجل.</span>`
    + (bad.length?` <span class="text-rose-600">تعذّرت الصفوف: ${bad.join('، ')} — تحقق من التكرار أو نقص البيانات.</span>`:'');
  if(ok) await logAction('import',t,'',ok+' سجل');
  document.getElementById('im_data').value='';
}

async function exportTable(name){
  const {data,error}=await db.from(name).select('*');
  if(error||!data?.length) return showError('لا بيانات للتصدير في هذا الجدول.');
  const cols=[...new Set(data.flatMap(r=>Object.keys(r)))];
  const cell=v=>{ const x=v==null?'':(typeof v==='object'?JSON.stringify(v):String(v)); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; };
  const csv='\uFEFF'+[cols.join(','),...data.map(r=>cols.map(c=>cell(r[c])).join(','))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`${name}-${today()}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

function openTenantEdit(id){
  const t=tenants.find(x=>x.id===id);
  const w=document.createElement('div'); w.id='modal'; w.className='fixed inset-0 z-40 grid place-items-center p-4 overflow-y-auto';
  w.innerHTML=`<div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
  <div class="card relative w-full max-w-md p-6 fade my-8">
    <h3 class="font-bold text-xl mb-5">تعديل بيانات المستأجر</h3>
    <label class="eyebrow block mb-2">الاسم الكامل</label><input id="te_name" class="field mb-4" value="${esc(t.full_name||'')}">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="eyebrow block mb-2">رقم الجوال</label><input id="te_phone" class="field" dir="ltr" value="${esc(t.phone||'')}"></div>
      <div><label class="eyebrow block mb-2">رقم الهوية</label><input id="te_id" class="field" dir="ltr" value="${esc(t.national_id||'')}"></div>
      <div class="col-span-2"><label class="eyebrow block mb-2">انتهاء الهوية / الإقامة</label><input id="te_x" type="date" class="field" value="${t.id_expiry||''}"></div>
    </div>
    <p id="te_err" class="text-rose-600 text-sm mt-3 hidden"></p>
    <div class="flex gap-2 mt-5">
      <button onclick="saveTenantEdit('${t.id}')" class="btn-primary flex-1">حفظ التعديلات</button>
      <button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button>
    </div>
    <button onclick="deleteTenant('${t.id}')" class="text-sm text-rose-600 mt-4 w-full">حذف المستأجر</button>
  </div>`;
  document.body.appendChild(w);
}
async function saveTenantEdit(id){
  const full_name=document.getElementById('te_name').value.trim(),
        phone=document.getElementById('te_phone').value.trim(),
        national_id=document.getElementById('te_id').value.trim(),
        err=document.getElementById('te_err');
  err.classList.add('hidden');
  if(!full_name||!phone){ err.textContent='الاسم ورقم الجوال مطلوبان.'; err.classList.remove('hidden'); return; }
  const {error}=await db.from('tenants').update({full_name,phone,national_id:national_id||null,id_expiry:document.getElementById('te_x').value||null}).eq('id',id);
  if(error){ err.textContent=error.code==='23505'?'رقم الجوال أو الهوية مسجّل لمستأجر آخر.':'تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  closeModal(); await load.tenants(tq); renderTenants();
}
async function deleteTenant(id){
  await load.leases();
  const own=leases.filter(l=>l.tenant_id===id);
  const act=own.filter(l=>l.status==='active');
  if(act.length) return alert('هذا المستأجر عليه عقد ساري. أنهِ العقد أولاً.');
  if(!confirm(own.length?`سيُحذف المستأجر و${own.length} عقد منتهٍ ودفعاتها. متابعة؟`:'حذف هذا المستأجر نهائيًا؟')) return;
  if(own.length) await db.from('leases').delete().in('id',own.map(l=>l.id));
  await logAction('delete','tenant',id,'حذف مستأجر');
  const {error}=await db.from('tenants').delete().eq('id',id);
  if(error) return alert('تعذّر الحذف — المستأجر مرتبط بسجلات أخرى.');
  closeModal(); await load.tenants(tq); renderTenants();
}
async function blockTenant(id){
  await load.leases();
  if(leases.some(l=>l.tenant_id===id&&l.status==='active'))
    if(!confirm('هذا المستأجر عليه عقد ساري. إدراجه في القائمة السوداء لن يُنهي العقد. متابعة؟')) return;
  const reason=prompt('سبب الإدراج في القائمة السوداء:');
  if(!reason||reason.trim().length<3) return;
  await db.from('tenants').update({status:'blacklisted',blacklist_reason:reason,blacklisted_at:new Date().toISOString()}).eq('id',id);
  await load.tenants(tq); renderTenants();
}
async function unblockTenant(id){
  await db.from('tenants').update({status:'active',blacklist_reason:null,blacklisted_at:null}).eq('id',id);
  await load.tenants(tq); renderTenants();
}

init();
</script>
</body>
</html>
