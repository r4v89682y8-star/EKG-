<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الديار — إدارة الأملاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink:    { 900:'#101820', 700:'#38424E', 500:'#6B7684', 300:'#AEB6C0' },
        paper:  { 0:'#FFFFFF', 50:'#F7F8FA', 100:'#EFF1F4', 200:'#E2E6EB' },
        teal:   { 900:'#0A3D33', 700:'#0F5C4E', 600:'#147A66', 100:'#DFF0EB' },
        amber:  { 600:'#B5761B', 100:'#FBEFD9' },
        rose:   { 600:'#B03A3A', 100:'#FBE3E3' },
      },
      fontFamily: {
        sans: ['"IBM Plex Sans Arabic"','system-ui','sans-serif'],
        num:  ['Rubik','system-ui','sans-serif'],
      },
      boxShadow: {
        card: '0 1px 2px rgba(16,24,32,.04), 0 4px 16px rgba(16,24,32,.05)',
      }
    }
  }
}
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  body { font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; background:#F7F8FA; color:#101820; }
  .num { font-family:Rubik,system-ui,sans-serif; font-feature-settings:'tnum'; direction:ltr; display:inline-block; }
  .field { width:100%; border:1px solid #E2E6EB; background:#fff; border-radius:.625rem; padding:.6rem .75rem; font-size:.9rem; }
  .field:focus { outline:2px solid #147A66; outline-offset:1px; border-color:#147A66; }
  .btn-primary { background:#0F5C4E; color:#fff; border-radius:.625rem; padding:.6rem 1.1rem; font-weight:600; font-size:.9rem; }
  .btn-primary:hover { background:#147A66; }
  .btn-ghost { border:1px solid #E2E6EB; background:#fff; border-radius:.625rem; padding:.45rem .8rem; font-size:.8rem; }
  .btn-ghost:hover { background:#F7F8FA; }
  .card { background:#fff; border:1px solid #EFF1F4; border-radius:.875rem; box-shadow:0 1px 2px rgba(16,24,32,.04), 0 4px 16px rgba(16,24,32,.05); }
  .eyebrow { font-size:.68rem; letter-spacing:.08em; color:#6B7684; font-weight:600; }
  .navlink { display:flex; align-items:center; gap:.6rem; padding:.6rem .8rem; border-radius:.625rem; font-size:.92rem; color:#38424E; width:100%; text-align:right; }
  .navlink:hover { background:#EFF1F4; }
  .navlink.on { background:#0A3D33; color:#fff; font-weight:600; }
  *:focus-visible { outline:2px solid #147A66; outline-offset:2px; }
  @media (prefers-reduced-motion:no-preference){ .fade{ animation:f .25s ease both } @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}} }
</style>
</head>
<body class="min-h-screen">

<script>
  const SUPABASE_URL = "https://hyyvqcppamlmlhcmnsut.supabase.co";
  const SUPABASE_KEY = "sb_publishable_26WQJ1wSFyt3eNDdkj2yyw_RwYDK6yf";
  const BRAND = "الديار";           // ← غيّر اسم النظام من هنا
  const BRAND_SUB = "إدارة الأملاك";
</script>

<div id="app"></div>

<script>
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
let user = null, tab = 'collection', navOpen = false;

const TABS = [
  { id:'collection', label:'التحصيل',    icon:'M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6' },
  { id:'leases',     label:'العقود',      icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z' },
  { id:'units',      label:'الوحدات',     icon:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z' },
  { id:'tenants',    label:'المستأجرون',  icon:'M17 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M13 7a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0M22 20v-2a4 4 0 00-3-3.87M16 3.13A4 4 0 0119 7' },
];

const money = n => Number(n||0).toLocaleString('en-US',{maximumFractionDigits:0});
const today = () => new Date().toISOString().slice(0,10);

/* ───────────── auth ───────────── */
async function init(){
  const { data:{ session } } = await db.auth.getSession();
  user = session?.user || null;
  paint();
}
db.auth.onAuthStateChange((_e,s)=>{ user = s?.user || null; paint(); });

function paint(){ user ? shell() : loginView(); }

function loginView(){
  app.innerHTML = `
  <div class="min-h-screen grid place-items-center px-5">
    <div class="w-full max-w-sm fade">
      <div class="text-center mb-7">
        <div class="w-12 h-12 rounded-xl bg-teal-900 mx-auto grid place-items-center mb-4">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>
        </div>
        <h1 class="text-2xl font-bold">${BRAND}</h1>
        <p class="text-ink-500 text-sm mt-1">${BRAND_SUB}</p>
      </div>
      <div class="card p-6">
        <label class="eyebrow block mb-1.5">البريد الإلكتروني</label>
        <input id="em" type="email" class="field mb-3.5" dir="ltr">
        <label class="eyebrow block mb-1.5">كلمة السر</label>
        <input id="pw" type="password" class="field mb-1" dir="ltr">
        <p id="er" class="text-rose-600 text-xs mt-2.5 hidden"></p>
        <button onclick="login()" class="btn-primary w-full mt-5">دخول</button>
      </div>
    </div>
  </div>`;
  document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
}

async function login(){
  const email = em.value.trim(), password = pw.value, box = document.getElementById('er');
  const { error } = await db.auth.signInWithPassword({ email, password });
  if(error){ box.textContent = 'البريد أو كلمة السر غير صحيحة. تأكد من بياناتك وحاول مرة أخرى.'; box.classList.remove('hidden'); }
}
const logout = () => db.auth.signOut();

/* ───────────── shell ───────────── */
function shell(){
  app.innerHTML = `
  <div class="flex min-h-screen">
    <aside class="hidden lg:flex flex-col w-64 shrink-0 bg-white border-l border-paper-100 p-4">
      ${brandBlock()}
      <nav class="space-y-1 mt-6">${TABS.map(navBtn).join('')}</nav>
      <button onclick="logout()" class="navlink mt-auto text-ink-500">تسجيل الخروج</button>
    </aside>

    <div class="flex-1 min-w-0">
      <header class="lg:hidden sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-paper-100 px-4 h-14 flex items-center justify-between">
        <button onclick="toggleNav()" aria-label="القائمة">
          <svg width="22" height="22" viewBox="0 0 24 24" stroke="#38424E" stroke-width="1.8" fill="none"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="font-bold">${BRAND}</span>
        <button onclick="logout()" class="text-xs text-ink-500">خروج</button>
      </header>

      <div id="drawer" class="hidden lg:hidden fixed inset-0 z-30">
        <div class="absolute inset-0 bg-ink-900/40" onclick="toggleNav()"></div>
        <div class="absolute top-0 right-0 h-full w-64 bg-white p-4 flex flex-col">
          ${brandBlock()}
          <nav class="space-y-1 mt-6">${TABS.map(navBtn).join('')}</nav>
        </div>
      </div>

      <main id="main" class="p-4 sm:p-6 lg:p-8 max-w-5xl"></main>
    </div>
  </div>`;
  route();
}

const brandBlock = () => `
  <div class="flex items-center gap-2.5">
    <div class="w-9 h-9 rounded-lg bg-teal-900 grid place-items-center shrink-0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>
    </div>
    <div class="leading-tight">
      <p class="font-bold text-[.95rem]">${BRAND}</p>
      <p class="text-[.7rem] text-ink-500">${BRAND_SUB}</p>
    </div>
  </div>`;

const navBtn = t => `
  <button onclick="go('${t.id}')" class="navlink ${tab===t.id?'on':''}">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="${t.icon}"/></svg>
    ${t.label}
  </button>`;

function toggleNav(){ navOpen=!navOpen; document.getElementById('drawer').classList.toggle('hidden',!navOpen); }
function go(t){ tab=t; navOpen=false; shell(); }
function route(){
  if(tab==='tenants')    tenantsView();
  if(tab==='units')      unitsView();
  if(tab==='leases')     leasesView();
  if(tab==='collection') collectionView();
}
const head = (title,sub) => `<div class="mb-6"><h1 class="text-[1.35rem] font-bold">${title}</h1><p class="text-ink-500 text-sm mt-0.5">${sub}</p></div>`;
const empty = m => `<div class="card p-10 text-center text-ink-500 text-sm">${m}</div>`;

/* ───────────── data ───────────── */
let tenants=[], units=[], leases=[], payments=[];
const load = {
  tenants: async q => { let r=db.from('tenants').select('*').order('created_at',{ascending:false}); if(q) r=r.or(`full_name.ilike.%${q}%,phone.ilike.%${q}%`); tenants=(await r).data||[]; },
  units:   async () => { units=(await db.from('units').select('*').order('building_name')).data||[]; },
  leases:  async () => { leases=(await db.from('leases').select('*, tenants(full_name,phone), units(building_name,unit_number)').order('created_at',{ascending:false})).data||[]; },
  payments:async () => { payments=(await db.from('payments').select('*, leases(monthly_rent, tenants(full_name), units(building_name,unit_number))').order('due_date')).data||[]; },
};

/* ───────────── التحصيل ───────────── */
let payFilter='due';

async function collectionView(){
  const m = document.getElementById('main');
  m.innerHTML = head('التحصيل','دفعات الإيجار المستحقة والمسددة عبر كل العقود') + `<div id="cw" class="text-ink-500 text-sm">جارٍ التحميل…</div>`;
  await load.payments();
  const t = today();
  const overdue = payments.filter(p=>p.status==='pending' && p.due_date < t);
  const upcoming= payments.filter(p=>p.status==='pending' && p.due_date >= t);
  const paid    = payments.filter(p=>p.status==='paid');
  const sum = a => a.reduce((s,p)=>s+Number(p.status==='paid'?(p.paid_amount||p.amount):p.amount),0);

  document.getElementById('cw').outerHTML = `
  <div id="cw" class="fade">
    <div class="grid grid-cols-2 lg:grid-cols-3 gap-3 mb-6">
      ${kpi('المتأخرات', sum(overdue), overdue.length+' دفعة', 'rose')}
      ${kpi('مستحق قادم', sum(upcoming), upcoming.length+' دفعة', 'amber')}
      ${kpi('إجمالي التحصيل', sum(paid), paid.length+' سند قبض', 'teal')}
    </div>

    <div class="flex gap-2 mb-4 overflow-x-auto pb-1">
      ${chip('due','المستحقة',overdue.length+upcoming.length)}
      ${chip('overdue','المتأخرة',overdue.length)}
      ${chip('paid','المسددة',paid.length)}
      ${chip('all','الكل',payments.length)}
    </div>

    <div id="plist" class="space-y-2.5"></div>
  </div>`;
  renderPayments();
}

const kpi = (label,val,meta,tone) => {
  const c = { rose:'text-rose-600', amber:'text-amber-600', teal:'text-teal-700' }[tone];
  return `<div class="card p-4">
    <p class="eyebrow">${label}</p>
    <p class="mt-2 text-xl font-bold ${c}"><span class="num">${money(val)}</span> <span class="text-xs font-medium text-ink-500">ر.س</span></p>
    <p class="text-[.72rem] text-ink-500 mt-1">${meta}</p>
  </div>`;
};

const chip = (id,label,n) => `
  <button onclick="setPayFilter('${id}')" class="shrink-0 px-3.5 py-2 rounded-lg text-[.83rem] border ${payFilter===id?'bg-teal-900 text-white border-teal-900 font-semibold':'bg-white border-paper-200 text-ink-700'}">
    ${label} <span class="num opacity-70">${n}</span>
  </button>`;

function setPayFilter(f){ payFilter=f; collectionView(); }

function renderPayments(){
  const t = today();
  let rows = payments;
  if(payFilter==='due')     rows = payments.filter(p=>p.status==='pending');
  if(payFilter==='overdue') rows = payments.filter(p=>p.status==='pending' && p.due_date < t);
  if(payFilter==='paid')    rows = payments.filter(p=>p.status==='paid');

  const box = document.getElementById('plist');
  if(!rows.length){ box.innerHTML = empty('لا توجد دفعات في هذا التصنيف. أنشئ عقدًا من قسم العقود ليُولَّد جدول دفعاته تلقائيًا.'); return; }

  box.innerHTML = rows.map(p=>{
    const late = p.status==='pending' && p.due_date < t;
    const days = Math.round((new Date(t)-new Date(p.due_date))/864e5);
    const l = p.leases||{};
    return `<div class="card p-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold text-[.95rem] truncate">${l.tenants?.full_name||'—'}</p>
        <p class="text-[.8rem] text-ink-500 truncate">${l.units?.building_name||''} · وحدة ${l.units?.unit_number||''}</p>
        <p class="text-[.75rem] mt-1 ${late?'text-rose-600 font-medium':'text-ink-500'}">
          الاستحقاق <span class="num">${p.due_date}</span>${late?` · متأخرة <span class="num">${days}</span> يوم`:''}
        </p>
      </div>
      <div class="text-left shrink-0">
        <p class="font-bold"><span class="num">${money(p.amount)}</span> <span class="text-[.7rem] text-ink-500">ر.س</span></p>
        ${p.status==='paid'
          ? `<p class="text-[.72rem] text-teal-700 mt-1">سُددت <span class="num">${(p.paid_at||'').slice(0,10)}</span></p>`
          : `<button onclick="openReceipt('${p.id}')" class="btn-ghost mt-1.5 text-teal-700 border-teal-100">تسجيل دفعة</button>`}
      </div>
    </div>`;
  }).join('');
}

function openReceipt(id){
  const p = payments.find(x=>x.id===id);
  const wrap = document.createElement('div');
  wrap.id='modal';
  wrap.className='fixed inset-0 z-40 grid place-items-center p-4';
  wrap.innerHTML = `
    <div class="absolute inset-0 bg-ink-900/45" onclick="closeModal()"></div>
    <div class="card relative w-full max-w-sm p-6 fade">
      <h3 class="font-bold text-lg">تسجيل دفعة</h3>
      <p class="text-ink-500 text-sm mt-1 mb-5">${p.leases?.tenants?.full_name||''} · استحقاق <span class="num">${p.due_date}</span></p>
      <label class="eyebrow block mb-1.5">المبلغ المستلم (ر.س)</label>
      <input id="r_amt" type="number" class="field mb-3.5" value="${p.amount}">
      <label class="eyebrow block mb-1.5">تاريخ الاستلام</label>
      <input id="r_date" type="date" class="field mb-3.5" value="${today()}">
      <label class="eyebrow block mb-1.5">طريقة الدفع</label>
      <select id="r_method" class="field mb-3.5">
        <option value="transfer">تحويل بنكي</option>
        <option value="cash">نقدًا</option>
        <option value="cheque">شيك</option>
        <option value="pos">شبكة</option>
      </select>
      <label class="eyebrow block mb-1.5">رقم السند / المرجع</label>
      <input id="r_ref" class="field" placeholder="اختياري">
      <p id="r_err" class="text-rose-600 text-xs mt-2.5 hidden"></p>
      <div class="flex gap-2 mt-5">
        <button onclick="saveReceipt('${p.id}')" class="btn-primary flex-1">حفظ السند</button>
        <button onclick="closeModal()" class="btn-ghost px-4">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
}
const closeModal = () => document.getElementById('modal')?.remove();

async function saveReceipt(id){
  const amt = Number(r_amt.value), date = r_date.value, err = document.getElementById('r_err');
  if(!amt || amt<=0 || !date){ err.textContent='أدخل مبلغًا صحيحًا وتاريخ الاستلام.'; err.classList.remove('hidden'); return; }
  const { error } = await db.from('payments').update({
    status:'paid', paid_amount:amt, paid_at:new Date(date).toISOString(),
    payment_method:r_method.value, receipt_number:r_ref.value.trim()||null,
  }).eq('id',id);
  if(error){ err.textContent='تعذّر الحفظ. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  closeModal(); collectionView();
}

/* ───────────── العقود ───────────── */
async function leasesView(){
  const m = document.getElementById('main');
  m.innerHTML = head('العقود','عقود الإيجار السارية وسجل العقود المنتهية');
  await Promise.all([load.tenants(), load.units(), load.leases()]);
  const vac = units.filter(u=>u.status==='vacant');

  m.innerHTML += `
  <div class="fade">
    <details class="card p-5 mb-6" open>
      <summary class="font-semibold cursor-pointer">عقد جديد</summary>
      <div class="grid sm:grid-cols-2 gap-3 mt-4">
        <div class="sm:col-span-2">
          <label class="eyebrow block mb-1.5">المستأجر</label>
          <select id="l_tenant" class="field">
            <option value="">اختر المستأجر</option>
            ${tenants.filter(t=>t.status==='active').map(t=>`<option value="${t.id}">${t.full_name} — ${t.phone}</option>`).join('')}
          </select>
        </div>
        <div class="sm:col-span-2">
          <label class="eyebrow block mb-1.5">الوحدة الشاغرة</label>
          <select id="l_unit" class="field">
            <option value="">اختر الوحدة</option>
            ${vac.map(u=>`<option value="${u.id}" data-rent="${u.base_rent}">${u.building_name} — وحدة ${u.unit_number} (${money(u.base_rent)} ر.س)</option>`).join('')}
          </select>
          ${vac.length?'':'<p class="text-[.75rem] text-amber-600 mt-1.5">لا توجد وحدات شاغرة حاليًا.</p>'}
        </div>
        <div><label class="eyebrow block mb-1.5">بداية العقد</label><input id="l_start" type="date" class="field" value="${today()}"></div>
        <div><label class="eyebrow block mb-1.5">نهاية العقد</label><input id="l_end" type="date" class="field"></div>
        <div><label class="eyebrow block mb-1.5">الإيجار الشهري (ر.س)</label><input id="l_rent" type="number" class="field"></div>
        <div>
          <label class="eyebrow block mb-1.5">دورية الدفع</label>
          <select id="l_freq" class="field">
            <option value="1">شهري</option><option value="3">كل ٣ أشهر</option>
            <option value="6">نصف سنوي</option><option value="12">سنوي</option>
          </select>
        </div>
      </div>
      <p id="l_err" class="text-rose-600 text-xs mt-3 hidden"></p>
      <p class="text-[.75rem] text-ink-500 mt-3">عند الحفظ يُولَّد جدول الدفعات تلقائيًا حسب الدورية المختارة.</p>
      <button onclick="addLease()" class="btn-primary mt-4">حفظ العقد وتفعيله</button>
    </details>
    <div id="llist" class="space-y-2.5"></div>
  </div>`;
  renderLeases();
  document.getElementById('l_unit').addEventListener('change', e=>{
    const r = e.target.selectedOptions[0]?.dataset.rent; if(r) l_rent.value = r;
  });
  document.getElementById('l_start').addEventListener('change', e=>{
    if(!l_end.value){ const d=new Date(e.target.value); d.setFullYear(d.getFullYear()+1); d.setDate(d.getDate()-1); l_end.value=d.toISOString().slice(0,10); }
  });
}

function renderLeases(){
  const box = document.getElementById('llist');
  if(!leases.length){ box.innerHTML = empty('لا توجد عقود بعد.'); return; }
  const label = {draft:'مسودة',active:'ساري',renewed:'مجدد',terminated:'منتهي',expired:'منتهي الصلاحية'};
  const tone  = {active:'bg-teal-100 text-teal-700',draft:'bg-paper-100 text-ink-500',terminated:'bg-rose-100 text-rose-600',expired:'bg-amber-100 text-amber-600',renewed:'bg-teal-100 text-teal-700'};
  box.innerHTML = leases.map(l=>`
    <div class="card p-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold text-[.95rem] truncate">${l.tenants?.full_name||'—'}</p>
        <p class="text-[.8rem] text-ink-500 truncate">${l.units?.building_name||''} · وحدة ${l.units?.unit_number||''} · <span class="num">${money(l.monthly_rent)}</span> ر.س/شهر</p>
        <p class="text-[.75rem] text-ink-300 mt-1"><span class="num">${l.start_date}</span> ← <span class="num">${l.end_date}</span></p>
      </div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <span class="px-2 py-0.5 rounded-md text-[.7rem] font-medium ${tone[l.status]||''}">${label[l.status]||l.status}</span>
        ${l.status==='active'?`<button onclick="endLease('${l.id}','${l.unit_id}')" class="btn-ghost text-rose-600 border-rose-100">إنهاء</button>`:''}
      </div>
    </div>`).join('');
}

async function addLease(){
  const tenant_id=l_tenant.value, unit_id=l_unit.value, start_date=l_start.value,
        end_date=l_end.value, rent=Number(l_rent.value), step=Number(l_freq.value),
        err=document.getElementById('l_err');
  err.classList.add('hidden');
  const fail = m => { err.textContent=m; err.classList.remove('hidden'); };
  if(!tenant_id||!unit_id||!start_date||!end_date||!rent) return fail('أكمل كل الحقول قبل الحفظ.');
  if(new Date(end_date) <= new Date(start_date)) return fail('تاريخ النهاية يجب أن يكون بعد تاريخ البداية.');

  const { data, error } = await db.from('leases')
    .insert({ tenant_id, unit_id, start_date, end_date, monthly_rent:rent, status:'active' })
    .select().single();
  if(error) return fail('تعذّر حفظ العقد. حاول مرة أخرى.');

  await db.from('units').update({ status:'occupied' }).eq('id', unit_id);
  await db.from('payments').insert(buildSchedule(data.id, start_date, end_date, rent, step));
  go('collection');
}

/** جدول دفعات: قسط لكل دورية من البداية حتى النهاية */
function buildSchedule(lease_id, start, end, rent, step){
  const rows=[], last=new Date(end), d=new Date(start);
  while(d <= last){
    rows.push({ lease_id, due_date:d.toISOString().slice(0,10), amount:rent*step, status:'pending' });
    d.setMonth(d.getMonth()+step);
  }
  return rows;
}

async function endLease(id, unitId){
  if(!confirm('إنهاء هذا العقد وإرجاع الوحدة إلى الشواغر؟')) return;
  await db.from('leases').update({ status:'terminated' }).eq('id',id);
  await db.from('units').update({ status:'vacant' }).eq('id',unitId);
  leasesView();
}

/* ───────────── الوحدات ───────────── */
async function unitsView(){
  const m = document.getElementById('main');
  m.innerHTML = head('الوحدات','الوحدات المؤجرة والشاغرة في كل مبنى');
  await load.units();
  const occ = units.filter(u=>u.status==='occupied').length;
  const rate = units.length ? Math.round(occ/units.length*100) : 0;

  m.innerHTML += `
  <div class="fade">
    ${units.length?`
    <div class="card p-5 mb-6">
      <div class="flex items-end justify-between mb-3">
        <div><p class="eyebrow">نسبة الإشغال</p><p class="text-2xl font-bold mt-1"><span class="num">${rate}</span>%</p></div>
        <p class="text-[.78rem] text-ink-500"><span class="num">${occ}</span> مؤجرة من <span class="num">${units.length}</span></p>
      </div>
      <div class="flex gap-1 flex-wrap">
        ${units.map(u=>`<span title="${u.building_name} ${u.unit_number}" class="h-6 flex-1 min-w-[14px] rounded ${u.status==='occupied'?'bg-teal-700':'bg-paper-200'}"></span>`).join('')}
      </div>
    </div>`:''}

    <details class="card p-5 mb-6">
      <summary class="font-semibold cursor-pointer">وحدة جديدة</summary>
      <div class="grid sm:grid-cols-2 gap-3 mt-4">
        <div><label class="eyebrow block mb-1.5">المبنى</label><input id="u_b" class="field"></div>
        <div><label class="eyebrow block mb-1.5">رقم الوحدة</label><input id="u_n" class="field"></div>
        <div><label class="eyebrow block mb-1.5">المساحة (م²)</label><input id="u_a" type="number" class="field"></div>
        <div><label class="eyebrow block mb-1.5">الإيجار الشهري (ر.س)</label><input id="u_r" type="number" class="field"></div>
      </div>
      <p id="u_err" class="text-rose-600 text-xs mt-3 hidden"></p>
      <button onclick="addUnit()" class="btn-primary mt-4">إضافة الوحدة</button>
    </details>
    <div id="ulist" class="space-y-2.5"></div>
  </div>`;
  renderUnits();
}

function renderUnits(){
  const box=document.getElementById('ulist');
  if(!units.length){ box.innerHTML=empty('لا توجد وحدات بعد. أضف أول وحدة لتبدأ.'); return; }
  const label={vacant:'شاغرة',occupied:'مؤجرة',maintenance:'صيانة'};
  const tone={vacant:'bg-paper-100 text-ink-500',occupied:'bg-teal-100 text-teal-700',maintenance:'bg-amber-100 text-amber-600'};
  box.innerHTML = units.map(u=>`
    <div class="card p-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold text-[.95rem] truncate">${u.building_name} — وحدة ${u.unit_number}</p>
        <p class="text-[.8rem] text-ink-500">${u.area_sqm?`<span class="num">${u.area_sqm}</span> م² · `:''}<span class="num">${money(u.base_rent)}</span> ر.س/شهر</p>
      </div>
      <span class="px-2 py-0.5 rounded-md text-[.7rem] font-medium shrink-0 ${tone[u.status]||''}">${label[u.status]||u.status}</span>
    </div>`).join('');
}

async function addUnit(){
  const building_name=u_b.value.trim(), unit_number=u_n.value.trim(),
        area_sqm=u_a.value||null, base_rent=u_r.value, err=document.getElementById('u_err');
  err.classList.add('hidden');
  if(!building_name||!unit_number||!base_rent){ err.textContent='المبنى ورقم الوحدة والإيجار مطلوبة.'; err.classList.remove('hidden'); return; }
  const { error } = await db.from('units').insert({ building_name, unit_number, area_sqm, base_rent });
  if(error){ err.textContent='تعذّرت الإضافة. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  unitsView();
}

/* ───────────── المستأجرون ───────────── */
let tq='';
async function tenantsView(){
  const m=document.getElementById('main');
  m.innerHTML = head('المستأجرون','سجل المستأجرين وحالاتهم') + `
  <div class="fade">
    <details class="card p-5 mb-6">
      <summary class="font-semibold cursor-pointer">مستأجر جديد</summary>
      <div class="grid sm:grid-cols-2 gap-3 mt-4">
        <div class="sm:col-span-2"><label class="eyebrow block mb-1.5">الاسم الكامل</label><input id="t_n" class="field"></div>
        <div><label class="eyebrow block mb-1.5">رقم الجوال</label><input id="t_p" class="field" dir="ltr" placeholder="05xxxxxxxx"></div>
        <div><label class="eyebrow block mb-1.5">رقم الهوية</label><input id="t_i" class="field" dir="ltr"></div>
      </div>
      <p id="t_err" class="text-rose-600 text-xs mt-3 hidden"></p>
      <button onclick="addTenant()" class="btn-primary mt-4">إضافة المستأجر</button>
    </details>
    <input class="field mb-4" placeholder="ابحث بالاسم أو الجوال" oninput="searchTenants(this.value)">
    <div id="tlist" class="space-y-2.5"></div>
  </div>`;
  await load.tenants(tq); renderTenants();
}

let tTimer;
function searchTenants(v){ tq=v; clearTimeout(tTimer); tTimer=setTimeout(async()=>{ await load.tenants(tq); renderTenants(); },350); }

function renderTenants(){
  const box=document.getElementById('tlist');
  if(!tenants.length){ box.innerHTML=empty(tq?'لا نتائج مطابقة للبحث.':'لا يوجد مستأجرون بعد.'); return; }
  const label={active:'نشط',inactive:'غير نشط',blacklisted:'قائمة سوداء'};
  const tone={active:'bg-teal-100 text-teal-700',inactive:'bg-paper-100 text-ink-500',blacklisted:'bg-rose-100 text-rose-600'};
  box.innerHTML = tenants.map(t=>`
    <div class="card p-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="font-semibold text-[.95rem] truncate">${t.full_name}</p>
        <p class="text-[.8rem] text-ink-500"><span class="num">${t.phone}</span>${t.national_id?` · <span class="num">${t.national_id}</span>`:''}</p>
      </div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <span class="px-2 py-0.5 rounded-md text-[.7rem] font-medium ${tone[t.status]||''}">${label[t.status]||t.status}</span>
        ${t.status!=='blacklisted'
          ? `<button onclick="blockTenant('${t.id}')" class="btn-ghost text-rose-600 border-rose-100">قائمة سوداء</button>`
          : `<button onclick="unblockTenant('${t.id}')" class="btn-ghost text-teal-700 border-teal-100">إعادة تفعيل</button>`}
      </div>
    </div>`).join('');
}

async function addTenant(){
  const full_name=t_n.value.trim(), phone=t_p.value.trim(), national_id=t_i.value.trim(), err=document.getElementById('t_err');
  err.classList.add('hidden');
  if(!full_name||!phone){ err.textContent='الاسم ورقم الجوال مطلوبان.'; err.classList.remove('hidden'); return; }
  const { error } = await db.from('tenants').insert({ full_name, phone, national_id:national_id||null });
  if(error){ err.textContent = error.code==='23505' ? 'رقم الجوال أو الهوية مسجّل لمستأجر آخر.' : 'تعذّرت الإضافة. حاول مرة أخرى.'; err.classList.remove('hidden'); return; }
  tenantsView();
}
async function blockTenant(id){
  const reason = prompt('سبب الإدراج في القائمة السوداء:');
  if(!reason || reason.trim().length<3) return;
  await db.from('tenants').update({ status:'blacklisted', blacklist_reason:reason, blacklisted_at:new Date().toISOString() }).eq('id',id);
  await load.tenants(tq); renderTenants();
}
async function unblockTenant(id){
  await db.from('tenants').update({ status:'active', blacklist_reason:null, blacklisted_at:null }).eq('id',id);
  await load.tenants(tq); renderTenants();
}

init();
</script>
